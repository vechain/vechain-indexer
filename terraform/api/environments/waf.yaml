wafv2_global:
  rules:
    - global_rule: prod
      scope: CLOUDFRONT
      project_name: veworld
      waf_cloudfront_enable: true
      logs_s3_enable: true
      logs_retension: 90
      logging_redacted_fields:
        - all_query_arguments:
          body:
          method:
          query_string:
          single_header: user-agent
          single_query_argument:
          uri_path:
      logging_filter:
        - default_behavior: "COUNT"
          filter:
            - behavior: "KEEP"
              requirement: "MEETS_ALL"
              condition:
                - label_name_condition: waf-rule-label-veworld-managed-rule-set
                  action_condition:
      managed_rule_group_statement_rules:
        - name: AWSManagedRulesCommonRuleSet_rule
          priority: 10
          override_action: count
          managed_rule_group_statement:
            - name: AWSManagedRulesCommonRuleSet
              vendor_name: AWS
              excluded_rule:
                - name: NoUserAgent_HEADER
        - name: AWSManagedRulesAmazonIpReputationList_rule
          priority: 20
          override_action: count
          managed_rule_group_statement:
            - name: AWSManagedRulesAmazonIpReputationList
              vendor_name: AWS
              excluded_rule: []
        - name: AWSManagedRulesKnownBadInputsRuleSet_rule
          priority: 30
          override_action: count
          managed_rule_group_statement:
            - name: AWSManagedRulesKnownBadInputsRuleSet
              vendor_name: AWS
              excluded_rule: []
        - name: AWSManagedRulesAdminProtectionRuleSet_rule
          priority: 40
          override_action: count
          managed_rule_group_statement:
            - name: AWSManagedRulesAdminProtectionRuleSet
              vendor_name: AWS
              excluded_rule: []
        - name: AWSManagedRulesLinuxRuleSet_rule
          priority: 50
          override_action: count
          managed_rule_group_statement:
            - name: AWSManagedRulesLinuxRuleSet
              vendor_name: AWS
              excluded_rule: []
        - name: AWSManagedRulesUnixRuleSet_rule
          priority: 60
          override_action: count
          managed_rule_group_statement:
            - name: AWSManagedRulesUnixRuleSet
              vendor_name: AWS
              excluded_rule: []
        - name: AWSManagedRulesAnonymousIpList_rule
          priority: 70
          override_action: count
          managed_rule_group_statement:
            - name: AWSManagedRulesAnonymousIpList
              vendor_name: AWS
              excluded_rule: []
