# Production Environment Configuration
# This file references the shared cloudfront.yml configuration

environment: "prod"
project_name: "veworld"
region: "eu-west-1"

# CloudFront Distribution Configuration
enable_continuous_deployment: true
continuous_deployment_enabled: false
mainnet_origin_domain: "mainnet.live.prod.veworld.vechain.org"
testnet_origin_domain: "testnet.live.prod.veworld.vechain.org"

staging: false
origin_verify_header_name: "x-origin-verify"

# Default Policy IDs
default_headers_policy_id: e61eb60c-9c35-4d20-a928-2b84e02af89c
default_origin_request_policy_id: 216adef6-5c7f-47e4-b989-5492eafa07d3

# Certificate ARNs
mainnet_certificate_arn: "arn:aws:acm:us-east-1:905964754131:certificate/392c3bd4-5a0d-43b0-a204-1307fc140749"
testnet_certificate_arn: "arn:aws:acm:us-east-1:905964754131:certificate/8b66d985-6d28-46fe-9a31-c4160c736fed"

# CNAMEs (production values)
mainnet_cnames:
  - "indexer.mainnet.vechain.org"

testnet_cnames:
  - "indexer.testnet.vechain.org"
  - "test.indexer.testnet.vechain.org"

# Only paths whose origin sends no Cache-Control need one — see README.md "Caching".
cache_behaviors:
  # springdoc sends none.
  - name: "api-docs"
    path_pattern: "/api-docs"
    cache_policy_name: "10-minutes"
    header_policy_id: e61eb60c-9c35-4d20-a928-2b84e02af89c
    origin_request_policy_id: 216adef6-5c7f-47e4-b989-5492eafa07d3
    allowed_methods:
      - "GET"
      - "HEAD"
      - "OPTIONS"
    cached_methods:
      - "GET"
      - "HEAD"
    viewer_protocol_policy: "redirect-to-https"

  # /api-docs itself is matched by the exact pattern above; this catches swagger-config.
  - name: "api-docs-*"
    path_pattern: "/api-docs/*"
    cache_policy_name: "10-minutes"
    header_policy_id: e61eb60c-9c35-4d20-a928-2b84e02af89c
    origin_request_policy_id: 216adef6-5c7f-47e4-b989-5492eafa07d3
    allowed_methods:
      - "GET"
      - "HEAD"
      - "OPTIONS"
    cached_methods:
      - "GET"
      - "HEAD"
    viewer_protocol_policy: "redirect-to-https"

  # Static webjar assets, only ever change with the springdoc version.
  - name: "swagger-ui-*"
    path_pattern: "/swagger-ui/*"
    cache_policy_name: "hourly"
    header_policy_id: e61eb60c-9c35-4d20-a928-2b84e02af89c
    origin_request_policy_id: 216adef6-5c7f-47e4-b989-5492eafa07d3
    allowed_methods:
      - "GET"
      - "HEAD"
      - "OPTIONS"
    cached_methods:
      - "GET"
      - "HEAD"
    viewer_protocol_policy: "redirect-to-https"

  # Liveness must never be answered from a cache.
  - name: "actuator"
    path_pattern: "/actuator/*"
    cache_policy_name: "default"
    header_policy_id: e61eb60c-9c35-4d20-a928-2b84e02af89c
    origin_request_policy_id: 216adef6-5c7f-47e4-b989-5492eafa07d3
    allowed_methods:
      - "GET"
      - "HEAD"
      - "OPTIONS"
    cached_methods:
      - "GET"
      - "HEAD"
    viewer_protocol_policy: "redirect-to-https"
