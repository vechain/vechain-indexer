    max_ttl_seconds: 86400
    min_ttl_seconds: 86400
    query_string_behavior: "all"
    header_behavior: "none"
    cookie_behavior: "none" 
    enable_gzip: true
    enable_brotli: true

  - id: "monthly"
    name: "veworld_monthly_cache_policy"
    create_header_policy: false
    header_policy_id: 67f7725c-6f97-4210-82d7-5512b31e9d03
