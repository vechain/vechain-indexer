# Shared Configuration for CloudFront Cache Policies and WAF
# This file contains configurations that are shared between all environments

# Environment and Project Configuration
environment: "shared"
project_name: "veworld"
region: "eu-west-1"

# Cache Policy Configuration V1 - Used by staging and production
cache_policies_v1:
  - id: "default"
    name: "veworld_default_cache_policy"
    create_header_policy: false
    header_policy_id: 67f7725c-6f97-4210-82d7-5512b31e9d03
    default_ttl_seconds: 0
    max_ttl_seconds: 0
    min_ttl_seconds: 0
    query_string_behavior: "none"
    header_behavior: "none"
    cookie_behavior: "none"   
  
  - id: "hourly"
    name: "veworld_hourly_cache_policy"
    create_header_policy: false
    header_policy_id: 67f7725c-6f97-4210-82d7-5512b31e9d03
    default_ttl_seconds: 3600
    max_ttl_seconds: 3600
    min_ttl_seconds: 3600
    query_string_behavior: "all"
    header_behavior: "none"
    cookie_behavior: "none"
    enable_gzip: true
    enable_brotli: true
  
  - id: "day"
    name: "veworld_day_cache_policy"
    create_header_policy: false
    header_policy_id: 67f7725c-6f97-4210-82d7-5512b31e9d03
    default_ttl_seconds: 86400
    max_ttl_seconds: 86400
    min_ttl_seconds: 86400
    query_string_behavior: "all"
    header_behavior: "none"
    cookie_behavior: "none"
    enable_gzip: true
    enable_brotli: true
  
  - id: "weekly"
    name: "veworld_weekly_cache_policy"
    create_header_policy: false
    header_policy_id: 67f7725c-6f97-4210-82d7-5512b31e9d03
