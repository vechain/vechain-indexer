# Staging Environment Configuration
# This file references the shared cloudfront.yml configuration

environment: "staging"
project_name: "veworld"
region: "eu-west-1"

# CloudFront Distribution Configuration
enable_continuous_deployment: false
mainnet_origin_domain: "mainnet.live.prod.veworld.vechain.org"
testnet_origin_domain: "testnet.live.prod.veworld.vechain.org"

staging: true
origin_verify_header_name: "x-origin-verify"

# Default Policy IDs
default_headers_policy_id: e61eb60c-9c35-4d20-a928-2b84e02af89c
default_origin_request_policy_id: 216adef6-5c7f-47e4-b989-5492eafa07d3

# Certificate ARNs
mainnet_certificate_arn: "arn:aws:acm:us-east-1:905964754131:certificate/392c3bd4-5a0d-43b0-a204-1307fc140749"
testnet_certificate_arn: "arn:aws:acm:us-east-1:905964754131:certificate/8b66d985-6d28-46fe-9a31-c4160c736fed"

# CNAMEs (empty for staging)
