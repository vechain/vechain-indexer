server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

spring.data:
  mongodb:
    database: ${MONGO_DATABASE:vechain}
    uri: ${MONGO_URI:mongodb://localhost:27017}
    username: ${MONGO_USER_NAME:admin}
    password: ${MONGO_PASSWORD:password}