server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: 'health'
  endpoint:
    health:
      show-details: always

spring.data:
  mongodb:
    database: ${MONGO_DATABASE:vechain}
    uri: ${MONGO_URI:mongodb://localhost:27017}
    username: ${MONGO_USER_NAME:admin}
    password: ${MONGO_PASSWORD:password}