app:
  version: ${APP_VERSION:UNKNOWN}

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false
  compression:
    enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /
    # Collapsed tags and schemas render 382 DOM nodes instead of 3682; both expand on click.
    doc-expansion: none
    default-models-expand-depth: 0

logging:
  level:
    ROOT: INFO
    org:
      vechain: ${APP_LOG_LEVEL:INFO}
      springframework:
        data: INFO

timing:
  warn-threshold-ms: ${TIMING_WARN_THRESHOLD_MS:1000}
  very-slow-threshold-ms: ${TIMING_VERY_SLOW_THRESHOLD_MS:10000}

spring:
  application:
    name: vechain-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:nfts,blocks,transfers,history,stargate,vevote,vevote-historic,b3tr,explorer,accounts,validator,safe}
    group:
      validator: [delegation, prices]
      delegation: [validator]
      token-reward: [delegation]
      stargate: [delegation]
  output:
    ansi:
      enabled: always
  # PostgresConfig owns the Postgres DataSource; keep Boot's single-DataSource wiring out of the way.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcClientAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: 'health,prometheus'
  endpoint:
    health:
      show-details: always
      group:
        liveness:
          include: ping
  metrics:
    data:
      repository:
        autotime:
          enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${PROMETHEUS_METRICS_ENABLED:false}

metrics:
  project-ids:
    whitelist: ${KNOWN_PROJECT_IDS:}

# The indexer runs the migrations; the API only reads.
postgres:
  url: ${PG_URL:}
  username: ${PG_USER:api}
  password: ${PG_PASSWORD:password}
  flyway:
    enabled: false

thor:
  url: ${THOR_URL:https://testnet.vechain.org}
  rate-limit-bypass-key: ${THOR_RATE_LIMIT_BYPASS_KEY:}

# vechain.energy `PriceFeedOracle`. Each deployment configures the values matching its target
# network in terraform (mainnet for mainnet deployments, testnet for testnet). The
# defaults below are mainnet because that's the safest fallback for local dev or anywhere the
# env vars aren't set — the oracle is not deployed on solo / custom networks.
pricing:
  oracle:
    thor-url: ${PRICE_ORACLE_THOR_URL:https://mainnet.vechain.org}
    contract-address: ${PRICE_ORACLE_CONTRACT:0x49eC7192BF804Abc289645ca86F1eD01a6C17713}

vechain:
  forks:
    galactica:
      mainnet: 22084200
      testnet: 21770500
    hayabusa:
      mainnet: 23474880
      testnet: 23282280

cache:
  max-size: ${CACHE_MAX_SIZE:1000}
  ttl-seconds: ${CACHE_TTL_SECONDS:300}
  caches:
    b3tr_action_rank_counts:
      max-size: ${CACHE_B3TR_ACTION_RANK_COUNTS_MAX_SIZE:12000}
      ttl-seconds: ${CACHE_B3TR_ACTION_RANK_COUNTS_TTL_SECONDS:300}
    official_token_addresses:
      max-size: ${CACHE_OFFICIAL_TOKEN_ADDRESSES_MAX_SIZE:10}
      ttl-seconds: ${CACHE_OFFICIAL_TOKEN_ADDRESSES_TTL_SECONDS:3600}
    gmNft_countByLevelAndOwnerNot:
      max-size: ${CACHE_GM_NFT_COUNT_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_GM_NFT_COUNT_TTL_SECONDS:300}
    b3tr_richlist_total_holders:
      max-size: ${CACHE_B3TR_RICHLIST_TOTAL_HOLDERS_MAX_SIZE:10}
      ttl-seconds: ${CACHE_B3TR_RICHLIST_TOTAL_HOLDERS_TTL_SECONDS:600}
    price_feed_value:
      max-size: ${CACHE_PRICE_FEED_VALUE_MAX_SIZE:16}
      ttl-seconds: ${CACHE_PRICE_FEED_VALUE_TTL_SECONDS:30}
    validator_chain_wide_aggregates:
      max-size: ${CACHE_VALIDATOR_CHAIN_WIDE_AGGREGATES_MAX_SIZE:1}
      ttl-seconds: ${CACHE_VALIDATOR_CHAIN_WIDE_AGGREGATES_TTL_SECONDS:30}
  warmers:
    enabled: ${CACHE_WARMERS_ENABLED:true}
    tick-interval-ms: ${CACHE_WARMERS_TICK_INTERVAL_MS:60000}
    b3tr-richlist-total-holders:
      enabled: ${CACHE_B3TR_RICHLIST_TOTAL_HOLDERS_WARMER_ENABLED:true}
      refresh-interval-ms: ${CACHE_B3TR_RICHLIST_TOTAL_HOLDERS_WARMER_REFRESH_INTERVAL_MS:540000}
      stale-after-seconds: ${CACHE_B3TR_RICHLIST_TOTAL_HOLDERS_WARMER_STALE_AFTER_SECONDS:900}
