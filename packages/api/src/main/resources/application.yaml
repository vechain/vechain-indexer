server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /

logging:
  level:
    ROOT: INFO
    org:
      vechain: ${APP_LOG_LEVEL:INFO}
#      springframework:
#        data: DEBUG

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:nft-events,clauses,blocks,contracts,transactions,transfer-events,fungible-token-contracts}
  output:
    ansi:
      enabled: always

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: 'health'
  endpoint:
    health:
      show-details: always

spring.data:
  mongodb:
    auto-index-creation: false
    username: ${MONGO_USERNAME:api}
    password: ${MONGO_PASSWORD:password}
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DATABASE:vechain}
    authentication-database: ${MONGO_AUTHENTICATION_DATABASE:admin}
