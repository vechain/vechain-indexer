server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /

logging:
  level:
    ROOT: INFO
    org:
      vechain: ${APP_LOG_LEVEL:INFO}
#      springframework:
#        data: DEBUG

slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL:#{null}}

spring:
  application:
    name: vechain-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:indexer,nft-events,transactions,transfer-events,history-events,vevote-results,vevote-comments}
  output:
    ansi:
      enabled: always

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: 'health'
  endpoint:
    health:
      show-details: always

spring.data:
  mongodb:
    auto-index-creation: false
    uri: ${MONGO_URI:mongodb://api:password@localhost:27017/vechain?authSource=admin}

token:
  registry:
    url: ${TOKEN_REGISTRY_URL:https://vechain.github.io/token-registry}

thor:
  url: ${THOR_URL:http://localhost:8669}
