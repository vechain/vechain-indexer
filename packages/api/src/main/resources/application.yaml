server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /

logging:
  level:
    ROOT: INFO
    org:
      vechain: ${APP_LOG_LEVEL:INFO}
#      springframework:
#        data: DEBUG

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:nft-events,clauses,blocks,contracts,transactions,transfer-events,fungible-token-contracts}
  output:
    ansi:
      enabled: always

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: 'health'
  endpoint:
    health:
      show-details: always

spring.data:
  mongodb:
    auto-index-creation: false
    uri: ${MONGO_URI:mongodb://localhost:27017/vechain?authSource=admin}
    username: ${MONGO_USERNAME:api}
    password: ${MONGO_PASSWORD:password}

thor:
  url: ${THOR_URL:http://localhost:8669}
