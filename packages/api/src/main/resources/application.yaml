server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /

logging:
  level:
    ROOT: INFO
    org:
      vechain: ${APP_LOG_LEVEL:INFO}
      springframework:
        data: INFO

timing:
  warn-threshold-ms: ${TIMING_WARN_THRESHOLD_MS:1000}
  very-slow-threshold-ms: ${TIMING_VERY_SLOW_THRESHOLD_MS:10000}

spring:
  application:
    name: vechain-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:nfts,transactions,transfers,history,stargate,vevote-results,vevote-historic-proposals,b3tr,explorer,accounts,validator,safe}
    group:
      validator: [delegation, prices]
      delegation: [validator]
      validator-reward: [validator]
      token-reward: [delegation]
      vet-delegated-by-block: [delegation]
      stargate: [delegation]
  output:
    ansi:
      enabled: always

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: 'health'
  endpoint:
    health:
      show-details: always
      group:
        liveness:
          include: ping
  metrics:
    data:
      repository:
        autotime:
          enabled: false
  datadog:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: false

spring.data:
  mongodb:
    auto-index-creation: false
    uri: ${MONGO_URI:mongodb://api:password@localhost:27017/vechain?authSource=admin}

thor:
  url: ${THOR_URL:https://testnet.vechain.org}
  rate-limit-bypass-key: ${THOR_RATE_LIMIT_BYPASS_KEY:}

# vechain.energy `PriceFeedOracle`. Each deployment configures the values matching its target
# network in terraform (mainnet for mainnet deployments, testnet for testnet). The
# defaults below are mainnet because that's the safest fallback for local dev or anywhere the
# env vars aren't set — the oracle is not deployed on solo / custom networks.
pricing:
  oracle:
    thor-url: ${PRICE_ORACLE_THOR_URL:https://mainnet.vechain.org}
    contract-address: ${PRICE_ORACLE_CONTRACT:0x49eC7192BF804Abc289645ca86F1eD01a6C17713}

vechain:
  forks:
    galactica:
      mainnet: 22084200
      testnet: 21770500
    hayabusa:
      mainnet: 23474880
      testnet: 23282280

cache:
  max-size: ${CACHE_MAX_SIZE:1000}
  ttl-seconds: ${CACHE_TTL_SECONDS:300}
  caches:
    user_all_time_action_countByEntityType:
      max-size: ${CACHE_USER_ALL_TIME_COUNT_BY_ENTITY_TYPE_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_USER_ALL_TIME_COUNT_BY_ENTITY_TYPE_TTL_SECONDS:1200}
    user_all_time_action_countByTotalRewardAmountGreaterThanAndEntityType:
      max-size: ${CACHE_USER_ALL_TIME_COUNT_BY_TOTAL_REWARD_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_USER_ALL_TIME_COUNT_BY_TOTAL_REWARD_TTL_SECONDS:300}
    user_all_time_action_countByActionsRewardedGreaterThanAndEntityType:
      max-size: ${CACHE_USER_ALL_TIME_COUNT_BY_ACTIONS_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_USER_ALL_TIME_COUNT_BY_ACTIONS_TTL_SECONDS:300}
    app_all_time_action_countByAppId:
      max-size: ${CACHE_APP_ALL_TIME_COUNT_BY_APP_ID_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_APP_ALL_TIME_COUNT_BY_APP_ID_TTL_SECONDS:300}
    app_all_time_action_countByTotalRewardAmountGreaterThanAndAppId:
      max-size: ${CACHE_APP_ALL_TIME_COUNT_BY_TOTAL_REWARD_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_APP_ALL_TIME_COUNT_BY_TOTAL_REWARD_TTL_SECONDS:300}
    app_all_time_action_countByActionsRewardedGreaterThanAndAppId:
      max-size: ${CACHE_APP_ALL_TIME_COUNT_BY_ACTIONS_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_APP_ALL_TIME_COUNT_BY_ACTIONS_TTL_SECONDS:300}
    app_daily_action_countByAppIdAndDate:
      max-size: ${CACHE_APP_DAILY_COUNT_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_APP_DAILY_COUNT_TTL_SECONDS:300}
    app_daily_action_countByTotalRewardAmountGreaterThanAndAppIdAndDate:
      max-size: ${CACHE_APP_DAILY_COUNT_BY_TOTAL_REWARD_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_APP_DAILY_COUNT_BY_TOTAL_REWARD_TTL_SECONDS:300}
    app_daily_action_countByActionsRewardedGreaterThanAndAppIdAndDate:
      max-size: ${CACHE_APP_DAILY_COUNT_BY_ACTIONS_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_APP_DAILY_COUNT_BY_ACTIONS_TTL_SECONDS:300}
    app_round_countByAppIdAndRoundId:
      max-size: ${CACHE_APP_ROUND_COUNT_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_APP_ROUND_COUNT_TTL_SECONDS:300}
    app_round_countByTotalRewardAmountGreaterThanAndAppIdAndRoundId:
      max-size: ${CACHE_APP_ROUND_COUNT_BY_TOTAL_REWARD_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_APP_ROUND_COUNT_BY_TOTAL_REWARD_TTL_SECONDS:300}
    app_round_countByActionsRewardedGreaterThanAndAppIdAndRoundId:
      max-size: ${CACHE_APP_ROUND_COUNT_BY_ACTIONS_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_APP_ROUND_COUNT_BY_ACTIONS_TTL_SECONDS:300}
    user_daily_action_countByTotalRewardAmountGreaterThanAndEntityTypeAndDate:
      max-size: ${CACHE_USER_DAILY_COUNT_BY_TOTAL_REWARD_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_USER_DAILY_COUNT_BY_TOTAL_REWARD_TTL_SECONDS:300}
    user_daily_action_countByActionsRewardedGreaterThanAndEntityTypeAndDate:
      max-size: ${CACHE_USER_DAILY_COUNT_BY_ACTIONS_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_USER_DAILY_COUNT_BY_ACTIONS_TTL_SECONDS:300}
    user_daily_action_countByEntityTypeAndDate:
      max-size: ${CACHE_USER_DAILY_COUNT_BY_ENTITY_TYPE_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_USER_DAILY_COUNT_BY_ENTITY_TYPE_TTL_SECONDS:300}
    user_round_countByTotalRewardAmountGreaterThanAndEntityTypeAndRoundId:
      max-size: ${CACHE_USER_ROUND_COUNT_BY_TOTAL_REWARD_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_USER_ROUND_COUNT_BY_TOTAL_REWARD_TTL_SECONDS:300}
    user_round_countByActionsRewardedGreaterThanAndEntityTypeAndRoundId:
      max-size: ${CACHE_USER_ROUND_COUNT_BY_ACTIONS_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_USER_ROUND_COUNT_BY_ACTIONS_TTL_SECONDS:300}
    user_round_countByEntityTypeAndRoundId:
      max-size: ${CACHE_USER_ROUND_COUNT_BY_ENTITY_TYPE_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_USER_ROUND_COUNT_BY_ENTITY_TYPE_TTL_SECONDS:300}
    official_token_addresses:
      max-size: ${CACHE_OFFICIAL_TOKEN_ADDRESSES_MAX_SIZE:10}
      ttl-seconds: ${CACHE_OFFICIAL_TOKEN_ADDRESSES_TTL_SECONDS:3600}
    gmNft_countByLevelAndOwnerNot:
      max-size: ${CACHE_GM_NFT_COUNT_MAX_SIZE:1000}
      ttl-seconds: ${CACHE_GM_NFT_COUNT_TTL_SECONDS:300}
    b3tr_richlist_total_holders:
      max-size: ${CACHE_B3TR_RICHLIST_TOTAL_HOLDERS_MAX_SIZE:10}
      ttl-seconds: ${CACHE_B3TR_RICHLIST_TOTAL_HOLDERS_TTL_SECONDS:600}
    price_feed_value:
      max-size: ${CACHE_PRICE_FEED_VALUE_MAX_SIZE:16}
      ttl-seconds: ${CACHE_PRICE_FEED_VALUE_TTL_SECONDS:30}
    validator_chain_wide_aggregates:
      max-size: ${CACHE_VALIDATOR_CHAIN_WIDE_AGGREGATES_MAX_SIZE:1}
      ttl-seconds: ${CACHE_VALIDATOR_CHAIN_WIDE_AGGREGATES_TTL_SECONDS:30}
  warmers:
    enabled: ${CACHE_WARMERS_ENABLED:true}
    tick-interval-ms: ${CACHE_WARMERS_TICK_INTERVAL_MS:60000}
    b3tr-richlist-total-holders:
      enabled: ${CACHE_B3TR_RICHLIST_TOTAL_HOLDERS_WARMER_ENABLED:true}
      refresh-interval-ms: ${CACHE_B3TR_RICHLIST_TOTAL_HOLDERS_WARMER_REFRESH_INTERVAL_MS:540000}
    global-overview-counts:
      enabled: ${CACHE_GLOBAL_OVERVIEW_COUNTS_WARMER_ENABLED:true}
      refresh-interval-ms: ${CACHE_GLOBAL_OVERVIEW_COUNTS_WARMER_REFRESH_INTERVAL_MS:900000}
