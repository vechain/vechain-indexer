services:
  # Overrides api and indexer containers to configure them for e2e tests
  vechain-indexer:
    env_file: packages/e2e/indexer.env
    environment:
      - BLACKLIST_CONTRACT_ADDRESS=${BLACKLIST_CONTRACT_ADDRESS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vechain-thor-e2e
      - vechain-indexer-network

  vechain-indexer-api:
    env_file: packages/e2e/api.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vechain-thor-e2e
      - vechain-indexer-network

  postgres:
    extends:
      file: ../../database/docker-compose-postgres.yaml
      service: postgres
    restart: "no"

networks:
  vechain-thor-e2e:
    external: true
    name: vechain-thor-e2e