# Test Configuration - Prevents indexers from auto-starting

# MongoDB (with authentication)
spring.data.mongodb.uri=mongodb://indexer:password@localhost:27017/vechain?authSource=admin

# Thor Node
thor.url=https://mainnet.vechain.org

# Disable auto-start of indexers
spring.main.lazy-initialization=true

# Indexer Configuration
indexer.sync-log-interval=100
indexer.channel-batch-size=50
indexer.sync-block-batch-size.stargate=500
indexer.sync-block-batch-size.b3tr=500
indexer.sync-block-batch-size.validator=50

# Start blocks (not used in tests but required by config)
indexer.start-block.history=23430500
indexer.start-block.validator=23430500
indexer.start-block.delegation=23430500
indexer.start-block.transactions=23430500
indexer.start-block.transfer=23430500
indexer.start-block.accounts=23430500
indexer.start-block.nft=23430500
indexer.start-block.stargate=23430500
indexer.start-block.stargate-token=23430500
indexer.start-block.amn=23430500
indexer.start-block.block-usage=23430500

# Validator specific
indexer.validator-stats-threshold-blocks=25

# Pruner settings
indexer.pruner.record-limit=1000000
indexer.pruner.removal-chunk-size=1000

# Health check
indexer.healthcheck.inactive-threshold-syncing=3600
indexer.healthcheck.inactive-threshold-not-syncing=7200

