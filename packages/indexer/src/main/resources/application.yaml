server:
  ssl:
    trusted-certificates: /etc/ssl/cert.pem
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: vechain-indexer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:indexer,nfts,transactions,transfers,history}
  output:
    ansi:
      enabled: always

timing:
  warn-threshold-ms: ${TIMING_WARN_THRESHOLD_MS:1000}
  very-slow-threshold-ms: ${TIMING_VERY_SLOW_THRESHOLD_MS:10000}

slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL:#{null}}

logging:
  level:
    ROOT: INFO
    org:
      vechain:
        indexer:
          timing: ${TIMING_LOG_LEVEL:INFO}
          pruner: ${PRUNER_LOG_LEVEL:INFO}
        '*': ${APP_LOG_LEVEL:INFO}
      springframework:
        data: INFO
#      mongodb.driver.protocol.command: DEBUG

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: 'health'
  endpoint:
    health:
      show-details: always

spring.data:
  mongodb:
    uri: ${MONGO_URI:mongodb://indexer:password@localhost:27017/vechain?authSource=admin}

thor:
  url: ${THOR_URL:https://mainnet.vechain.org}

abis:
  path: ${ABI_PATH:abis}

business-event:
  substitutions:
    B3TR_CONTRACT: ${B3TR_CONTRACT:0x5ef79995fe8a89e0812330e4378eb2660cede699}
    VOT3_CONTRACT: ${VOT3_CONTRACT:0x76ca782b59c74d088c7d2cce2f211bc00836c602}
    EMISSIONS: ${EMISSIONS_CONTRACT:0x148d21032f4a7b4aef236e2e9c0c5bf62d10f8eb}
    B3TR_GOVERNOR_CONTRACT: ${B3TR_GOVERNOR_CONTRACT:0x1c65c25fabe2fc1bcb82f253fa0c916a322f777c}
    GM_NFT_CONTRACT: ${GM_NFT_CONTRACT:0x93b8cd34a7fc4f53271b9011161f7a2b5fea9d1f}
    X_ALLOC_VOTING_CONTRACT: ${X_ALLOC_VOTING_CONTRACT:0x89a00bb0947a30ff95beef77a66aede3842fe5b7}
    X2EARN_REWARDS_POOL_CONTRACT: ${X2EARN_REWARDS_POOL_CONTRACT:0x6bee7ddab6c99d5b2af0554eaea484ce18f52631}
    VOTER_REWARDS_CONTRACT: ${VOTER_REWARDS_CONTRACT:0x838a33af756a6366f93e201423e1425f67ec0fa7}
    TREASURY_CONTRACT: ${TREASURY_CONTRACT:0xd5903bcc66e439c753e525f8af2fec7be2429593}
    STARGATE_DELEGATION_CONTRACT: ${STARGATE_DELEGATION_CONTRACT:0x4cb1c9ef05b529c093371264fab2c93cc6cddb0e}
    STARGATE_NFT_CONTRACT: ${STARGATE_NFT_CONTRACT:0x2fd6240f2eeef39b213c600c70ad2ab64753db6d}
    VEVOTE_CONTRACT: ${VEVOTE_CONTRACT:0xe1ecc51fc02c29e54b428279c0456010fda5c4f2}
    STARGATE_CONTRACT: ${STARGATE_CONTRACT:0x35ce14062457ef7817e10bbc3815317f5a07d695}
    BUILTIN_STAKER_CONTRACT: ${BUILTIN_STAKER_CONTRACT:0x00000000000000000000000000005374616B6572}
    GET_ALL_VALIDATORS_CONTRACT: ${GET_ALL_VALIDATORS_CONTRACT:0xceafcbd80aea95b41fc9cc90b9bbf892f6b06f6a}
veworld:
  contract:
    authority-node:
      address: ${AUTHORITY_CONTRACT:0x0000000000000000000000417574686f72697479}
    historic-proposals:
      steering-committee: ${STEERING_COMMITTEE_ADDRESS:0x7E54f0790153647Ec0651c35cEd28171Adb5D44A}
      all-stakeholders: ${ALL_STAKEHOLDERS_ADDRESS:0xA6416A72F816d3a69f33D0814700545C8E3fe4BE}
      legacy-descriptions: ${LEGACY_DESCRIPTIONS_ADDRESS:0x6957f76d0749EbF4d098F5EDba1F657635F0D483}
scheduler:
  delegationHistory:
    initial-delay: ${DELEGATION_HISTORY_INITIAL_DELAY:30s}
    interval: ${DELEGATION_HISTORY_INTERVAL:30s}

indexer:
  start-block:
    nfts: ${INDEXER_START_BLOCK_NFTS:0}
    nft-blacklist: ${INDEXER_START_BLOCK_NFT_BLACKLIST:0}
    transactions: ${INDEXER_START_BLOCK_TRANSACTIONS:0}
    transfers: ${INDEXER_START_BLOCK_TRANSFERS:0}
    history: ${INDEXER_START_BLOCK_HISTORY:0}
    vevote: ${INDEXER_START_BLOCK_VEVOTE:0}
    stargate: ${INDEXER_START_BLOCK_STARGATE:0}
    b3tr: ${INDEXER_START_BLOCK_B3TR:0}
    b3tr-x-alloc-result: ${INDEXER_START_BLOCK_B3TR_X_ALLOC_RESULT:0}
    b3tr-proposal: ${INDEXER_START_BLOCK_B3TR_PROPOSAL:0}
    b3tr-sustainable-actions: ${INDEXER_START_BLOCK_B3TR_SUSTAINABLE_ACTIONS:0}
    historic-proposals: ${INDEXER_START_BLOCK_HISTORIC_PROPOSALS:0}
    validator: ${INDEXER_START_BLOCK_VALIDATOR:0}
    delegation: ${INDEXER_START_BLOCK_DELEGATION:0}
  validator-stats-threshold-blocks: ${INDEXER_VALIDATOR_STATS_THRESHOLD_BLOCKS:25}
  stop-block:
    historic-proposals: ${INDEXER_STOP_BLOCK_HISTORIC_PROPOSALS:22948372}
  start-round:
    b3tr-sustainable-actions: ${START_ROUND_B3TR_SUSTAINABLE_ACTIONS:4}
  sync-log-interval: ${INDEXER_SYNC_LOG_INTERVAL:100}
  sync-block-batch-size:
    nfts: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_NFTS:500}
    transfers: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_TRANSFERS:500}
    vevote: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_VEVOTE:500}
    stargate: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_STARGATE:500}
    authority-nodes: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_AUTHORITY_NODES:500}
    b3tr: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_B3TR:500}
    historic-proposals: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_HISTORIC_PROPOSALS:500}
  channel-batch-size: ${INDEXER_CHANNEL_BATCH_SIZE:10}
  pruner:
    interval: ${PRUNER_INTERVAL:3000}
    removal-chunk-size: ${PRUNER_REMOVAL_CHUNK_SIZE:10000}
    record-limit: ${PRUNER_RECORD_LIMIT:200000}
  blacklist:
    contract-address: ${BLACKLIST_CONTRACT_ADDRESS:0x0f9b01618cd5e0030f8e26ff61bc1349cb9eb8d5}
  version:
    nfts: ${VERSION_NFTS:1}
    transfers: ${VERSION_TRANSFERS:1}
    transactions: ${VERSION_TRANSACTIONS:1}
    history: ${VERSION_HISTORY:1}
    nft-blacklist: ${VERSION_NFT_BLACKLIST:1}
    vevote-comments: ${VERSION_VEVOTE_COMMENTS:1}
    vevote-results: ${VERSION_VEVOTE_RESULTS:1}
    stargate-vtho-claimed-by-block: ${VERSION_STARGATE_VTHO_CLAIMED_BY_BLOCK:1}
    stargate-vtho-generated-by-block: ${VERSION_STARGATE_VTHO_GENERATED_BY_BLOCK:1}
    stargate-vtho-claimed-by-account: ${VERSION_STARGATE_VTHO_CLAIMED_BY_ACCOUNT:1}
    stargate-nft-holders-by-block: ${VERSION_STARGATE_NFT_HOLDERS_BY_BLOCK:1}
    stargate-vet-staked-by-block: ${VERSION_STARGATE_VET_STAKED_BY_BLOCK:1}
    stargate-vet-delegated-by-block: ${VERSION_STARGATE_VET_DELEGATED_BY_BLOCK:1}
    authority-node-endorser: ${VERSION_AUTHORITY_NODE_ENDORSER:1}
    historic-proposals: ${VERSION_HISTORIC_PROPOSALS:1}
    b3tr-proposal-comments: ${VERSION_B3TR_PROPOSAL_COMMENTS:1}
    b3tr-proposal-results: ${VERSION_B3TR_PROPOSAL_RESULTS:1}
    b3tr-user-all-time-action-summary: ${VERSION_B3TR_USER_ALL_TIME_ACTION_SUMMARY:1}
    b3tr-user-round-action-summary: ${VERSION_B3TR_USER_ROUND_ACTION_SUMMARY:1}
    b3tr-user-daily-action-summary: ${VERSION_B3TR_USER_DAILY_ACTION_SUMMARY:1}
    b3tr-app-all-time-action-summary: ${VERSION_B3TR_APP_ALL_TIME_ACTION_SUMMARY:1}
    b3tr-app-round-action-summary: ${VERSION_B3TR_APP_ROUND_ACTION_SUMMARY:1}
    b3tr-app-daily-action-summary: ${VERSION_B3TR_APP_DAILY_ACTION_SUMMARY:1}
    b3tr-x-alloc-result: ${VERSION_B3TR_X_ALLOC_RESULT:1}
    b3tr-gm-nft: ${VERSION_B3TR_GM_NFT:1}
    b3tr-gm-nft-level-overview: ${VERSION_B3TR_GM_NFT_LEVEL_OVERVIEW:1}
    block-usage: ${VERSION_BLOCK_USAGE:1}
    validator: ${VERSION_VALIDATOR:1}
    validator-rewards: ${VERSION_VALIDATOR_BLOCKS:1}
    stargate-token: ${VERSION_STARGATE_TOKEN:1}
  healthcheck:
    inactive-threshold-syncing: ${HEALTHCHECK_INACTIVE_THRESHOLD_SYNCING:120}
    inactive-threshold-not-syncing: ${HEALTHCHECK_INACTIVE_THRESHOLD_NOT_SYNCING:600}

comments:
  min-length: ${MIN_COMMENT_LEN:10}
  language:
    confidence: ${LANGUAGE_CONFIDENCE:0.9}
