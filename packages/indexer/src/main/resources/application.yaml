server:
  ssl:
    trusted-certificates: /etc/ssl/cert.pem
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: vechain-indexer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:indexer,nfts,transactions,transfers,history,stargate,authority-nodes,vevote-results,vevote-historic-proposals,b3tr,explorer,accounts}
  output:
    ansi:
      enabled: always

timing:
  warn-threshold-ms: ${TIMING_WARN_THRESHOLD_MS:1000}
  very-slow-threshold-ms: ${TIMING_VERY_SLOW_THRESHOLD_MS:10000}

slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL:#{null}}

logging:
  level:
    ROOT: INFO
    org:
      vechain:
        indexer:
          timing: ${TIMING_LOG_LEVEL:INFO}
          pruner: ${PRUNER_LOG_LEVEL:INFO}
        '*': ${APP_LOG_LEVEL:INFO}
      springframework:
        data: INFO
      mongodb.driver.protocol.command: ${MONGO_DRIVER_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: always
      group:
        liveness:
          include: ping
  metrics:
    tags:
      indexer-id: ${METRICS_ID:local-indexer}
  datadog:
    metrics:
      export:
        enabled: ${DD_METRICS_ENABLED:false}
        apiKey: ${DD_API_KEY:#{null}}
        applicationKey: ${DD_APP_KEY:#{null}}
        uri: ${DD_API_URL:https://api.datadoghq.eu}
        # how often to send metrics
        step: 10s
        # make this unique like prod-green-indexer, etc.
        hostTag: ${DD_HOST_TAG:#{null}}
  prometheus:
    metrics:
      export:
        enabled: ${PROMETHEUS_METRICS_ENABLED:true}
        step: 10s

spring.data:
  mongodb:
    uri: ${MONGO_URI:mongodb://indexer:password@localhost:27017/vechain?authSource=admin}

thor:
  url: ${THOR_URL:https://mainnet.vechain.org}

vechain:
  forks:
    galactica:
      mainnet: 22084200
      testnet: 21770500
    hayabusa:
      mainnet: 23414400
      testnet: 23221800

abis:
  path: ${ABI_PATH:abis}

business-event:
  substitutions:
    B3TR_CONTRACT: ${B3TR_CONTRACT:0x5ef79995fe8a89e0812330e4378eb2660cede699}
    VOT3_CONTRACT: ${VOT3_CONTRACT:0x76ca782b59c74d088c7d2cce2f211bc00836c602}
