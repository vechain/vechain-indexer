server:
  ssl:
    trusted-certificates: /etc/ssl/cert.pem
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  output:
    ansi:
      enabled: always

logging:
  pattern:
    console: "%date | %highlight(%-5level) | %cyan(%-40.40logger{40}) | %msg %n"
  level:
    org.vechain: ${APP_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: 'health'
  endpoint:
    health:
      show-details: always

spring.data:
  mongodb:
    uri: ${MONGO_URI:mongodb://admin:password@localhost:27017/vechain?directConnection=true&authMechanism=SCRAM-SHA-1&authSource=admin}
    auto-index-creation: true

thor:
  url: ${THOR_URL:http://localhost:8669}