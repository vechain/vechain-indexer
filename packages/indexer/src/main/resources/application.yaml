server:
  ssl:
    trusted-certificates: /etc/ssl/cert.pem

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: 'health'
  endpoint:
    health:
      show-details: always

spring.data:
  mongodb:
    database: ${MONGO_DATABASE:vechain}
    uri: ${MONGO_URI:mongodb://localhost:27017}
    username: ${MONGO_USER_NAME:admin}
    password: ${MONGO_PASSWORD:password}
    auto-index-creation: true

thor:
  url: ${THOR_URL:http://localhost:8669}