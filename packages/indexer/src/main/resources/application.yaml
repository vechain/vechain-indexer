server:
  ssl:
    trusted-certificates: /etc/ssl/cert.pem
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:indexer,nft-events,transactions,transfer-events}
  output:
    ansi:
      enabled: always

logging:
  level:
    ROOT: INFO
    org:
      vechain: ${APP_LOG_LEVEL:INFO}
      springframework:
        data: INFO

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: 'health'
  endpoint:
    health:
      show-details: always

spring.data:
  mongodb:
    username: ${MONGO_USERNAME:indexer}
    password: ${MONGO_PASSWORD:password}
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DATABASE:vechain}
    authentication-database: ${MONGO_AUTHENTICATION_DATABASE:admin}
    auto-index-creation: false

thor:
  url: ${THOR_URL:http://localhost:8669}

indexer:
  startBlock:
    blocks: ${INDEXER_START_BLOCK_BLOCKS:0}
    clauses: ${INDEXER_START_BLOCK_CLAUSES:0}
    contracts: ${INDEXER_START_BLOCK_CONTRACTS:1}
    nfts: ${INDEXER_START_BLOCK_NFTS:0}
    transactions: ${INDEXER_START_BLOCK_TRANSACTIONS:0}
    transfers: ${INDEXER_START_BLOCK_TRANSFERS:0}