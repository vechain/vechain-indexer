server:
  ssl:
    trusted-certificates: /etc/ssl/cert.pem
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:indexer,nft-events,clauses,blocks,contracts,transactions,transfer-events,fungible-token-contracts}
  output:
    ansi:
      enabled: always

logging:
  level:
    ROOT: INFO
    org:
      vechain: ${APP_LOG_LEVEL:INFO}
      springframework:
        data: INFO

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: 'health'
  endpoint:
    health:
      show-details: always

spring.data:
  mongodb:
    uri: ${MONGO_URI:mongodb://indexer:password@localhost:27017/vechain?authSource=admin}
    auto-index-creation: false

thor:
  url: ${THOR_URL:http://localhost:8669}

indexer:
  startBlock:
    blocks: ${INDEXER_START_BLOCK_BLOCKS:0}
    clauses: ${INDEXER_START_BLOCK_CLAUSES:0}
    contracts: ${INDEXER_START_BLOCK_CONTRACTS:1}
    fungibleTokens: ${INDEXER_START_BLOCK_FUNGIBLE_TOKENS:0}
    nfts: ${INDEXER_START_BLOCK_NFTS:0}
    transactions: ${INDEXER_START_BLOCK_TRANSACTIONS:0}
    transfers: ${INDEXER_START_BLOCK_TRANSFERS:0}
  syncLoggerInterval:
    blocks: ${INDEXER_SYNC_LOGGER_INTERVAL_BLOCKS:1000}
    clauses: ${INDEXER_SYNC_LOGGER_INTERVAL_CLAUSES:1000}
    contracts: ${INDEXER_SYNC_LOGGER_INTERVAL_CONTRACTS:1000}
    fungibleTokens: ${INDEXER_SYNC_LOGGER_INTERVAL_FUNGIBLE_TOKENS:1000}
    nfts: ${INDEXER_SYNC_LOGGER_INTERVAL_NFTS:1000}
    transactions: ${INDEXER_SYNC_LOGGER_INTERVAL_TRANSACTIONS:1000}
    transfers: ${INDEXER_SYNC_LOGGER_INTERVAL_TRANSFERS:1000}

mongock:
  migration-scan-package:
    org.vechain.indexer.migration
  transaction-enabled: false
