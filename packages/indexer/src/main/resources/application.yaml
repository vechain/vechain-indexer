server:
  ssl:
    trusted-certificates: /etc/ssl/cert.pem
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  output:
    ansi:
      enabled: always

logging:
  level:
    ROOT: INFO
    org:
      vechain: ${APP_LOG_LEVEL:INFO}
      springframework:
        data: DEBUG

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: 'health'
  endpoint:
    health:
      show-details: always

spring.data:
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/vechain?directConnection=true}
    #uri: mongodb://localhost:27017/vechain?directConnection=true
    auto-index-creation: true

thor:
  url: ${THOR_URL:http://localhost:8669}
  genesis:
    block:
      #Test = 0x000000000b2bce3c70bc649a02749e8687721b09ed2e15997f466536b20bb127
      id: ${THOR_GENESIS_ID:0x00000000c05a20fbca2bf6ae3affba6af4a74b800b585bf7a4988aba7aea69f6}