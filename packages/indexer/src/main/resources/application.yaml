    vet-staked-by-block: ${INDEXER_START_BLOCK_VET_STAKED_BY_BLOCK:0}
    vet-delegated-by-block: ${INDEXER_START_BLOCK_VET_DELEGATED_BY_BLOCK:0}
    nft-holders-by-block: ${INDEXER_START_BLOCK_NFT_HOLDERS_BY_BLOCK:0}
  validator-stats-threshold-blocks: ${INDEXER_VALIDATOR_STATS_THRESHOLD_BLOCKS:25}
  stop-block:
    historic-proposals: ${INDEXER_STOP_BLOCK_HISTORIC_PROPOSALS:22948372}
  start-round:
    b3tr-sustainable-actions: ${START_ROUND_B3TR_SUSTAINABLE_ACTIONS:4}
  sync-log-interval: ${INDEXER_SYNC_LOG_INTERVAL:100}
  sync-block-batch-size:
    contracts: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_CONTRACTS:100}
    vet-balance: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_VET_BALANCE:100}
    nfts: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_NFTS:100}
    transfers: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_TRANSFERS:100}
    vevote: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_VEVOTE:100}
    stargate: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_STARGATE:100}
    authority-nodes: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_AUTHORITY_NODES:100}
    b3tr: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_B3TR:100}
    b3tr-treasury: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_B3TR_TREASURY:100}
    b3tr-balance: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_B3TR_BALANCE:100}
    historic-proposals: ${INDEXER_SYNC_BLOCK_BATCH_SIZE_HISTORIC_PROPOSALS:100}
  channel-batch-size: ${INDEXER_CHANNEL_BATCH_SIZE:10}
  pruner:
    enabled: ${PRUNER_ENABLED:true}
    interval: ${PRUNER_INTERVAL:3000}
    removal-chunk-size: ${PRUNER_REMOVAL_CHUNK_SIZE:10000}
    record-limit: ${PRUNER_RECORD_LIMIT:200000}
  blacklist:
    contract-address: ${BLACKLIST_CONTRACT_ADDRESS:0x0f9b01618cd5e0030f8e26ff61bc1349cb9eb8d5}
  version:
