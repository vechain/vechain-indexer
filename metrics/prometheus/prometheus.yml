global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'indexer'
    static_configs:
      - targets: ['vechain-indexer:2112']
    metrics_path: /metrics

  - job_name: 'indexer-local'
    static_configs:
      - targets: [ 'host.docker.internal:2112' ]
    metrics_path: /metrics