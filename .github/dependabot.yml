version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  labels:
    - "increment:patch"
  cooldown:
    default-days: 7

- package-ecosystem: npm
  directory: /load-testing
  schedule:
    interval: monthly
  labels:
    - "increment:patch"
  cooldown:
    default-days: 14
