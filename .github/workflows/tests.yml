name: Tests

on:
  pull_request:
  push:
    branches:
      - 'main'
env:
  COMPOSE_BAKE: "true"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.head_ref || github.ref_name }}-build-test
  cancel-in-progress: true

jobs:
  detect-code-changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.filter.outputs.code_changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            code_changed:
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.java'
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - 'packages/**'
              - 'tools/**'
              - 'build.gradle'
              - 'build.gradle.kts'
              - 'settings.gradle'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'Makefile'
              - '**/Dockerfile*'

  check-formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    needs: detect-code-changes
    steps:
      - name: No formatting changes detected
        if: needs.detect-code-changes.outputs.run-tests != 'true'
        run: echo "No code changes detected; skipping formatting checks."

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: needs.detect-code-changes.outputs.run-tests == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        if: needs.detect-code-changes.outputs.run-tests == 'true'
        with:
          distribution: "oracle"
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        if: needs.detect-code-changes.outputs.run-tests == 'true'

      - name: Gradle Spotless
        if: needs.detect-code-changes.outputs.run-tests == 'true'
        run: ./gradlew spotlessCheck

  unit-tests:
    strategy:
      matrix:
        package: [api, indexer, common]
      fail-fast: false
    name: Unit Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: detect-code-changes
    permissions:
      contents: read
      checks: write
    steps:
      - name: No code changes detected
        if: needs.detect-code-changes.outputs.run-tests != 'true'
        run: echo "No code changes detected; skipping unit tests."

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: needs.detect-code-changes.outputs.run-tests == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        if: needs.detect-code-changes.outputs.run-tests == 'true'
        with:
          distribution: 'oracle'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        if: needs.detect-code-changes.outputs.run-tests == 'true'

      - name: Unit Test (${{ matrix.package }})
        if: needs.detect-code-changes.outputs.run-tests == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :packages:${{ matrix.package }}:test

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: (success() || failure()) && needs.detect-code-changes.outputs.run-tests == 'true'
        with:
          report_paths: packages/${{ matrix.package }}/build/test-results/test/TEST-*.xml
          fail_on_failure: false
          detailed_summary: true
          include_passed: true

      - name: Copy HTML Test Reports
        if: github.ref == 'refs/heads/main' && needs.detect-code-changes.outputs.run-tests == 'true'
        run: |
          mkdir -p "static/${{ matrix.package }}"
          if [ -d "packages/${{ matrix.package }}/build/reports/jacoco/test/html" ]; then
            cp -r "packages/${{ matrix.package }}/build/reports/jacoco/test/html" "static/${{ matrix.package }}/coverage"
            cp -r "packages/${{ matrix.package }}/build/reports/tests/test" "static/${{ matrix.package }}/tests"
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main' && needs.detect-code-changes.outputs.run-tests == 'true'
        with:
          name: test-results-${{ matrix.package }}-${{ github.head_ref || github.ref_name }}
          retention-days: 1
          path: static/

  result:
    name: Result
    runs-on: ubuntu-latest
    needs: [check-formatting, unit-tests, e2e-tests]
    if: always()
    steps:
      - name: Check if tests were skipped
        run: |
          if [[ "${{ needs.check-formatting.result }}" == "skipped" && "${{ needs.unit-tests.result }}" == "skipped" && "${{ needs.e2e-tests.result }}" == "skipped" ]]; then
            echo "✓ No code changes detected; tests skipped (passing)"
            exit 0
          fi

          if [[ "${{ needs.check-formatting.result }}" == "failure" || "${{ needs.unit-tests.result }}" == "failure" || "${{ needs.e2e-tests.result }}" == "failure" ]]; then
            echo "✗ Tests failed"
            exit 1
          fi

          echo "✓ All tests passed"
          exit 0

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-24.04-arm
    needs: detect-code-changes
    permissions:
      contents: read
      checks: write
    env:
      CACHE_SCOPE_PREFIX: "e2e-"
    steps:
      - name: No code changes detected
        if: needs.detect-code-changes.outputs.run-tests != 'true'
        run: echo "No code changes detected; skipping E2E tests."

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: needs.detect-code-changes.outputs.run-tests == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        if: needs.detect-code-changes.outputs.run-tests == 'true'
        with:
          distribution: 'oracle'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        if: needs.detect-code-changes.outputs.run-tests == 'true'

      - name: Create gradle properties for Docker secrets
        if: needs.detect-code-changes.outputs.run-tests == 'true'
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.gradle"
          {
            echo "gpr.user=${GH_USER}"
            echo "gpr.key=${GH_TOKEN}"
          } >> "$HOME/.gradle/gradle.properties"

      - name: E2E Test
        if: needs.detect-code-changes.outputs.run-tests == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make test-e2e

      - name: Debug E2E
        if: failure() && needs.detect-code-changes.outputs.run-tests == 'true'
        run: |
          echo "ℹ️ Docker and compose versions"
          docker --version
          docker compose version
          echo "ℹ️ Networks"
          docker network ls
          docker network inspect vechain-indexer-network || true
          docker network inspect vechain-thor-e2e || true
          echo "ℹ️ Containers"
          docker ps -a
          echo "ℹ️ Thor Script Logs"
          docker logs thor-thor-tx-script-1
          echo "ℹ️ API Logs"
          docker logs vechain-indexer-api
          echo "ℹ️ Indexer Logs"
          docker logs vechain-indexer

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: (success() || failure()) && needs.detect-code-changes.outputs.run-tests == 'true'
        with:
          report_paths: packages/e2e/build/test-results/test/TEST-*.xml
          fail_on_failure: false
          detailed_summary: true
          include_passed: true

      - name: Copy HTML Test Report
        if: github.ref == 'refs/heads/main' && needs.detect-code-changes.outputs.run-tests == 'true'
        run: |
          mkdir -p static/e2e
          if [ -d "packages/e2e/build/reports/jacoco/test/html" ]; then
            cp -r packages/e2e/build/reports/jacoco/test/html static/e2e/coverage
            cp -r packages/e2e/build/reports/tests/test static/e2e/tests
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main' && needs.detect-code-changes.outputs.run-tests == 'true'
        with:
          name: test-results-e2e-${{ github.head_ref || github.ref_name }}
          retention-days: 1
          path: static/e2e
