name: Codebase Versioning

on:
  pull_request:
    branches:
      - main
    types: [closed]

# The upstream job reads the newest tag, then pushes the next one. Merging a stack fires several
# at once, they all read the same tag, and every loser's push is rejected. Serialising them means
# each reads a tag the one before it has already pushed.
concurrency:
  group: codebase-versioning
  cancel-in-progress: false

permissions: {}

jobs:
  semantic-versioning:
    uses: vechain/github-actions-public/.github/workflows/semantic-versioning.yaml@f54f69d33344b241b5ec901d3d5e1b02d44a1b96 # v2.3.0
    secrets:
      DEPLOY_KEY: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}
