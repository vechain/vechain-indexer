name: Test, Publish & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

jobs:
  test-gradle:
    uses: ./.github/workflows/test-gradle.yml

  publish-test-results:
    uses: ./.github/workflows/publish-test-results.yml
    needs: test-gradle

  vulnerability-scan:
    uses: ./.github/workflows/vulnerability-scan.yml

  publish-images-to-ecr-dev:
    uses: ./.github/workflows/publish-images.yml
    needs: [test-gradle]
    with:
      imageTag: ${{ github.sha }}
      latestTag: dev-latest
      env: dev
    secrets: inherit

  publish-images-to-ecr-prod:
    uses: ./.github/workflows/publish-images.yml
    needs: [test-gradle]
    with:
      imageTag: ${{ github.sha }}
      latestTag: prod-latest
      env: prod
    secrets: inherit

  identify-live-color:
    uses: ./.github/workflows/identify-live-color.yml
    with:
      dns_record_name: indexer.mainnet.vechain.org.
      hosted_zone_id: Z058676337BU4AOFL6DMM
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  deploy-dead-color:
    # To be used as testing/dev environment, deployed only if environment already exists
    uses: ./.github/workflows/plan-or-deploy-environment.yml
    needs: [publish-images-to-ecr-dev, identify-live-color]
    with:
      environment: prod
      workspace: ${{ needs.identify-live-color.outputs.dead_color }}
    permissions:
      packages: read
      contents: read
      id-token: write
    secrets: inherit
