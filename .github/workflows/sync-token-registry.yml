name: Sync Token Registry

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Refresh bundled token registry
        run: bash scripts/refresh_token_registry.sh

      - name: Verify token registry parsing tests
        run: ./gradlew :packages:api:test --tests "org.vechain.indexer.transfer.OfficialTokenServiceTest"

      - name: Create or update sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-token-registry
          commit-message: "chore: refresh token registry fallback"
          title: "chore: refresh token registry fallback"
          body: |
            Refreshes the bundled token registry fallback files from the upstream VeChain token registry.

            Generated by `.github/workflows/sync-token-registry.yml`.
          delete-branch: true
          add-paths: |
            packages/api/src/main/resources/token-registry/main.json
            packages/api/src/main/resources/token-registry/test.json
