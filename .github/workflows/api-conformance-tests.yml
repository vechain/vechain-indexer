name: API Conformance Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        default: dead
        required: false
        type: choice
        options:
          - dead
          - live
      network:
        description: "Target network"
        default: mainnet
        required: false
        type: choice
        options:
          - mainnet
          - testnet
          - both
      custom_url:
        description: "Override base URL (takes precedence over environment+network)"
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dead/live)"
        required: false
        type: string
        default: dead
      network:
        description: "Target network (mainnet/testnet/both)"
        required: false
        type: string
        default: mainnet
      custom_url:
        description: "Override base URL (takes precedence over environment+network)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  schemathesis:
    name: Schema conformance - ${{ matrix.network }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        network: ${{ inputs.network == 'both' && fromJSON('["mainnet","testnet"]') || fromJSON(format('["{0}"]', inputs.network || 'mainnet')) }}
    env:
      MAX_RESPONSE_MILLISECONDS: "5000"
      HYPOTHESIS_MAX_EXAMPLES: "250"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve base URL
        id: resolve
        shell: bash
        run: |
          custom_url="${{ inputs.custom_url }}"
          environment="${{ inputs.environment || 'dead' }}"
          network="${{ matrix.network }}"

          if [[ -n "$custom_url" ]]; then
            base_url="${custom_url%/}"
            summary_env="custom"
          else
            case "${environment}-${network}" in
              dead-mainnet)
                base_url="https://mainnet.dead.prod.veworld.vechain.org"
                ;;
              dead-testnet)
                base_url="https://testnet.dead.prod.veworld.vechain.org"
                ;;
              live-mainnet)
                base_url="https://indexer.mainnet.vechain.org"
                ;;
              live-testnet)
                base_url="https://indexer.testnet.vechain.org"
                ;;
              *)
                echo "Unsupported combination: environment=$environment network=$network" >&2
                exit 1
                ;;
            esac
            summary_env="${environment}-${network}"
          fi

          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Schema Conformance Tests"
            echo "- Target: $summary_env"
            echo "- Base URL: $base_url"
            echo "- Schema: $base_url/api-docs"
            echo "- Max response (ms): $MAX_RESPONSE_MILLISECONDS"
            echo "- Hypothesis examples: $HYPOTHESIS_MAX_EXAMPLES"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Schemathesis
        run: pip install 'schemathesis>=3.19,<4'

      - name: Run schema-driven tests
        id: schemathesis
        shell: bash
        run: |
          mkdir -p schemathesis-output
          set +e
          scripts/run_api_schema_tests.sh dead \
            --base-url "${{ steps.resolve.outputs.base_url }}" \
            --store-network-log=./schemathesis-output/network.log \
            --junit-xml=./schemathesis-output/results.xml \
            2>&1 | tee ./schemathesis-output/run.log
          exit_code="${PIPESTATUS[0]}"
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Generate conformance report
        if: always()
        run: |
          python3 scripts/generate_api_conformance_report.py \
            --results-xml ./schemathesis-output/results.xml \
            --log ./schemathesis-output/run.log \
            --output-json ./schemathesis-output/report.json \
            --output-markdown ./schemathesis-output/report.md \
            --schemathesis-exit-code "${{ steps.schemathesis.outputs.exit_code || '0' }}" \
            --base-url "${{ steps.resolve.outputs.base_url }}"

      - name: Publish conformance summary
        if: always()
        shell: bash
        run: |
          if [[ -f ./schemathesis-output/report.md ]]; then
            cat ./schemathesis-output/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### API Conformance Report"
              echo ""
              echo "> No report generated."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce hard failures only
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json
          import pathlib
          import sys

          report_path = pathlib.Path("./schemathesis-output/report.json")
          if not report_path.exists():
              print("Conformance report was not generated.", file=sys.stderr)
              sys.exit(1)

          report = json.loads(report_path.read_text())
          summary = report["summary"]

          if summary.get("hard_issues", 0) > 0:
              print(f"Failing due to {summary['hard_issues']} hard conformance issue(s).", file=sys.stderr)
              sys.exit(1)

          print(
              f"Passing with {summary.get('soft_issues', 0)} soft issue(s) and "
              f"{summary.get('warnings_total', 0)} warning(s)."
          )
          PYEOF

      - name: Upload schema test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-logs-${{ matrix.network }}
          path: ./schemathesis-output
          if-no-files-found: ignore
