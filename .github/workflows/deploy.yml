name: Deploy

# The one apply path for a deployed environment: shared infra, observability,
# the CloudFront distributions and the application, in dependency order. Every
# stack is planned and applied on every run, so a stack with no change is a
# no-op rather than something an operator has to remember to run.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        required: true
        type: choice
        options:
          - prod
        default: prod
      network:
        description: Which network to deploy
        required: true
        type: choice
        options:
          - testnet
          - mainnet
          - both
        default: both
      colour:
        description: Which colour of that environment to deploy
        required: true
        type: choice
        options:
          - live
          - dead
        default: dead

run-name: >-
  Deploy ${{ github.ref_name }} -> ${{ inputs.environment }}
  ${{ inputs.colour }} (${{ inputs.network }})

# Required for authentication through GitHub OIDC
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout
  packages: read # This is required for pulling images from GHCR

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  identify-live-color:
    name: Identify Live and Dead Colors
    uses: ./.github/workflows/identify-live-color.yml
    with:
      dns_record_mainnet_name: mainnet.live.prod.veworld.vechain.org.
      dns_record_testnet_name: testnet.live.prod.veworld.vechain.org.
      hosted_zone_id: Z08093993BM56HB3DD4U4
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}

  deployed-state:
    name: Read Deployed State
    needs: [identify-live-color]
    runs-on: ubuntu-latest
    outputs:
      DEPLOYMENT_COLOR: ${{ steps.colour.outputs.DEPLOYMENT_COLOR }}
      DEPLOYED: ${{ steps.deployed.outputs.DEPLOYED }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Resolve target colour
        id: colour
        env:
          INPUT_NETWORK: ${{ inputs.network }}
          INPUT_ENV: ${{ inputs.colour }}
          MAINNET_LIVE: ${{ needs.identify-live-color.outputs.mainnet_live_color }}
          MAINNET_DEAD: ${{ needs.identify-live-color.outputs.mainnet_dead_color }}
          TESTNET_LIVE: ${{ needs.identify-live-color.outputs.testnet_live_color }}
          TESTNET_DEAD: ${{ needs.identify-live-color.outputs.testnet_dead_color }}
        run: |
          set -euo pipefail
          if [[ "$INPUT_NETWORK" == 'testnet' ]]; then
            live="$TESTNET_LIVE"; dead="$TESTNET_DEAD"
          else
            live="$MAINNET_LIVE"; dead="$MAINNET_DEAD"
          fi

          case "$INPUT_ENV" in
            live) colour="$live" ;;
            dead) colour="$dead" ;;
            *) echo "::error::Unknown environment '$INPUT_ENV'"; exit 1 ;;
          esac

          echo "DEPLOYMENT_COLOR=${colour}" >> "$GITHUB_OUTPUT"
          echo "Target colour: ${colour}"

      # Falls back to the live colour for a dead colour that was torn down.
      - name: Read deployed image tags
        id: deployed
        env:
          TARGET_COLOR: ${{ steps.colour.outputs.DEPLOYMENT_COLOR }}
          MAINNET_LIVE: ${{ needs.identify-live-color.outputs.mainnet_live_color }}
          TESTNET_LIVE: ${{ needs.identify-live-color.outputs.testnet_live_color }}
        run: |
          set -euo pipefail

          # Via the service, since the family's latest may be a revision no
          # rollout completed.
          read_running_image() {
            local colour="$1" net="$2" svc="$3"
            local desc status task_def

            desc=$(aws ecs describe-services \
              --cluster "${colour}-veworld-cluster" \
              --services "${colour}-veworld-${net}-${svc}-service" \
              --query 'services[0].[status,taskDefinition]' \
              --output text 2>/dev/null) || return 0

            status=$(awk '{print $1}' <<<"$desc")
            task_def=$(awk '{print $2}' <<<"$desc")
            [ "$status" = "ACTIVE" ] && [ -n "$task_def" ] && [ "$task_def" != "None" ] || return 0

            aws ecs describe-task-definition \
              --task-definition "$task_def" \
              --query 'taskDefinition.containerDefinitions[0].image' \
              --output text 2>/dev/null \
            | awk -F: 'NF>1 {print $NF}'
          }

          deployed='{}'
          for net in main test; do
            case "$net" in
              main) fallback="$MAINNET_LIVE" ;;
              test) fallback="$TESTNET_LIVE" ;;
            esac
            for svc in api indexer; do
              tag=$(read_running_image "$TARGET_COLOR" "$net" "$svc")
              if [ -z "$tag" ]; then
                echo "No running ${net}-${svc} service on ${TARGET_COLOR}; reading ${fallback}"
                tag=$(read_running_image "$fallback" "$net" "$svc")
              fi
              [ -n "$tag" ] || continue
              deployed=$(jq -c --arg n "$net" --arg s "$svc" --arg t "$tag" \
                '.[$n][$s] = $t' <<<"$deployed")
            done
          done

          echo "DEPLOYED=${deployed}" >> "$GITHUB_OUTPUT"
          jq . <<<"$deployed"

  # No AWS credentials here: this job runs a script out of the checked-out tree
  # to hash it, and only strings leave.
  plan-release:
    name: Plan Release
    needs: [deployed-state]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      VERSION: ${{ steps.plan.outputs.VERSION }}
      IMAGE_VERSIONS: ${{ steps.plan.outputs.IMAGE_VERSIONS }}
      PROMOTE: ${{ steps.plan.outputs.PROMOTE }}
      PROMOTE_NEEDED: ${{ steps.plan.outputs.PROMOTE_NEEDED }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve version and per-service image tags
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_NETWORK: ${{ inputs.network }}
          DEPLOYED: ${{ needs.deployed-state.outputs.DEPLOYED }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REF_NAME" == "main" ]]; then
            VERSION=$(git tag --sort=v:refname | tail -n1)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REF_NAME" == v.* ]]; then
            VERSION="$REF_NAME"
          else
            echo "::error::Unrecognised version. Select an existing version tag to deploy."
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::No version tag found to deploy."
            exit 1
          fi

          versions='{}'
          promote=()
          rows=()

          for net in main test; do
            case "$INPUT_NETWORK" in
              both)    selected=true ;;
              mainnet) [ "$net" = main ] && selected=true || selected=false ;;
              testnet) [ "$net" = test ] && selected=true || selected=false ;;
              *) echo "::error::Unknown network '$INPUT_NETWORK'"; exit 1 ;;
            esac

            for svc in api indexer; do
              current=$(jq -r --arg n "$net" --arg s "$svc" '.[$n][$s] // empty' <<<"$DEPLOYED")

              if [ "$selected" != true ]; then
                chosen="$current"
                note="network not selected"
              else
                new_hash=$(.github/workflows/scripts/content_hash.sh "$svc" "$VERSION")
                old_hash=""
                if [ -n "$current" ] && git rev-parse -q --verify "refs/tags/${current}^{tree}" >/dev/null; then
                  old_hash=$(.github/workflows/scripts/content_hash.sh "$svc" "$current")
                fi

                if [ -n "$old_hash" ] && [ "$old_hash" = "$new_hash" ]; then
                  chosen="$current"
                  note="unchanged since ${current} (${new_hash})"
                else
                  chosen="$VERSION"
                  promote+=("$svc")
                  note="content ${new_hash}"
                fi
              fi

              if [ -n "$chosen" ]; then
                versions=$(jq -c --arg n "$net" --arg s "$svc" --arg v "$chosen" \
                  '.[$n][$s] = $v' <<<"$versions")
              else
                note="no deployed tag to keep; environment yaml decides"
              fi
              rows+=("| ${net} | ${svc} | ${chosen:-<yaml>} | ${note} |")
            done
          done

          promote_list=$(printf '%s\n' "${promote[@]+"${promote[@]}"}" \
            | jq -Rc 'select(. != "")' | jq -sc 'unique')

          {
            echo "VERSION=${VERSION}"
            echo "IMAGE_VERSIONS=${versions}"
            echo "PROMOTE=${promote_list}"
            echo "PROMOTE_NEEDED=$([ "$(jq 'length' <<<"$promote_list")" -gt 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Deploying ${VERSION}"
            echo
            echo "| net | service | image tag | note |"
            echo "|---|---|---|---|"
            printf '%s\n' "${rows[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-to-ecr:
    name: Promote GHCR Image to ECR - ${{ matrix.packageName }}
    needs: [plan-release]
    if: needs.plan-release.outputs.PROMOTE_NEEDED == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        packageName: ${{ fromJSON(needs.plan-release.outputs.PROMOTE) }}
    env:
      GHCR_REGISTRY: ghcr.io
      GHCR_REPO: ${{ github.repository }}
      ECR_PROJECT: veworld
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy image from GHCR to ECR
        env:
          VERSION: ${{ needs.plan-release.outputs.VERSION }}
          GHCR_IMAGE_ROOT: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}/${{ matrix.packageName }}
          ECR_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_PROJECT }}/${{ matrix.packageName }}
        run: |
          set -euo pipefail
          # GHCR tags drop the v. prefix (v.1.0.0 -> 1.0.0); ECR keeps it.
          GHCR_IMAGE="${GHCR_IMAGE_ROOT}:${VERSION#v.}"

          docker pull --platform linux/arm64 "$GHCR_IMAGE"
          docker tag "$GHCR_IMAGE" "${ECR_IMAGE}:${VERSION}"
          docker tag "$GHCR_IMAGE" "${ECR_IMAGE}:latest"
          docker push "${ECR_IMAGE}:${VERSION}"
          docker push "${ECR_IMAGE}:latest"

      - name: Scan image in ECR
        env:
          REPO: ${{ env.ECR_PROJECT }}/${{ matrix.packageName }}
          TAG: ${{ needs.plan-release.outputs.VERSION }}
        run: |
          set -euo pipefail
          aws ecr start-image-scan --repository-name "$REPO" --image-id imageTag="$TAG" || true
          aws ecr wait image-scan-complete --repository-name "$REPO" --image-id imageTag="$TAG"
          read CRIT HIGH MED <<< "$(aws ecr describe-image-scan-findings \
            --repository-name "$REPO" --image-id imageTag="$TAG" \
            --query 'imageScanFindings.findingSeverityCounts.[CRITICAL, HIGH, MEDIUM]' \
            --output text)"
          CRIT=${CRIT/None/0}; HIGH=${HIGH/None/0}; MED=${MED/None/0}
          echo "Findings for $REPO:$TAG — CRITICAL=$CRIT HIGH=$HIGH MEDIUM=$MED"
          if [ $((CRIT + HIGH + MED)) -gt 0 ]; then
            echo "::error::Vulnerabilities at MEDIUM or higher: CRITICAL=$CRIT HIGH=$HIGH MEDIUM=$MED"
            exit 1
          fi

  apply-shared:
    name: Apply shared stack
    needs: [identify-live-color]
    uses: ./.github/workflows/deploy-colour-agnostic-infra.yml
    with:
      environment: ${{ inputs.environment }}
      scope: full
      live_color_mainnet: ${{ needs.identify-live-color.outputs.mainnet_live_color }}
      live_color_testnet: ${{ needs.identify-live-color.outputs.testnet_live_color }}
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}
      VECHAINCI_SSH_PRIVATE_KEYS: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

  apply-observability:
    name: Apply observability stacks
    uses: ./.github/workflows/deploy-observability.yml
    with:
      environment: ${{ inputs.environment }}
      apply: true
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}
      VECHAINCI_SSH_PRIVATE_KEYS: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Reads its WAF ARNs from the VPC stack's remote state, so it follows it.
  # Independent of the application stack, hence not gated on it.
  apply-cloudfront:
    name: Apply CloudFront stack
    needs: [apply-shared]
    uses: ./.github/workflows/deploy-cloudfront.yml
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}

  deploy-env:
    needs: [deployed-state, plan-release, promote-to-ecr, apply-shared, apply-observability]
    if: >-
      !cancelled() && needs.plan-release.result == 'success'
      && needs.apply-shared.result == 'success'
      && needs.apply-observability.result == 'success'
      && needs.promote-to-ecr.result != 'failure'
      && needs.promote-to-ecr.result != 'cancelled'
    name: Run Deployment - ${{ inputs.network }}
    uses: ./.github/workflows/plan-or-apply-terraform.yml
    with:
      environment: ${{ needs.deployed-state.outputs.DEPLOYMENT_COLOR }}
      image_versions: ${{ needs.plan-release.outputs.IMAGE_VERSIONS }}
      # Force ensures environment is spun up if it does not already exist
      force: true
    permissions:
      packages: read
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}
      VECHAINCI_SSH_PRIVATE_KEYS: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

  refresh-dead-dns:
    name: Refresh dead Route53 records
    needs: [identify-live-color, deploy-env]
    if: ${{ needs.deploy-env.result == 'success' && inputs.colour == 'dead' }}
    uses: ./.github/workflows/deploy-colour-agnostic-infra.yml
    with:
      environment: ${{ inputs.environment }}
      scope: dead-records
      live_color_mainnet: ${{ needs.identify-live-color.outputs.mainnet_live_color }}
      live_color_testnet: ${{ needs.identify-live-color.outputs.testnet_live_color }}
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}
      VECHAINCI_SSH_PRIVATE_KEYS: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

  log-live-environment:
    name: Log Live Environment
    needs: [identify-live-color]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Live mainnet environment is ${{ needs.identify-live-color.outputs.mainnet_live_color }}"

  manage-release:
    name: Refresh draft or publish release
    runs-on: ubuntu-latest
    needs: [plan-release, deploy-env]
    if: >-
      ${{ needs.deploy-env.result == 'success'
      && (inputs.network == 'mainnet' || inputs.network == 'both') }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan-release.outputs.VERSION }}
      INPUT_ENV: ${{ inputs.colour }}
    steps:
      - name: Check existing release state for tag
        id: check
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Existing release state for $TAG: $state"

      - name: Resolve previous published release tag
        if: steps.check.outputs.state != 'false'
        id: prev
        run: |
          set -euo pipefail
          prev=$(gh release list --exclude-drafts --exclude-pre-releases \
                   --limit 1 --json tagName --jq '.[0].tagName // empty')
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          echo "Previous published tag: ${prev:-<none>}"

      - name: Delete stale draft releases (dead deploy)
        if: steps.check.outputs.state != 'false' && env.INPUT_ENV == 'dead'
        run: |
          set -euo pipefail
          # Keep exactly one draft — the one representing the tag just staged
          # on the dead colour. switch-live-dns.yml publishes it when both
          # networks flip to that version.
          mapfile -t drafts < <(gh release list --limit 50 \
                                  --json tagName,isDraft \
                                  --jq '.[] | select(.isDraft) | .tagName')
          if [ "${#drafts[@]}" -eq 0 ]; then
            echo "No existing drafts."
          else
            for d in "${drafts[@]}"; do
              echo "Deleting draft: $d"
              gh release delete "$d" --yes
            done
          fi

      - name: Create draft release (dead deploy)
        if: steps.check.outputs.state != 'false' && env.INPUT_ENV == 'dead'
        env:
          PREVIOUS: ${{ steps.prev.outputs.previous }}
        run: |
          set -euo pipefail
          args=(--draft --title "Release $TAG" --generate-notes)
          [ -n "$PREVIOUS" ] && args+=(--notes-start-tag "$PREVIOUS")
          gh release create "$TAG" "${args[@]}"
          echo "Draft release $TAG created (baseline: ${PREVIOUS:-<none>})."

      - name: Publish release (live deploy)
        if: steps.check.outputs.state != 'false' && env.INPUT_ENV == 'live'
        env:
          PREVIOUS: ${{ steps.prev.outputs.previous }}
          STATE: ${{ steps.check.outputs.state }}
        run: |
          set -euo pipefail
          if [ "$STATE" = "true" ]; then
            echo "Publishing existing draft $TAG as latest"
            gh release edit "$TAG" --draft=false --latest
          else
            args=(--title "Release $TAG" --generate-notes --latest)
            [ -n "$PREVIOUS" ] && args+=(--notes-start-tag "$PREVIOUS")
            gh release create "$TAG" "${args[@]}"
            echo "Published release $TAG (baseline: ${PREVIOUS:-<none>})."
          fi
