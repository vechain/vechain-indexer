name: Deploy

# The one apply path for prod: shared infra, observability, the CloudFront
# distributions and the application, in dependency order. Every stack is
# planned and applied on every run, so one with no change is a no-op.
#
# plan_release.sh picks the colour (and whether the dead colour is restored
# from live snapshots first); a reviewer confirms that plan on the
# prod-release-approval environment before anything is applied.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Colour to deploy. auto follows the plan's recommendation.
        required: true
        type: choice
        options:
          - auto
          - live
          - dead
        default: auto
      skip_restore:
        description: Skip restoring the live Atlas snapshots into a cold dead colour; it indexes on from whatever its clusters hold
        required: false
        type: boolean
        default: false

run-name: Deploy ${{ github.ref_name }} -> prod (${{ inputs.target }})

# Required for authentication through GitHub OIDC
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout
  packages: read # This is required for pulling images from GHCR

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  identify-live-color:
    name: Identify Live and Dead Colors
    uses: ./.github/workflows/identify-live-color.yml
    with:
      dns_record_mainnet_name: mainnet.live.prod.veworld.vechain.org.
      dns_record_testnet_name: testnet.live.prod.veworld.vechain.org.
      hosted_zone_id: Z08093993BM56HB3DD4U4
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}

  deployed-state:
    name: Read Deployed State
    needs: [identify-live-color]
    runs-on: ubuntu-latest
    outputs:
      STATE: ${{ steps.state.outputs.STATE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Read what each colour runs
        id: state
        env:
          COLOURS: prod-blue prod-green
        run: bash .github/workflows/scripts/read_deployed_state.sh

  # No AWS credentials here: this job runs a script out of the checked-out tree
  # to hash it, and only strings leave.
  plan-release:
    name: Plan Release
    needs: [identify-live-color, deployed-state]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
      TARGET_COLOR: ${{ steps.plan.outputs.TARGET_COLOR }}
      TARGET_KIND: ${{ steps.plan.outputs.TARGET_KIND }}
      LIVE_COLOR: ${{ steps.plan.outputs.LIVE_COLOR }}
      RESTORE: ${{ steps.plan.outputs.RESTORE }}
      CONFIRM_TITLE: ${{ steps.plan.outputs.CONFIRM_TITLE }}
      IMAGE_VERSIONS: ${{ steps.plan.outputs.IMAGE_VERSIONS }}
      PROMOTE: ${{ steps.plan.outputs.PROMOTE }}
      PROMOTE_NEEDED: ${{ steps.plan.outputs.PROMOTE_NEEDED }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REF_NAME" == "main" ]]; then
            VERSION=$(git tag --sort=v:refname | tail -n1)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REF_NAME" == v.* ]]; then
            VERSION="$REF_NAME"
          else
            echo "::error::Unrecognised version. Select an existing version tag to deploy."
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::No version tag found to deploy."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Choose the colour and per-service image tags
        id: plan
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          TARGET_INPUT: ${{ inputs.target }}
          SKIP_RESTORE: ${{ inputs.skip_restore }}
          STATE: ${{ needs.deployed-state.outputs.STATE }}
          MAINNET_LIVE: ${{ needs.identify-live-color.outputs.mainnet_live_color }}
          MAINNET_DEAD: ${{ needs.identify-live-color.outputs.mainnet_dead_color }}
          TESTNET_LIVE: ${{ needs.identify-live-color.outputs.testnet_live_color }}
          TESTNET_DEAD: ${{ needs.identify-live-color.outputs.testnet_dead_color }}
        run: bash .github/workflows/scripts/plan_release.sh

  # Pauses for a required reviewer on the prod-release-approval environment.
  # Nothing is applied until this job passes; rejecting it leaves prod untouched.
  confirm:
    name: "Confirm: ${{ needs.plan-release.outputs.CONFIRM_TITLE }}"
    needs: [plan-release]
    runs-on: ubuntu-latest
    environment: prod-release-approval
    permissions:
      contents: read
    steps:
      - name: Record the confirmed plan
        env:
          TITLE: ${{ needs.plan-release.outputs.CONFIRM_TITLE }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "Confirmed: ${TITLE}"
          echo "### Confirmed: ${TITLE}" >> "$GITHUB_STEP_SUMMARY"
          echo "Dispatched by ${ACTOR}. The plan is in the Plan Release job summary." >> "$GITHUB_STEP_SUMMARY"

  # The approval wait can be long. A DNS switch during it would hand the VPC
  # apply a stale live colour and flip Route53 back, so re-resolve first.
  recheck-live-color:
    name: Re-resolve live colour after approval
    needs: [confirm]
    uses: ./.github/workflows/identify-live-color.yml
    with:
      dns_record_mainnet_name: mainnet.live.prod.veworld.vechain.org.
      dns_record_testnet_name: testnet.live.prod.veworld.vechain.org.
      hosted_zone_id: Z08093993BM56HB3DD4U4
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}

  verify-plan:
    name: Verify the plan still holds
    needs: [plan-release, recheck-live-color]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Compare live colour with the plan
        env:
          PLANNED: ${{ needs.plan-release.outputs.LIVE_COLOR }}
          MAINNET_LIVE: ${{ needs.recheck-live-color.outputs.mainnet_live_color }}
          TESTNET_LIVE: ${{ needs.recheck-live-color.outputs.testnet_live_color }}
        run: |
          set -euo pipefail
          if [ "$MAINNET_LIVE" != "$PLANNED" ] || [ "$TESTNET_LIVE" != "$PLANNED" ]; then
            echo "::error::DNS moved while the plan awaited approval: planned live ${PLANNED}, now mainnet ${MAINNET_LIVE} and testnet ${TESTNET_LIVE}. Nothing was applied; re-dispatch to plan again."
            exit 1
          fi
          echo "Live colour is still ${PLANNED}."

  promote-to-ecr:
    name: Promote GHCR Image to ECR - ${{ matrix.packageName }}
    needs: [plan-release, verify-plan]
    if: needs.plan-release.outputs.PROMOTE_NEEDED == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        packageName: ${{ fromJSON(needs.plan-release.outputs.PROMOTE) }}
    env:
      GHCR_REGISTRY: ghcr.io
      GHCR_REPO: ${{ github.repository }}
      ECR_PROJECT: veworld
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy image from GHCR to ECR
        env:
          VERSION: ${{ needs.plan-release.outputs.VERSION }}
          GHCR_IMAGE_ROOT: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}/${{ matrix.packageName }}
          ECR_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_PROJECT }}/${{ matrix.packageName }}
        run: |
          set -euo pipefail
          # GHCR tags drop the v. prefix (v.1.0.0 -> 1.0.0); ECR keeps it.
          GHCR_IMAGE="${GHCR_IMAGE_ROOT}:${VERSION#v.}"

          docker pull --platform linux/arm64 "$GHCR_IMAGE"
          docker tag "$GHCR_IMAGE" "${ECR_IMAGE}:${VERSION}"
          docker tag "$GHCR_IMAGE" "${ECR_IMAGE}:latest"
          docker push "${ECR_IMAGE}:${VERSION}"
          docker push "${ECR_IMAGE}:latest"

      - name: Scan image in ECR
        env:
          REPO: ${{ env.ECR_PROJECT }}/${{ matrix.packageName }}
          TAG: ${{ needs.plan-release.outputs.VERSION }}
        run: |
          set -euo pipefail
          aws ecr start-image-scan --repository-name "$REPO" --image-id imageTag="$TAG" || true
          aws ecr wait image-scan-complete --repository-name "$REPO" --image-id imageTag="$TAG"
          read -r CRIT HIGH MED <<< "$(aws ecr describe-image-scan-findings \
            --repository-name "$REPO" --image-id imageTag="$TAG" \
            --query 'imageScanFindings.findingSeverityCounts.[CRITICAL, HIGH, MEDIUM]' \
            --output text)"
          CRIT=${CRIT/None/0}; HIGH=${HIGH/None/0}; MED=${MED/None/0}
          echo "Findings for $REPO:$TAG — CRITICAL=$CRIT HIGH=$HIGH MEDIUM=$MED"
          if [ $((CRIT + HIGH + MED)) -gt 0 ]; then
            echo "::error::Vulnerabilities at MEDIUM or higher: CRITICAL=$CRIT HIGH=$HIGH MEDIUM=$MED"
            exit 1
          fi

  apply-shared:
    name: Apply shared stack
    needs: [recheck-live-color, verify-plan]
    uses: ./.github/workflows/deploy-colour-agnostic-infra.yml
    with:
      environment: prod
      scope: full
      live_color_mainnet: ${{ needs.recheck-live-color.outputs.mainnet_live_color }}
      live_color_testnet: ${{ needs.recheck-live-color.outputs.testnet_live_color }}
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}
      VECHAINCI_SSH_PRIVATE_KEYS: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

  apply-observability:
    name: Apply observability stacks
    needs: [verify-plan]
    uses: ./.github/workflows/deploy-observability.yml
    with:
      environment: prod
      apply: true
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}
      VECHAINCI_SSH_PRIVATE_KEYS: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Reads its WAF ARNs from the VPC stack's remote state, so it follows it.
  # Independent of the application stack, hence not gated on it.
  apply-cloudfront:
    name: Apply CloudFront stack
    needs: [apply-shared]
    uses: ./.github/workflows/deploy-cloudfront.yml
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}

  # A cold dead colour holds stale data. Restoring the live snapshots before
  # the application apply starts its services is what a switch later relies on.
  restore-dead:
    name: Restore dead colour from live snapshots
    needs: [plan-release, verify-plan]
    if: needs.plan-release.outputs.RESTORE == 'true'
    uses: ./.github/workflows/restore-dead-prod-atlas-snapshots.yml
    with:
      confirm_restore: true
      expected_target_color: ${{ needs.plan-release.outputs.TARGET_COLOR }}
    concurrency:
      group: dead-prod-recovery-operations
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  deploy-env:
    needs: [plan-release, promote-to-ecr, apply-shared, apply-observability, restore-dead]
    if: >-
      !cancelled() && needs.plan-release.result == 'success'
      && needs.apply-shared.result == 'success'
      && needs.apply-observability.result == 'success'
      && needs.promote-to-ecr.result != 'failure'
      && needs.promote-to-ecr.result != 'cancelled'
      && needs.restore-dead.result != 'failure'
      && needs.restore-dead.result != 'cancelled'
    name: Run Deployment - ${{ needs.plan-release.outputs.TARGET_COLOR }}
    uses: ./.github/workflows/plan-or-apply-terraform.yml
    with:
      environment: ${{ needs.plan-release.outputs.TARGET_COLOR }}
      image_versions: ${{ needs.plan-release.outputs.IMAGE_VERSIONS }}
      release_version: ${{ needs.plan-release.outputs.VERSION }}
      # Force ensures environment is spun up if it does not already exist
      force: true
    permissions:
      packages: read
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}
      VECHAINCI_SSH_PRIVATE_KEYS: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

  refresh-dead-dns:
    name: Refresh dead Route53 records
    needs: [recheck-live-color, plan-release, deploy-env]
    if: >-
      ${{ needs.deploy-env.result == 'success'
      && needs.plan-release.outputs.TARGET_KIND == 'dead' }}
    uses: ./.github/workflows/deploy-colour-agnostic-infra.yml
    with:
      environment: prod
      scope: dead-records
      live_color_mainnet: ${{ needs.recheck-live-color.outputs.mainnet_live_color }}
      live_color_testnet: ${{ needs.recheck-live-color.outputs.testnet_live_color }}
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}
      VECHAINCI_SSH_PRIVATE_KEYS: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

  manage-release:
    name: Refresh draft or publish release
    runs-on: ubuntu-latest
    needs: [plan-release, deploy-env]
    if: ${{ needs.deploy-env.result == 'success' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan-release.outputs.VERSION }}
      TARGET_KIND: ${{ needs.plan-release.outputs.TARGET_KIND }}
    steps:
      - name: Check existing release state for tag
        id: check
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Existing release state for $TAG: $state"

      - name: Resolve previous published release tag
        if: steps.check.outputs.state != 'false'
        id: prev
        run: |
          set -euo pipefail
          prev=$(gh release list --exclude-drafts --exclude-pre-releases \
                   --limit 1 --json tagName --jq '.[0].tagName // empty')
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          echo "Previous published tag: ${prev:-<none>}"

      - name: Delete stale draft releases (dead deploy)
        if: steps.check.outputs.state != 'false' && env.TARGET_KIND == 'dead'
        run: |
          set -euo pipefail
          # Keep exactly one draft — the one representing the tag just staged
          # on the dead colour. switch-live-dns.yml publishes it when both
          # networks flip to that version.
          mapfile -t drafts < <(gh release list --limit 50 \
                                  --json tagName,isDraft \
                                  --jq '.[] | select(.isDraft) | .tagName')
          if [ "${#drafts[@]}" -eq 0 ]; then
            echo "No existing drafts."
          else
            for d in "${drafts[@]}"; do
              echo "Deleting draft: $d"
              gh release delete "$d" --yes
            done
          fi

      - name: Create draft release (dead deploy)
        if: steps.check.outputs.state != 'false' && env.TARGET_KIND == 'dead'
        env:
          PREVIOUS: ${{ steps.prev.outputs.previous }}
        run: |
          set -euo pipefail
          args=(--draft --title "Release $TAG" --generate-notes)
          [ -n "$PREVIOUS" ] && args+=(--notes-start-tag "$PREVIOUS")
          gh release create "$TAG" "${args[@]}"
          echo "Draft release $TAG created (baseline: ${PREVIOUS:-<none>})."

      - name: Publish release (live deploy)
        if: steps.check.outputs.state != 'false' && env.TARGET_KIND == 'live'
        env:
          PREVIOUS: ${{ steps.prev.outputs.previous }}
          STATE: ${{ steps.check.outputs.state }}
        run: |
          set -euo pipefail
          if [ "$STATE" = "true" ]; then
            echo "Publishing existing draft $TAG as latest"
            gh release edit "$TAG" --draft=false --latest
          else
            args=(--title "Release $TAG" --generate-notes --latest)
            [ -n "$PREVIOUS" ] && args+=(--notes-start-tag "$PREVIOUS")
            gh release create "$TAG" "${args[@]}"
            echo "Published release $TAG (baseline: ${PREVIOUS:-<none>})."
          fi

  next-steps:
    name: Next steps
    needs: [plan-release, deploy-env, refresh-dead-dns, manage-release]
    if: ${{ !cancelled() && needs.deploy-env.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Tell the operator what happens next
        env:
          VERSION: ${{ needs.plan-release.outputs.VERSION }}
          TARGET_COLOR: ${{ needs.plan-release.outputs.TARGET_COLOR }}
          TARGET_KIND: ${{ needs.plan-release.outputs.TARGET_KIND }}
          LIVE_COLOR: ${{ needs.plan-release.outputs.LIVE_COLOR }}
          RESTORED: ${{ needs.plan-release.outputs.RESTORE }}
          SWITCH_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/switch-live-dns.yml
        run: |
          set -euo pipefail
          grafana=$(aws grafana list-workspaces \
            --query "workspaces[?name=='veworld-indexer-prod-grafana-workspace'].endpoint | [0]" \
            --output text 2>/dev/null || true)
          [ -n "$grafana" ] && [ "$grafana" != "None" ] || grafana=""
          deployment="${TARGET_COLOR#prod-}"
          dashboard() {
            if [ -n "$grafana" ]; then
              echo "[blocks behind](https://${grafana}/d/overview?var-deployment=${deployment}&var-network=$1)"
            else
              echo "Grafana → Indexer, API & Edge → deployment ${deployment}, network $1"
            fi
          }

          {
            if [ "$TARGET_KIND" = dead ]; then
              echo "### Next step: switch DNS once ${TARGET_COLOR} has synced"
              echo
              echo "${VERSION} runs on ${TARGET_COLOR}. Traffic stays on ${LIVE_COLOR} until you run [Switch Live Environment](${SWITCH_URL}) with network \`all\`, which also publishes the draft release."
              if [ "$RESTORED" = true ]; then
                echo
                echo "${TARGET_COLOR}'s data was restored from the latest ${LIVE_COLOR} snapshots, so its indexers resume from that point."
              fi
              echo
              echo "Switch when every indexer on both networks reports fully synced:"
              echo
              echo "| | mainnet | testnet |"
              echo "|---|---|---|"
              echo "| Grafana | $(dashboard mainnet) | $(dashboard testnet) |"
              echo "| Indexed head | https://mainnet.dead.veworld.vechain.org/api/v1/blocks?size=1 | https://testnet.dead.veworld.vechain.org/api/v1/blocks?size=1 |"
            else
              echo "### ${VERSION} is live on ${TARGET_COLOR}"
              echo
              echo "The release is published. Nothing else to do; watch $(dashboard mainnet) and $(dashboard testnet) if the change touched the API."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
