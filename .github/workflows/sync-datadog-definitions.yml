name: Sync Datadog Definitions

on:
  pull_request:
    paths:
      - "packages/api/src/main/kotlin/**"
      - "metrics/datadog/**"
      - "metrics/grafana/provisioning/dashboards/*.json"

permissions:
  contents: write

jobs:
  generate-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r metrics/datadog/scripts/requirements.txt

      - name: Generate OpenAPI spec
        run: ./gradlew :packages:api:generateOpenApiSpec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Datadog categories
        run: python3 metrics/datadog/scripts/manage_pipeline.py update-categories

      - name: Format JSON files
        run: |
          for f in metrics/datadog/*.json metrics/grafana/provisioning/dashboards/*.json; do
            if [ -f "$f" ]; then
              jq -S '.' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            fi
          done

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/datadog/*.json metrics/grafana/provisioning/dashboards/*.json
          git commit -m "chore: generate and format JSON files"
          git push

      - name: Fail if changes were needed
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "::warning::Generated/formatted files were out of date. Changes have been auto-committed."
          echo "Re-run this check to get a passing status."
          exit 1
