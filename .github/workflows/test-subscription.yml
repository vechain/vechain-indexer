name: Plan or Apply Terraform

on:
  push:
    branches:
      - log-subscription
    paths:
      - '.github/workflows/test-subscription.yml'
  

# Required for authentication through GitHub OIDC
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout



jobs:
  deploy:
    name: Test subscrition
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}


      - name: Subscribe S3 buckets to Datadog forwarder
        run: |
           bash ./scripts/subscribe_s3_bucket_logs.sh
      
      - name: Subscribe cloudwatch logs to Datadog forwarder
        run: |
           bash ./scripts/subscribe_cloudwatch_logs.sh