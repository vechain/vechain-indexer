name: Validate Generated Monitoring Artifacts

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r metrics/datadog/scripts/requirements.txt

      - name: Refresh generated Datadog files
        run: make dd-refresh-generated
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for generated changes
        run: |
          if git diff --quiet; then
            exit 0
          else
            echo "::error::Generated Datadog files are out of date."
            echo "Run the following command locally and commit the results:"
            echo "  make dd-refresh-generated"
            git diff -- metrics/datadog/*.json metrics/grafana/provisioning/dashboards/*.json
            exit 1
          fi
