name: Validate Generated Monitoring Artifacts

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r metrics/datadog/scripts/requirements.txt

      - name: Refresh generated Datadog files
        run: make dd-refresh-generated
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for generated changes
        run: |
          if git diff --quiet; then
            exit 0
          else
            echo "::error::Generated Datadog files are out of date."
            echo "Run the following command locally and commit the results:"
            echo "  make dd-refresh-generated"
            git diff -- metrics/datadog/*.json metrics/grafana/provisioning/dashboards/*.json
            exit 1
          fi
