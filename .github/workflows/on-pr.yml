name: On Pull Request

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.head_ref || github.ref_name }}-build-test
  cancel-in-progress: true

jobs:
  test-gradle:
    uses: ./.github/workflows/test-gradle.yml

  check-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: "oracle"
          java-version: "17"

      - name: Gradle Spotless
        run: ./gradlew spotlessCheck

  vulnerability-scan:
    uses: ./.github/workflows/vulnerability-scan.yml

  terraform-plan-dev:
    uses: ./.github/workflows/veworld-stack.yml
    with:
      environment: dev
    permissions:
      packages: read
      contents: read
      id-token: write
    secrets: inherit

  terraform-plan-prod:
    uses: ./.github/workflows/veworld-stack.yml
    with:
      environment: prod-blue
    permissions:
      packages: read
      contents: read
      id-token: write
    secrets: inherit
