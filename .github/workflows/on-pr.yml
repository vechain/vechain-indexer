name: Pull Request - Test, Plan & Build Docker Image

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.head_ref || github.ref_name }}-build-test
  cancel-in-progress: true

jobs:
  test-gradle:
    uses: ./.github/workflows/test-gradle.yml

  check-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: "oracle"
          java-version: "21"

      - name: Gradle Spotless
        run: ./gradlew spotlessCheck

  vulnerability-scan:
    uses: ./.github/workflows/vulnerability-scan.yml

  terraform-plan-dev:
    name: Terraform Plan Dev
    uses: ./.github/workflows/plan-or-deploy-environment.yml
    with:
      environment: dev
      workspace: dev
    permissions:
      packages: read
      contents: read
      id-token: write
    secrets: inherit

  terraform-plan-prod:
    name: Terraform Plan Prod
    uses: ./.github/workflows/plan-or-deploy-environment.yml
    strategy:
      matrix:
        color: [blue, green]
    with:
      environment: prod
      workspace: prod-${{ matrix.color }}
    permissions:
      packages: read
      contents: read
      id-token: write
    secrets: inherit

  build-docker-image:
    name: Build Docker Image on PR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        application: [ indexer, api ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        uses: docker/build-push-action@v4
        with:
          platforms: linux/arm64
          build-args: |
            PACKAGE_NAME=${{ matrix.application }}
          push: false
          context: ./
          tags: pr-test-image-${{ matrix.application }}:${{ github.sha }}

