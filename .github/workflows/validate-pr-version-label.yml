name: Pull Request Label Check

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled]

jobs:
  check-labels:
    runs-on: ubuntu-latest

    steps:
    - name: Check PR labels
      id: check_labels
      uses: actions/github-script@v4
      with:
        script: |
          const labels = context.payload.pull_request.labels.map(label => label.name);
          const patchCount = labels.filter(label => label === 'patch').length;
          const minorCount = labels.filter(label => label === 'minor').length;
          const majorCount = labels.filter(label => label === 'major').length;
          
          if (patchCount + minorCount + majorCount === 1) {
            console.log('Exactly one of the required labels applied.');
            process.exit(0);
          } else {
            console.error('Invalid number of labels applied.');
            process.exit(1);
          }
