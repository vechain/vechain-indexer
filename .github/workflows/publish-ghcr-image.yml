name: Build & Publish GHCR Image

on:
  push:
    tags:
      - v.*
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v.1.0.0)'
        required: true
        type: string

concurrency:
  group: ghcr-publish
  cancel-in-progress: false

permissions:
  packages: write
  contents: read

env:
  versionTag: ${{ inputs.version || github.ref_name }}
  latestTag: 'latest'
  registry: ghcr.io

jobs:
  build:
    strategy:
      matrix:
        packageName: ["api", "indexer"]
        platform: ["linux/amd64", "linux/arm64"]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: docker-build-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            PACKAGE_NAME=${{ matrix.packageName }}
            APP_VERSION=${{ env.versionTag }}
          context: ./
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.packageName }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.packageName }}-${{ matrix.platform }}
          secrets: |
            "gradle_props=gpr.user=${{ github.actor }}
            gpr.key=${{ secrets.GITHUB_TOKEN }}"
          outputs: type=image,name=${{ env.registry }}/${{ github.repository }}/${{ matrix.packageName }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.packageName }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        packageName: ["api", "indexer"]

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.packageName }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tags
        id: version
        run: |
          # Strip v. prefix from version tag
          VERSION=$(echo "${{ env.versionTag }}" | sed 's/^v\.//')
          echo "full=$VERSION" >> "$GITHUB_OUTPUT"

          # Only publish floating tags for stable versions (X.Y.Z)
          if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "major=$(echo "$VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
            echo "minor=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.registry }}/${{ github.repository }}/${{ matrix.packageName }}
        run: |
          TAGS="-t ${{ env.IMAGE }}:${{ steps.version.outputs.full }}"

          if [ "${{ steps.version.outputs.stable }}" = "true" ]; then
            TAGS="$TAGS -t ${{ env.IMAGE }}:${{ steps.version.outputs.minor }}"
            TAGS="$TAGS -t ${{ env.IMAGE }}:${{ steps.version.outputs.major }}"
            TAGS="$TAGS -t ${{ env.IMAGE }}:${{ env.latestTag }}"
          fi

          docker buildx imagetools create \
            $TAGS \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

