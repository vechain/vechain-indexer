name: Build & Publish GHCR Image

on:
  push:
    tags:
      - v.*
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v.1.0.0)'
        required: true
        type: string

concurrency:
  group: ghcr-publish
  cancel-in-progress: false

permissions:
  packages: write
  contents: read

env:
  versionTag: ${{ inputs.version || github.ref_name }}
  latestTag: 'latest'
  registry: ghcr.io
  dockerHubRegistry: docker.io

jobs:
  build:
    strategy:
      matrix:
        packageName: ["api", "indexer"]
        platform: ["linux/amd64", "linux/arm64"]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            PACKAGE_NAME=${{ matrix.packageName }}
            APP_VERSION=${{ env.versionTag }}
          context: ./
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.packageName }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.packageName }}-${{ matrix.platform }}
          secrets: |
            "gradle_props=gpr.user=${{ github.actor }}
            gpr.key=${{ secrets.GITHUB_TOKEN }}"
          outputs: type=image,name=${{ env.registry }}/${{ github.repository }}/${{ matrix.packageName }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.packageName }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - packageName: api
            dockerHubImage: vechain/indexer-api
          - packageName: indexer
            dockerHubImage: vechain/indexer

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.packageName }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.dockerHubRegistry }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version tags
        id: version
        run: |
          # Strip v. prefix from version tag
          VERSION=$(echo "${{ env.versionTag }}" | sed 's/^v\.//')
          echo "full=$VERSION" >> "$GITHUB_OUTPUT"

          # Only publish floating tags for stable versions (X.Y.Z)
          if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "major=$(echo "$VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
            echo "minor=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.registry }}/${{ github.repository }}/${{ matrix.packageName }}
        run: |
          TAGS="-t ${{ env.IMAGE }}:${{ steps.version.outputs.full }}"

          if [ "${{ steps.version.outputs.stable }}" = "true" ]; then
            TAGS="$TAGS -t ${{ env.IMAGE }}:${{ steps.version.outputs.minor }}"
            TAGS="$TAGS -t ${{ env.IMAGE }}:${{ steps.version.outputs.major }}"
            TAGS="$TAGS -t ${{ env.IMAGE }}:${{ env.latestTag }}"
          fi

          docker buildx imagetools create \
            $TAGS \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Mirror manifest from GHCR to Docker Hub
        env:
          GHCR_IMAGE: ${{ env.registry }}/${{ github.repository }}/${{ matrix.packageName }}
          DOCKERHUB_IMAGE: ${{ env.dockerHubRegistry }}/${{ matrix.dockerHubImage }}
          FULL_VERSION: ${{ steps.version.outputs.full }}
          STABLE: ${{ steps.version.outputs.stable }}
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
          LATEST_TAG: ${{ env.latestTag }}
        run: |
          set -euo pipefail

          TAGS=("-t" "${DOCKERHUB_IMAGE}:${FULL_VERSION}")
          if [ "${STABLE}" = "true" ]; then
            TAGS+=("-t" "${DOCKERHUB_IMAGE}:${MINOR}")
            TAGS+=("-t" "${DOCKERHUB_IMAGE}:${MAJOR}")
            TAGS+=("-t" "${DOCKERHUB_IMAGE}:${LATEST_TAG}")
          fi

          # Single invocation so every Docker Hub tag is published atomically
          # from the already-pushed GHCR full-version manifest.
          docker buildx imagetools create "${TAGS[@]}" "${GHCR_IMAGE}:${FULL_VERSION}"

