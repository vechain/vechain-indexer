name: Build & Publish GHCR Image

on:
  push:
    tags:
      - v.*

permissions:
  packages: write
  contents: read

env:
  versionTag: ${{ github.ref_name }}
  latestTag: 'latest'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        packageName: ["api", "indexer"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            PACKAGE_NAME=${{ matrix.packageName }}
            APP_VERSION=${{ env.versionTag }}
          push: true
          context: ./
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.packageName }}:${{ env.versionTag }}
            ghcr.io/${{ github.repository }}/${{ matrix.packageName }}:${{ env.latestTag }}
