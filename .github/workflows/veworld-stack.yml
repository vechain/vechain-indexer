name: VeWorld Indexer Stack

on:
  push:
    paths: ["terraform/**", ".github/workflows/veworld-stack.yml"]
    branches:
      - main
  pull_request:
    paths: ["terraform/**", ".github/workflows/veworld-stack.yml"]
    branches: [main]
  # trigger deployment manually
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy to ('dev' or 'prod')
        required: true
        default: dev
      imageTag:
        description: The docker image tag to deploy
        required: true
        default: dev-latest

# permissions: allow to create PRs to main branch
permissions:
  pull-requests: write
  contents: write

jobs:
  deploy:
    name: "Deploy VeWorld Indexer to ${{ github.event.client_payload.environment || inputs.environment || 'dev' }}"
    runs-on: ubuntu-latest

    #This environment sets up the following 'vars' and 'secrtes'
    environment: veworld-${{ github.event.client_payload.environment || inputs.environment || 'dev' }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
      TF_AWS_ACCESS_KEY_ID: ${{secrets.TF_AWS_ACCESS_KEY_ID }}
      TF_AWS_SECRET_ACCESS_KEY: ${{secrets.TF_AWS_SECRET_ACCESS_KEY}}
      TF_AWS_PROFILE_NAME: ${{ vars.TF_AWS_PROFILE_NAME }}
      TF_WORKSPACE_NAME: ${{ vars.TF_WORKSPACE_NAME }}
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Debug Path
        run: |
          pwd
          ls -la
          ls environments

      - name: Update ENV Yaml
        uses: fjogeleit/yaml-update-action@main
        with:
          valueFile: "terraform/api/environments/${{github.event.client_payload.environment || inputs.environment || 'dev'}}.yaml"
          propertyPath: "image_tag"
          value: ${{github.event.client_payload.imageTag || inputs.imageTag || 'dev-latest'}}
          message: "Update VeWorld image tag to ${{github.event.client_payload.imageTag || inputs.imageTag || 'dev-latest'}}"
          createPR: true
          title: "Update VeWorld image tag to ${{github.event.client_payload.imageTag || inputs.imageTag || 'dev-latest'}}"
          targetBranch: main
          masterBranchName: main
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update-veworld-image-tag-${{github.event.client_payload.environment || inputs.environment || 'dev'}}}

      # production requires terraform to operate across account via an AWS_PROFILE, so use $TF_variants, if set, default to $AWS_ otherwise
      - name: Init AWS
        run: |
          mkdir -p ~/.aws
          ENVIRONMENT="${{ github.event.client_payload.environment || inputs.environment || 'dev' }}"
          case $ENVIRONMENT in
            dev)
              AWS_ACCESS_KEY_ID=${{secrets.AWS_ACCESS_KEY_ID}}
              AWS_SECRET_ACCESS_KEY=${{secrets.AWS_SECRET_ACCESS_KEY}}
              ;;
            prod)
              AWS_ACCESS_KEY_ID=${{secrets.TF_AWS_ACCESS_KEY_ID}}
              AWS_SECRET_ACCESS_KEY=${{secrets.TF_AWS_SECRET_ACCESS_KEY}}
              ;;
            *)
              echo "Unknown environment: $ENVIRONMENT"
              exit 1
              ;;
          esac

          cat <<EOM > ~/.aws/credentials
            [default]
            aws_access_key_id = $AWS_ACCESS_KEY_ID
            aws_secret_access_key = $AWS_SECRET_ACCESS_KEY
            [$TF_AWS_PROFILE_NAME]
            aws_access_key_id = $AWS_ACCESS_KEY_ID
            aws_secret_access_key = $AWS_SECRET_ACCESS_KEY
          EOM

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6
          terraform_wrapper: true

      - name: Terraform Init
        id: init
        run: OS_DEBUG=1 TF_LOG=DEBUG terraform init

      - name: Terraform select workspace
        id: workspace
        run: terraform workspace select ${{ inputs.environment || 'dev' }}

        #TODO: This is required after selecting the workspace for some reason?
      - name: Terraform Re-Init (2)
        id: init2
        run: OS_DEBUG=1 TF_LOG=DEBUG terraform init

      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan

    #   - name: Terraform Apply
    #     if: github.ref == 'refs/heads/main' && inputs.environment == 'prod'
    #     id: apply
    #     run: terraform apply -auto-approve

