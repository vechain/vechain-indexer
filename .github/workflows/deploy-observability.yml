name: Plan or Apply Observability Terraform

# deploy.yml applies it every release; a dispatch from main can apply it alone once approved.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/observability/**'
      - 'terraform/observability-grafana/**'
      - '.github/workflows/deploy-observability.yml'
  # Its own input name: a call from deploy.yml also runs with event_name workflow_dispatch.
  workflow_dispatch:
    inputs:
      dispatch_apply:
        description: Apply after prod-release-approval (main only). Unticked, it only plans.
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment:
        description: Terraform workspace to target
        required: false
        type: string
        default: prod
      apply:
        description: Apply the plan rather than only printing it
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ACC_ROLE:
        description: "AWS IAM role ARN for OIDC authentication"
        required: true
      VECHAINCI_SSH_PRIVATE_KEYS:
        description: "SSH key for accessing vechain Terraform modules"
        required: true
      SLACK_WEBHOOK_URL:
        description: "Alert delivery webhook; unset writes a placeholder sentinel"
        required: false

# Required for authentication through GitHub OIDC
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

# One group across both stacks so concurrent runs on the same ref serialise
# cleanly. observability-grafana reads terraform_remote_state from
# observability, so overlapping runs on the same ref would race.
concurrency:
  group: terraform-observability-${{ github.ref }}
  cancel-in-progress: false

env:
  TERRAFORM_ENV: ${{ inputs.environment || 'prod' }}

jobs:
  refuse-branch:
    name: Refuse an apply from a branch
    if: inputs.dispatch_apply && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Refuse
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Only main applies to prod; ${REF} has not been reviewed into it."
          exit 1

  confirm:
    name: Confirm observability apply
    if: inputs.dispatch_apply && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod-release-approval
    permissions: {}
    steps:
      - name: Record the confirmation
        env:
          ACTOR: ${{ github.actor }}
        run: echo "Observability apply confirmed; dispatched by ${ACTOR}." >> "$GITHUB_STEP_SUMMARY"

  deploy-observability:
    name: Plan/deploy observability - ${{ inputs.environment || 'prod' }}
    needs: [confirm]
    if: ${{ !cancelled() && (!inputs.dispatch_apply || needs.confirm.result == 'success') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/observability
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      # Required for Terraform to source modules from other vechain repositories
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: true

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Initialize
        id: init
        run: terraform init -reconfigure -backend-config="environments/${{ env.TERRAFORM_ENV }}.config"

      - name: Terraform Workspace
        id: workspace
        run: terraform workspace select -or-create ${{ env.TERRAFORM_ENV }}

      - name: Terraform Validate
        id: validate
        run: terraform validate

      # SLACK_WEBHOOK_URL is optional. If unset the observability stack writes
      # a `placeholder` sentinel to Secrets Manager and the sns_to_slack
      # Lambda no-ops on delivery. Populate the repo secret when you're ready
      # to switch alert delivery on.
      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: terraform plan -out "apply.plan"

      # terraform/api reads this stack's outputs, and only deploy.yml re-applies it afterwards.
      - name: Refuse output changes on a dispatched apply
        if: inputs.dispatch_apply
        run: |
          changed="$(terraform-bin show -json apply.plan |
            jq -r '(.output_changes // {}) | to_entries[] | select(.value.actions != ["no-op"]) | .key')"
          if [[ -n "${changed}" ]]; then
            echo "::error::This plan changes outputs terraform/api reads: ${changed//$'\n'/, }. Deploy it with deploy.yml."
            exit 1
          fi

      - name: Terraform Apply
        if: inputs.apply || inputs.dispatch_apply
        id: apply
        env:
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: terraform apply "apply.plan"

  deploy-observability-grafana:
    name: Plan/deploy observability-grafana - ${{ inputs.environment || 'prod' }}
    runs-on: ubuntu-latest
    # observability-grafana reads terraform_remote_state from observability;
    # if observability apply fails, skip the datasource stack so we don't
    # apply against stale parent outputs.
    needs: deploy-observability
    if: ${{ !cancelled() && needs.deploy-observability.result == 'success' }}
    defaults:
      run:
        working-directory: terraform/observability-grafana
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      # Required for Terraform to source modules from other vechain repositories
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: true

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Initialize
        id: init
        run: terraform init -reconfigure -backend-config="environments/${{ env.TERRAFORM_ENV }}.config"

      - name: Terraform Workspace
        id: workspace
        run: terraform workspace select -or-create ${{ env.TERRAFORM_ENV }}

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -out "apply.plan"

      - name: Terraform Apply
        if: inputs.apply || inputs.dispatch_apply
        id: apply
        run: terraform apply "apply.plan"
