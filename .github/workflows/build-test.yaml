name: Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Gradle Test
        run: ./gradlew cleanTest test

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag vechain-indexer:latest