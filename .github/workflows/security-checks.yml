name: 'Security Checks'
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  scorecard:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: vechain/github-actions/.github/workflows/scorecard.yaml@v.1.13.0
    secrets:
      app-id: ${{ secrets.SCORECARD_APPID }}
      private-key: ${{ secrets.SCORECARD_PRIVATEKEY }}

  checkov:
    uses: vechain/github-actions/.github/workflows/checkov.yaml@v.1.13.0

  infracost:
    uses: vechain/github-actions/.github/workflows/infracost.yaml@v.1.13.0
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      GIT_VECHAINCI_SSH_KEY: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}
