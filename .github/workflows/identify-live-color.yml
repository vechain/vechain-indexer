name: Identify Live/Dead Environments

on:
  workflow_call:
    inputs:
      dns_record_mainnet_name:
        description: "The mainnet DNS record value to check"
        required: true
        type: string
      dns_record_testnet_name:
        description: "The testnet DNS record value to check"
        required: true
        type: string
      hosted_zone_id:
        description: "The hosted zone ID of the DNS record"
        required: true
        type: string
    # Map the job outputs to workflow outputs
    outputs:
      mainnet_live_color:
        description: "The live color environment for mainnet (prod-blue or prod-green)"
        value: ${{ jobs.identify-live.outputs.mainnet_live_color }}
      mainnet_dead_color:
        description: "The dead color environment for mainnet (opposite of live_color)"
        value: ${{ jobs.identify-live.outputs.mainnet_dead_color }}
      testnet_live_color:
        description: "The live color environment for testnet (prod-blue or prod-green)"
        value: ${{ jobs.identify-live.outputs.testnet_live_color }}
      testnet_dead_color:
        description: "The dead color environment for testnet (opposite of live_color)"
        value: ${{ jobs.identify-live.outputs.testnet_dead_color }}
  workflow_dispatch:
    inputs:
      dns_record_mainnet_name:
        description: "The mainnet DNS record value to check"
        required: true
        type: string
        default: "mainnet.live.prod.veworld.vechain.org."
      dns_record_testnet_name:
        description: "The testnet DNS record value to check"
        required: true
        type: string
        default: "testnet.live.prod.veworld.vechain.org."
      hosted_zone_id:
        description: "The hosted zone ID of the DNS record"
        required: true
        type: string
        default: "Z08093993BM56HB3DD4U4"

# Required for authentication through GitHub OIDC
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  identify-live:
    name: "Identify Live/Dead Environments"
    runs-on: ubuntu-latest
    outputs:
      mainnet_live_color: ${{ steps.define_color_vars.outputs.mainnet_live_color }}
      mainnet_dead_color: ${{ steps.define_color_vars.outputs.mainnet_dead_color }}
      testnet_live_color: ${{ steps.define_color_vars.outputs.testnet_live_color }}
      testnet_dead_color: ${{ steps.define_color_vars.outputs.testnet_dead_color }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set AWS IAM role variable
        id: account
        run: echo "role_arn=${{ secrets.PROD_AWS_ACC_ROLE }}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ steps.account.outputs.role_arn }}

      - name: Get DNS record value
        id: get_dns_value
        run: |
          dns_mainnet_value=$(aws route53 list-resource-record-sets --hosted-zone-id ${{ inputs.hosted_zone_id }} --query "ResourceRecordSets[?Name == '${{ inputs.dns_record_mainnet_name }}'].ResourceRecords[].Value" --output text)
          dns_testnet_value=$(aws route53 list-resource-record-sets --hosted-zone-id ${{ inputs.hosted_zone_id }} --query "ResourceRecordSets[?Name == '${{ inputs.dns_record_testnet_name }}'].ResourceRecords[].Value" --output text)
          echo "dns_mainnet_value=$dns_mainnet_value" >> $GITHUB_OUTPUT
          echo "dns_testnet_value=$dns_testnet_value" >> $GITHUB_OUTPUT
      - name: Define output variables
        id: define_color_vars
        run: |
          if [[ "${{ steps.get_dns_value.outputs.dns_mainnet_value }}" == prod-blue* ]]; then
            echo "mainnet_live_color=prod-blue" >> $GITHUB_OUTPUT
            echo "mainnet_dead_color=prod-green" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.get_dns_value.outputs.dns_mainnet_value }}" == prod-green* ]]; then
            echo "mainnet_live_color=prod-green" >> $GITHUB_OUTPUT
            echo "mainnet_dead_color=prod-blue" >> $GITHUB_OUTPUT
          else
            echo "Error: DNS record value does not match expected patterns (prod-blue* or prod-green*)"
            exit 1
          fi

           if [[ "${{ steps.get_dns_value.outputs.dns_testnet_value }}" == prod-blue* ]]; then
            echo "testnet_live_color=prod-blue" >> $GITHUB_OUTPUT
            echo "testnet_dead_color=prod-green" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.get_dns_value.outputs.dns_testnet_value }}" == prod-green* ]]; then
            echo "testnet_live_color=prod-green" >> $GITHUB_OUTPUT
            echo "testnet_dead_color=prod-blue" >> $GITHUB_OUTPUT
          else
            echo "Error: DNS record value does not match expected patterns (prod-blue* or prod-green*)"
            exit 1
          fi
      
      - name: Output live/dead color environments
        run: |
          echo "Live color for mainnent environment is ${{ steps.define_color_vars.outputs.mainnet_live_color }}"
          echo "Dead color for mainnet environment is ${{ steps.define_color_vars.outputs.mainnet_dead_color }}"
          echo "Live color for testnet environment is ${{ steps.define_color_vars.outputs.testnet_live_color }}"
          echo "Dead color for testnet environment is ${{ steps.define_color_vars.outputs.testnet_dead_color }}"
    
