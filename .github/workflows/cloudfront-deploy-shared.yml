name: 'Cloudfront-deploy-shared'

on:
  push:
    branches:
      - cloudfront-changes-01
    paths:
      - 'terraform/cloudfront/shared/**'
      - 'terraform/cloudfront/environments/shared.yml'

env:
  TF_VERSION: '1.5.7'
  AWS_REGION: 'eu-west-1'

jobs:
  terraform-shared:
    name: 'Terraform cloudfront Shared'
    runs-on: ubuntu-latest
    
    # Use environment for shared infrastructure
    environment: 
      name: shared
      
    defaults:
      run:
        working-directory: terraform/cloudfront/shared
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: eu-west-1
        role-to-assume: ${{ secrets.AWS_ACC_ROLE }}
        
    - name: Terraform Format Check
      id: fmt
      run: terraform fmt -check -recursive
      continue-on-error: true
      
    - name: Terraform Init
      id: init
      run: terraform init
      
    - name: Terraform Validate
      id: validate
      run: terraform validate
      
    - name: Terraform Plan
      id: plan
      run: |
        terraform plan -no-color -out=tfplan
        terraform show -no-color tfplan
        
    - name: Terraform Apply
      id: apply
      run: terraform apply -auto-approve tfplan
      
    
