name: API Contract Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to validate via OpenAPI schema"
        default: dead
        required: false
        type: choice
        options:
          - dead
          - live
      base_url:
        description: "Override base URL (http/https). Leave blank to use the selected environment"
        required: false
        type: string

permissions:
  contents: read

jobs:
  schemathesis:
    name: Run contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dead' }}
      BASE_URL_INPUT: ${{ github.event.inputs.base_url }}
      MAX_RESPONSE_MILLISECONDS: "500"
      HYPOTHESIS_MAX_EXAMPLES: "250"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target endpoints
        id: resolve
        shell: bash
        run: |
          env_name="${ENVIRONMENT:-dead}"
          base_url="${BASE_URL_INPUT:-}"
          if [[ -z "$base_url" ]]; then
            case "$env_name" in
              dead)
                base_url="https://mainnet.dead.prod.vechain.org"
                ;;
              live)
                base_url="https://indexer.mainnet.vechain.org"
                ;;
              *)
                echo "Unsupported environment: $env_name" >&2
                exit 1
                ;;
            esac
            summary_env="$env_name"
          else
            summary_env="custom"
          fi

          base_url="${base_url%/}"
          schema_url="$base_url/api-docs"

          echo "environment=$env_name" >> "$GITHUB_OUTPUT"
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          echo "schema_url=$schema_url" >> "$GITHUB_OUTPUT"
          {
            echo "### API contract run"
            echo "- Environment: $summary_env"
            echo "- Base URL: $base_url"
            echo "- Schema: $schema_url"
            echo "- Max response (ms): $MAX_RESPONSE_MILLISECONDS"
            echo "- Hypothesis examples: $HYPOTHESIS_MAX_EXAMPLES"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Schemathesis
        run: pip install 'schemathesis>=3.19,<4'

      - name: Run schema-driven tests
        run: |
          mkdir -p .schemathesis
          scripts/run_api_contract_tests.sh "${{ steps.resolve.outputs.environment }}" \
            --base-url "${{ steps.resolve.outputs.base_url }}" \
            --store-network-log=./.schemathesis/network.log \
            --junit-xml=./.schemathesis/results.xml

      - name: Attach detailed CLI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-logs
          path: ./.schemathesis
          if-no-files-found: ignore
