name: Publish PR Image

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build images for'
        required: true
        type: string

concurrency:
  group: pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch || inputs.pr_number || github.run_id }}-ghcr-pr-publish
  cancel-in-progress: true

permissions: {}

env:
  registry: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    # Only run for successful PR test runs (not push-to-main), or manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      pr_number: ${{ steps.meta.outputs.pr_number }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      pr_tag: ${{ steps.meta.outputs.pr_tag }}
    steps:
      - name: Resolve PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          WR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          workflow_pr_number="${WR_PR_NUMBER:-}"
          workflow_head_branch="${WR_HEAD_BRANCH:-}"
          workflow_head_sha="${WR_HEAD_SHA:-}"

          skip_publish() {
            echo "::notice::$1"
            {
              echo "publish=false"
              echo "pr_number="
              echo "head_sha="
              echo "short_sha="
              echo "pr_tag="
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUM="$PR_NUMBER_INPUT"
            HEAD_SHA=""
          else
            PR_NUM="$workflow_pr_number"
            HEAD_SHA="$workflow_head_sha"

            if { [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; } && [ -n "$HEAD_SHA" ]; then
              PR_NUM=$(gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/$REPO/commits/$HEAD_SHA/pulls" \
                --jq '.[0].number // empty' \
                2>/dev/null || true)
            fi

            if { [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; } && [ -n "$workflow_head_branch" ]; then
              REPO_OWNER="${REPO%%/*}"
              PR_NUM=$(gh api \
                --method GET \
                -H "Accept: application/vnd.github+json" \
                "/repos/$REPO/pulls" \
                -f "head=$REPO_OWNER:$workflow_head_branch" \
                -f "state=open" \
                --jq '.[0].number // empty')
            fi
          fi

          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            skip_publish "No pull request is associated with this workflow run; skipping PR image publish."
          fi

          PR_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/pulls/$PR_NUM")
          HEAD_REPO=$(echo "$PR_JSON" | jq -r '.head.repo.full_name // empty')
          PR_HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha // empty')

          if [ "$HEAD_REPO" != "$REPO" ]; then
            skip_publish "PR #$PR_NUM is from $HEAD_REPO; skipping PR image publish for forked pull requests."
          fi

          if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ]; then
            HEAD_SHA="$PR_HEAD_SHA"
          fi

          if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ]; then
            skip_publish "Could not resolve a head SHA for PR #$PR_NUM; skipping PR image publish."
          fi

          SHORT_SHA="${HEAD_SHA:0:7}"

          {
            echo "publish=true"
            echo "pr_number=${PR_NUM}"
            echo "head_sha=${HEAD_SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "pr_tag=pr.${PR_NUM}.${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

  plan:
    name: Resolve content hashes
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    outputs:
      hashes: ${{ steps.plan.outputs.hashes }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      build_needed: ${{ steps.plan.outputs.build_needed }}
    steps:
      # Full fetch so the default branch is present for the hash script below.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The algorithm comes from the default branch, never from the PR: a branch
      # that could rename its own content would be publishing under a tag a
      # later release reuses. Only the tree being hashed is the PR's.
      - name: Take the hash script from the default branch
        id: hasher
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          # Hard failure rather than a fallback: falling back to the PR's own
          # copy is the case this step exists to prevent.
          ref="origin/${DEFAULT_BRANCH}"
          git rev-parse --verify --quiet "$ref" >/dev/null || {
            echo "::error::${ref} is unavailable; cannot resolve the trusted hash script."
            exit 1
          }
          script="$RUNNER_TEMP/content_hash.sh"
          git show "${ref}:.github/workflows/scripts/content_hash.sh" > "$script"
          chmod +x "$script"
          echo "path=$script" >> "$GITHUB_OUTPUT"

      - name: Hash build contexts and check GHCR
        id: plan
        env:
          IMAGE_ROOT: ${{ env.registry }}/${{ github.repository }}
          HASHER: ${{ steps.hasher.outputs.path }}
        run: |
          set -euo pipefail
          hashes='{}'
          to_build=()
          for pkg in api indexer; do
            hash=$("$HASHER" "$pkg")
            hashes=$(jq -c --arg k "$pkg" --arg v "$hash" '.[$k] = $v' <<<"$hashes")
            if docker buildx imagetools inspect --raw \
                 "${IMAGE_ROOT}/${pkg}:content.${hash}" >/dev/null 2>&1; then
              echo "::notice::$pkg content.$hash already in GHCR; reusing it."
            else
              echo "::notice::$pkg content.$hash is new; building."
              to_build+=("$pkg")
            fi
          done

          matrix=$(printf '%s\n' "${to_build[@]+"${to_build[@]}"}" | jq -Rc 'select(. != "")' | jq -sc .)
          {
            echo "hashes=${hashes}"
            echo "build_matrix=${matrix}"
            echo "build_needed=$([ "${#to_build[@]}" -gt 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [validate, plan]
    if: needs.plan.outputs.build_needed == 'true'
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        packageName: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
        platform: ["linux/amd64", "linux/arm64"]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            PACKAGE_NAME=${{ matrix.packageName }}
            CONTENT_HASH=${{ fromJSON(needs.plan.outputs.hashes)[matrix.packageName] }}
          context: ./
          provenance: false
          sbom: false
          secrets: |
            "gradle_props=gpr.user=${{ github.actor }}
            gpr.key=${{ secrets.GITHUB_TOKEN }}"
          outputs: type=image,name=${{ env.registry }}/${{ github.repository }}/${{ matrix.packageName }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.packageName }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-content-tag:
    name: Publish content tag - ${{ matrix.packageName }}
    runs-on: ubuntu-latest
    needs: [validate, plan, build]
    if: needs.plan.outputs.build_needed == 'true'
    permissions:
      actions: read
      packages: write
      contents: read
    strategy:
      matrix:
        packageName: ${{ fromJSON(needs.plan.outputs.build_matrix) }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.packageName }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.registry }}/${{ github.repository }}/${{ matrix.packageName }}
          CONTENT_TAG: content.${{ fromJSON(needs.plan.outputs.hashes)[matrix.packageName] }}
        run: |
          set -euo pipefail
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create -t "${IMAGE}:${CONTENT_TAG}" "${sources[@]}"

  tag-pr:
    name: Tag PR image - ${{ matrix.packageName }}
    runs-on: ubuntu-latest
    needs: [validate, plan, publish-content-tag]
    if: >-
      !cancelled() && needs.validate.outputs.publish == 'true'
      && needs.plan.result == 'success'
      && (needs.plan.outputs.build_needed != 'true'
          || needs.publish-content-tag.result == 'success')
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        packageName: ["api", "indexer"]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The content tag is the image's identity; pr.<n>.<sha> is a moving alias
      # onto it so the pull commands in the PR comment stay stable.
      - name: Point PR tag at the content tag
        env:
          IMAGE: ${{ env.registry }}/${{ github.repository }}/${{ matrix.packageName }}
          CONTENT_TAG: content.${{ fromJSON(needs.plan.outputs.hashes)[matrix.packageName] }}
          PR_TAG: ${{ needs.validate.outputs.pr_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:${PR_TAG}" "${IMAGE}:${CONTENT_TAG}"

  comment:
    runs-on: ubuntu-latest
    needs: [validate, plan, tag-pr]
    if: needs.validate.outputs.publish == 'true' && needs.tag-pr.result == 'success'
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Comment on PR with usage instructions
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-docker-image
          number: ${{ needs.validate.outputs.pr_number }}
          message: |
            ### PR Docker Images Published

            **API:** `content.${{ fromJSON(needs.plan.outputs.hashes)['api'] }}`
            ```
            docker pull ghcr.io/${{ github.repository }}/api:${{ needs.validate.outputs.pr_tag }}
            ```

            **Indexer:** `content.${{ fromJSON(needs.plan.outputs.hashes)['indexer'] }}`
            ```
            docker pull ghcr.io/${{ github.repository }}/indexer:${{ needs.validate.outputs.pr_tag }}
            ```

            Tags are aliases onto the content hash of each build context. A
            release that hashes the same reuses these images instead of
            rebuilding, and a service whose hash is unchanged is not redeployed.

            <details>
            <summary>Usage with docker compose</summary>

            Override the image in your `docker-compose.yaml`:

            ```yaml
            services:
              api:
                image: ghcr.io/${{ github.repository }}/api:${{ needs.validate.outputs.pr_tag }}
              indexer:
                image: ghcr.io/${{ github.repository }}/indexer:${{ needs.validate.outputs.pr_tag }}
            ```
            </details>
