name: Publish PR Image

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build images for'
        required: true
        type: string

concurrency:
  group: pr-${{ github.event.pull_request.number || inputs.pr_number }}-ghcr-pr-publish
  cancel-in-progress: true

permissions:
  packages: write
  contents: read
  pull-requests: write

env:
  registry: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.meta.outputs.pr_number }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
    steps:
      - name: Resolve PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            PR_NUMBER="${{ inputs.pr_number }}"
            PR_JSON=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid)
            echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(echo "$PR_JSON" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: validate
    strategy:
      matrix:
        packageName: ["api", "indexer"]
        platform: ["linux/amd64", "linux/arm64"]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: docker-build-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 1

      - name: Set PR version
        run: |
          SHORT_SHA=$(echo "${{ needs.validate.outputs.head_sha }}" | cut -c1-7)
          echo "PR_VERSION=v.0.0.0-pr.${{ needs.validate.outputs.pr_number }}.${SHORT_SHA}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            PACKAGE_NAME=${{ matrix.packageName }}
            APP_VERSION=${{ env.PR_VERSION }}
          context: ./
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.packageName }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.packageName }}-${{ matrix.platform }}
          secrets: |
            "gradle_props=gpr.user=${{ github.actor }}
            gpr.key=${{ secrets.GITHUB_TOKEN }}"
          outputs: type=image,name=${{ env.registry }}/${{ github.repository }}/${{ matrix.packageName }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.packageName }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [validate, build]
    strategy:
      matrix:
        packageName: ["api", "indexer"]

    steps:
      - name: Set PR version
        run: |
          SHORT_SHA=$(echo "${{ needs.validate.outputs.head_sha }}" | cut -c1-7)
          echo "PR_TAG=pr.${{ needs.validate.outputs.pr_number }}.${SHORT_SHA}" >> $GITHUB_ENV

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.packageName }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.registry }}/${{ github.repository }}/${{ matrix.packageName }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ env.PR_TAG }} \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

  comment:
    runs-on: ubuntu-latest
    needs: [validate, merge]

    steps:
      - name: Set PR version
        run: |
          SHORT_SHA=$(echo "${{ needs.validate.outputs.head_sha }}" | cut -c1-7)
          echo "PR_TAG=pr.${{ needs.validate.outputs.pr_number }}.${SHORT_SHA}" >> $GITHUB_ENV

      - name: Comment on PR with usage instructions
        uses: marocchino/sticky-pull-request-comment@f3bbb8300013c686241004a1c1b5d4045b10bc30 # v2.0.0
        with:
          header: pr-docker-image
          number: ${{ needs.validate.outputs.pr_number }}
          message: |
            ### PR Docker Images Published

            **API:**
            ```
            docker pull ghcr.io/${{ github.repository }}/api:${{ env.PR_TAG }}
            ```

            **Indexer:**
            ```
            docker pull ghcr.io/${{ github.repository }}/indexer:${{ env.PR_TAG }}
            ```

            <details>
            <summary>Usage with docker compose</summary>

            Override the image in your `docker-compose.yaml`:

            ```yaml
            services:
              api:
                image: ghcr.io/${{ github.repository }}/api:${{ env.PR_TAG }}
              indexer:
                image: ghcr.io/${{ github.repository }}/indexer:${{ env.PR_TAG }}
            ```
            </details>
