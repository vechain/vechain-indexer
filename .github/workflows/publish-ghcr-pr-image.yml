name: Publish PR Image

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build images for'
        required: true
        type: string

concurrency:
  group: pr-${{ github.event.pull_request.number || inputs.pr_number }}-ghcr-pr-publish
  cancel-in-progress: true

permissions:
  packages: write
  contents: read
  pull-requests: write

env:
  registry: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.meta.outputs.pr_number }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
    steps:
      - name: Resolve PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "pr_number=$PR_NUMBER_EVENT" >> "$GITHUB_OUTPUT"
            echo "head_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            PR_JSON=$(gh pr view "$PR_NUMBER_INPUT" --repo "$REPO" --json headRefOid)
            echo "pr_number=${PR_NUMBER_INPUT}" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(echo "$PR_JSON" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: validate
    # Fork PRs must not run on self-hosted runners (untrusted code execution).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      matrix:
        packageName: ["api", "indexer"]
        platform: ["linux/amd64", "linux/arm64"]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: docker-build-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 1

      - name: Set PR version
        run: |
          SHORT_SHA=$(echo "${{ needs.validate.outputs.head_sha }}" | cut -c1-7)
          echo "PR_VERSION=v.0.0.0-pr.${{ needs.validate.outputs.pr_number }}.${SHORT_SHA}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            PACKAGE_NAME=${{ matrix.packageName }}
            APP_VERSION=${{ env.PR_VERSION }}
          context: ./
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.packageName }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.packageName }}-${{ matrix.platform }}
          secrets: |
            "gradle_props=gpr.user=${{ github.actor }}
            gpr.key=${{ secrets.GITHUB_TOKEN }}"
          outputs: type=image,name=${{ env.registry }}/${{ github.repository }}/${{ matrix.packageName }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.packageName }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [validate, build]
    strategy:
      matrix:
        packageName: ["api", "indexer"]

    steps:
      - name: Set PR version
        run: |
          SHORT_SHA=$(echo "${{ needs.validate.outputs.head_sha }}" | cut -c1-7)
          echo "PR_TAG=pr.${{ needs.validate.outputs.pr_number }}.${SHORT_SHA}" >> $GITHUB_ENV

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.packageName }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.registry }}/${{ github.repository }}/${{ matrix.packageName }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ env.PR_TAG }} \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

  comment:
    runs-on: ubuntu-latest
    needs: [validate, merge]

    steps:
      - name: Set PR version
        run: |
          SHORT_SHA=$(echo "${{ needs.validate.outputs.head_sha }}" | cut -c1-7)
          echo "PR_TAG=pr.${{ needs.validate.outputs.pr_number }}.${SHORT_SHA}" >> $GITHUB_ENV

      - name: Comment on PR with usage instructions
        uses: marocchino/sticky-pull-request-comment@f3bbb8300013c686241004a1c1b5d4045b10bc30 # v2.0.0
        with:
          header: pr-docker-image
          number: ${{ needs.validate.outputs.pr_number }}
          message: |
            ### PR Docker Images Published

            **API:**
            ```
            docker pull ghcr.io/${{ github.repository }}/api:${{ env.PR_TAG }}
            ```

            **Indexer:**
            ```
            docker pull ghcr.io/${{ github.repository }}/indexer:${{ env.PR_TAG }}
            ```

            <details>
            <summary>Usage with docker compose</summary>

            Override the image in your `docker-compose.yaml`:

            ```yaml
            services:
              api:
                image: ghcr.io/${{ github.repository }}/api:${{ env.PR_TAG }}
              indexer:
                image: ghcr.io/${{ github.repository }}/indexer:${{ env.PR_TAG }}
            ```
            </details>
