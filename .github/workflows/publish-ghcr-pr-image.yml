name: Publish PR Image

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build images for'
        required: true
        type: string

concurrency:
  group: pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch || inputs.pr_number || github.run_id }}-ghcr-pr-publish
  cancel-in-progress: true

permissions: {}

env:
  registry: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    # Only run for successful PR test runs (not push-to-main), or manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      pr_number: ${{ steps.meta.outputs.pr_number }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      pr_tag: ${{ steps.meta.outputs.pr_tag }}
      pr_version: ${{ steps.meta.outputs.pr_version }}
    steps:
      - name: Resolve PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          WR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          workflow_pr_number="${WR_PR_NUMBER:-}"
          workflow_head_branch="${WR_HEAD_BRANCH:-}"
          workflow_head_sha="${WR_HEAD_SHA:-}"

          skip_publish() {
            echo "::notice::$1"
            {
              echo "publish=false"
              echo "pr_number="
              echo "head_sha="
              echo "short_sha="
              echo "pr_tag="
              echo "pr_version="
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUM="$PR_NUMBER_INPUT"
            HEAD_SHA=""
          else
            PR_NUM="$workflow_pr_number"
            HEAD_SHA="$workflow_head_sha"

            if { [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; } && [ -n "$HEAD_SHA" ]; then
              PR_NUM=$(gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/$REPO/commits/$HEAD_SHA/pulls" \
                --jq '.[0].number // empty' \
                2>/dev/null || true)
            fi

            if { [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; } && [ -n "$workflow_head_branch" ]; then
              REPO_OWNER="${REPO%%/*}"
              PR_NUM=$(gh api \
                --method GET \
                -H "Accept: application/vnd.github+json" \
                "/repos/$REPO/pulls" \
                -f "head=$REPO_OWNER:$workflow_head_branch" \
                -f "state=open" \
                --jq '.[0].number // empty')
            fi
          fi

          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            skip_publish "No pull request is associated with this workflow run; skipping PR image publish."
          fi

          PR_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/pulls/$PR_NUM")
          HEAD_REPO=$(echo "$PR_JSON" | jq -r '.head.repo.full_name // empty')
          PR_HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha // empty')

          if [ "$HEAD_REPO" != "$REPO" ]; then
            skip_publish "PR #$PR_NUM is from $HEAD_REPO; skipping PR image publish for forked pull requests."
          fi

          if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ]; then
            HEAD_SHA="$PR_HEAD_SHA"
          fi

          if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ]; then
            skip_publish "Could not resolve a head SHA for PR #$PR_NUM; skipping PR image publish."
          fi

          SHORT_SHA="${HEAD_SHA:0:7}"

          {
            echo "publish=true"
            echo "pr_number=${PR_NUM}"
            echo "head_sha=${HEAD_SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "pr_tag=pr.${PR_NUM}.${SHORT_SHA}"
            echo "pr_version=v.0.0.0-pr.${PR_NUM}.${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        packageName: ["api", "indexer"]
        platform: ["linux/amd64", "linux/arm64"]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            PACKAGE_NAME=${{ matrix.packageName }}
            APP_VERSION=${{ needs.validate.outputs.pr_version }}
          context: ./
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.packageName }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.packageName }}-${{ matrix.platform }}
          secrets: |
            "gradle_props=gpr.user=${{ github.actor }}
            gpr.key=${{ secrets.GITHUB_TOKEN }}"
          outputs: type=image,name=${{ env.registry }}/${{ github.repository }}/${{ matrix.packageName }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.packageName }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: needs.validate.outputs.publish == 'true'
    permissions:
      actions: read
      packages: write
      contents: read
    strategy:
      matrix:
        packageName: ["api", "indexer"]

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.packageName }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.registry }}/${{ github.repository }}/${{ matrix.packageName }}
          PR_TAG: ${{ needs.validate.outputs.pr_tag }}
        run: |
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create \
            -t "${IMAGE}:${PR_TAG}" \
            "${sources[@]}"

  comment:
    runs-on: ubuntu-latest
    needs: [validate, merge]
    if: needs.validate.outputs.publish == 'true'
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Comment on PR with usage instructions
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: pr-docker-image
          number: ${{ needs.validate.outputs.pr_number }}
          message: |
            ### PR Docker Images Published

            **API:**
            ```
            docker pull ghcr.io/${{ github.repository }}/api:${{ needs.validate.outputs.pr_tag }}
            ```

            **Indexer:**
            ```
            docker pull ghcr.io/${{ github.repository }}/indexer:${{ needs.validate.outputs.pr_tag }}
            ```

            <details>
            <summary>Usage with docker compose</summary>

            Override the image in your `docker-compose.yaml`:

            ```yaml
            services:
              api:
                image: ghcr.io/${{ github.repository }}/api:${{ needs.validate.outputs.pr_tag }}
              indexer:
                image: ghcr.io/${{ github.repository }}/indexer:${{ needs.validate.outputs.pr_tag }}
            ```
            </details>
