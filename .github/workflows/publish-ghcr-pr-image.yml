name: Publish PR Image

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build images for'
        required: true
        type: string

concurrency:
  group: pr-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}-ghcr-pr-publish
  cancel-in-progress: true

permissions: {}

env:
  registry: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    # Only run for successful PR test runs (not push-to-main), or manual dispatch.
    # pull_requests array is empty for fork PRs, so forks are excluded automatically.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0].number > 0)
    outputs:
      pr_number: ${{ steps.meta.outputs.pr_number }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      pr_tag: ${{ steps.meta.outputs.pr_tag }}
      pr_version: ${{ steps.meta.outputs.pr_version }}
    steps:
      - name: Resolve PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          WR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_JSON=$(gh pr view "$PR_NUMBER_INPUT" --repo "$REPO" --json headRefOid)
            PR_NUM="$PR_NUMBER_INPUT"
            HEAD_SHA=$(echo "$PR_JSON" | jq -r .headRefOid)
          else
            PR_NUM="$WR_PR_NUMBER"
            HEAD_SHA="$WR_HEAD_SHA"
          fi

          SHORT_SHA="${HEAD_SHA:0:7}"

          echo "pr_number=${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_tag=pr.${PR_NUM}.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_version=v.0.0.0-pr.${PR_NUM}.${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        packageName: ["api", "indexer"]
        platform: ["linux/amd64", "linux/arm64"]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: docker-build-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            PACKAGE_NAME=${{ matrix.packageName }}
            APP_VERSION=${{ needs.validate.outputs.pr_version }}
          context: ./
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.packageName }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.packageName }}-${{ matrix.platform }}
          secrets: |
            "gradle_props=gpr.user=${{ github.actor }}
            gpr.key=${{ secrets.GITHUB_TOKEN }}"
          outputs: type=image,name=${{ env.registry }}/${{ github.repository }}/${{ matrix.packageName }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.packageName }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [validate, build]
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        packageName: ["api", "indexer"]

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.packageName }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.registry }}/${{ github.repository }}/${{ matrix.packageName }}
          PR_TAG: ${{ needs.validate.outputs.pr_tag }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${PR_TAG}" \
            $(printf "${IMAGE}@sha256:%s " *)

  comment:
    runs-on: ubuntu-latest
    needs: [validate, merge]
    permissions:
      pull-requests: write

    steps:
      - name: Comment on PR with usage instructions
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: pr-docker-image
          number: ${{ needs.validate.outputs.pr_number }}
          message: |
            ### PR Docker Images Published

            **API:**
            ```
            docker pull ghcr.io/${{ github.repository }}/api:${{ needs.validate.outputs.pr_tag }}
            ```

            **Indexer:**
            ```
            docker pull ghcr.io/${{ github.repository }}/indexer:${{ needs.validate.outputs.pr_tag }}
            ```

            <details>
            <summary>Usage with docker compose</summary>

            Override the image in your `docker-compose.yaml`:

            ```yaml
            services:
              api:
                image: ghcr.io/${{ github.repository }}/api:${{ needs.validate.outputs.pr_tag }}
              indexer:
                image: ghcr.io/${{ github.repository }}/indexer:${{ needs.validate.outputs.pr_tag }}
            ```
            </details>
