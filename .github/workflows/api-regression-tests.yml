name: API Regression Tests

on:
  workflow_dispatch:
    inputs:
      candidate_url:
        description: "Candidate API URL (the version being validated)"
        default: "https://mainnet.dead.prod.veworld.vechain.org"
        required: false
        type: string
      baseline_url:
        description: "Baseline API URL (the known-good reference)"
        default: "https://indexer.mainnet.vechain.org"
        required: false
        type: string
  workflow_call:
    inputs:
      candidate_url:
        description: "Candidate API URL (the version being validated)"
        required: false
        type: string
        default: "https://mainnet.dead.prod.veworld.vechain.org"
      baseline_url:
        description: "Baseline API URL (the known-good reference)"
        required: false
        type: string
        default: "https://indexer.mainnet.vechain.org"

permissions:
  contents: read

jobs:
  regression:
    name: Regression comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run regression comparison (candidate vs baseline)
        env:
          CANDIDATE_URL: ${{ inputs.candidate_url || 'https://mainnet.dead.prod.veworld.vechain.org' }}
          BASELINE_URL: ${{ inputs.baseline_url || 'https://indexer.mainnet.vechain.org' }}
        run: |
          mkdir -p .regression
          scripts/run_regression_tests.sh \
            --output .regression/report.json

      - name: Generate summary
        if: always()
        shell: bash
        run: |
          if [[ -f .regression/report.json ]]; then
            total=$(python3 -c "import json; r=json.load(open('.regression/report.json')); print(r['summary']['total'])")
            passed=$(python3 -c "import json; r=json.load(open('.regression/report.json')); print(r['summary']['passed'])")
            failed=$(python3 -c "import json; r=json.load(open('.regression/report.json')); print(r['summary']['failed'])")
            {
              echo "### Regression Comparison (candidate vs baseline)"
              echo "- Candidate: ${{ inputs.candidate_url || 'https://mainnet.dead.prod.veworld.vechain.org' }}"
              echo "- Baseline: ${{ inputs.baseline_url || 'https://indexer.mainnet.vechain.org' }}"
              echo "- Total: $total"
              echo "- Passed: $passed"
              echo "- Failed: $failed"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: ./.regression
          if-no-files-found: ignore
