name: Plan or Apply Terraform

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/api/**'
      - '.github/workflows/plan-or-apply-terraform.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to plan/deploy to
        required: true
        type: environment
  workflow_call:
    inputs:
      environment:
        description: Which environment to plan/deploy to
        required: true
        type: string
      mainnet_version:
        description: The version of this release
        required: false
        type: string
      testnet_version:
        description: The version of this release
        required: false
        type: string
      force:
        description: Whether to force apply
        required: false
        default: false
        type: boolean
    secrets:
      AWS_ACC_ROLE:
        description: "AWS IAM role ARN for OIDC authentication"
        required: true
      VECHAINCI_SSH_PRIVATE_KEYS:
        description: "SSH key for accessing vechain Terraform modules"
        required: true

# Required for authentication through GitHub OIDC
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

concurrency:
  group: terraform-${{ inputs.environment || 'pr' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identify-live-color:
    if: ${{ github.event_name == 'pull_request' }}
    name: Identify Live and Dead Colors
    uses: ./.github/workflows/identify-live-color.yml
    with:
      dns_record_mainnet_name: mainnet.live.prod.veworld.vechain.org.
      dns_record_testnet_name: testnet.live.prod.veworld.vechain.org.
      hosted_zone_id: Z08093993BM56HB3DD4U4
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}

  deploy:
    needs: identify-live-color
    if: always() && needs.identify-live-color.result == 'success' || needs.identify-live-color.result == 'skipped'
    name: "Plan/deploy veworld-Indexer terraform - ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || needs.identify-live-color.outputs.mainnet_live_color }}
    env:
      ENVIRONMENT: ${{ inputs.environment || needs.identify-live-color.outputs.mainnet_live_color }}

    defaults:
      run:
        working-directory: terraform/api

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      # Required for Terraform to source modules from other vechain repositories
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: true

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Initialize
        id: init
        run: terraform init -backend-config="environments/${{ env.ENVIRONMENT }}.config"

      - name: Terraform Workspace
        id: workspace
        run: terraform workspace select ${{ env.ENVIRONMENT }}

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Update image_tag
        id: update-image-tag
        if: inputs.mainnet_version && inputs.testnet_version
        env:
          MAINNET_VERSION: ${{ inputs.mainnet_version }}
          TESTNET_VERSION: ${{ inputs.testnet_version }}
        run: |
          sed -i "/main:/,/image_version:/s/image_version:.*/image_version: $MAINNET_VERSION/" environments/${{ env.ENVIRONMENT }}.yml
          sed -i "/test:/,/image_version:/s/image_version:.*/image_version: $TESTNET_VERSION/" environments/${{ env.ENVIRONMENT }}.yml
          cat environments/${{ env.ENVIRONMENT }}.yml
        continue-on-error: false

      - name: Terraform Plan
        id: plan
        run: terraform plan -out "apply.plan"

      - name: Should proceed with deployment? (PR builds will never deploy)
        if: github.ref == 'refs/heads/main' || inputs.force
        id: check-env
        env:
          FORCE_APPLY: ${{ inputs.force }}
        run: |
          cluster_services=$(aws ecs list-services --cluster ${{ env.ENVIRONMENT }}-veworld-cluster --query 'length(serviceArns)' --output text 2>/dev/null || echo "0")
          if [ "$FORCE_APPLY" == "true" ]; then
            echo "Force apply enabled, proceeding with deployment"
          elif (( $cluster_services > 0 )); then
            echo "env_exists=true" >> $GITHUB_OUTPUT
            echo "The ${{ env.ENVIRONMENT }} environment exists, proceeding with deployment"
          else
            echo "env_exists=false" >> $GITHUB_OUTPUT
            echo "The ${{ env.ENVIRONMENT }} environment doesn't exist. Please create it manually first, or enable force apply"
          fi

      - name: Terraform Apply
        if: (github.ref == 'refs/heads/main' && steps.check-env.outputs.env_exists == 'true') || inputs.force
        id: apply
        run: terraform apply "apply.plan"

      - name: Tag deployed image in ECR to protect from lifecycle expiration
        if: steps.apply.outcome == 'success' && (env.ENVIRONMENT == 'prod-blue' || env.ENVIRONMENT == 'prod-green')
        env:
          MAINNET_VERSION: ${{ inputs.mainnet_version }}
          TESTNET_VERSION: ${{ inputs.testnet_version }}
        run: |
          set -euo pipefail
          PROTECTION_TAG="${{ env.ENVIRONMENT }}"

          # Get ECR repository URI
          ECR_REPO_URI_API=$(aws ecr describe-repositories --repository-names "veworld/api" --query 'repositories[0].repositoryUri' --output text 2>/dev/null || echo "")
          ECR_REPO_URI_INDEXER=$(aws ecr describe-repositories --repository-names "veworld/indexer" --query 'repositories[0].repositoryUri' --output text 2>/dev/null || echo "")

          if [ -z "$ECR_REPO_URI_API" ] || [ -z "$ECR_REPO_URI_INDEXER" ]; then
            echo "ERROR: cannot tag images - one or more ECR repositories not found (api='$ECR_REPO_URI_API' indexer='$ECR_REPO_URI_INDEXER')"
            exit 1
          fi

          # Idempotently tag $SOURCE_TAG in $REPO with $TARGET_TAG.
          # Skips if $TARGET_TAG already points at the same digest as $SOURCE_TAG.
          # Re-points $TARGET_TAG if it exists on a different digest.
          tag_image() {
            local repo="$1" source_tag="$2" target_tag="$3"

            local source_digest
            source_digest=$(aws ecr describe-images --repository-name "$repo" \
              --image-ids imageTag="$source_tag" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "")
            if [ -z "$source_digest" ] || [ "$source_digest" = "None" ]; then
              echo "ERROR: source image $repo:$source_tag not found in ECR"
              return 1
            fi

            local target_digest
            target_digest=$(aws ecr describe-images --repository-name "$repo" \
              --image-ids imageTag="$target_tag" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "")

            if [ "$source_digest" = "$target_digest" ]; then
              echo "Skipping $repo:$target_tag - already points at $source_digest"
              return 0
            fi

            echo "Tagging $repo:$source_tag ($source_digest) as $target_tag"
            local manifest
            manifest=$(aws ecr batch-get-image --repository-name "$repo" \
              --image-ids imageTag="$source_tag" \
              --query 'images[0].imageManifest' --output text)
            aws ecr put-image --repository-name "$repo" \
              --image-tag "$target_tag" --image-manifest "$manifest" >/dev/null
          }

          tag_image "veworld/api"     "$MAINNET_VERSION" "${PROTECTION_TAG}-mainnet"
          tag_image "veworld/api"     "$TESTNET_VERSION" "${PROTECTION_TAG}-testnet"
          tag_image "veworld/indexer" "$MAINNET_VERSION" "${PROTECTION_TAG}-mainnet"
          tag_image "veworld/indexer" "$TESTNET_VERSION" "${PROTECTION_TAG}-testnet"

          echo "Successfully tagged images with protection tag: ${PROTECTION_TAG}"

      # - name: Slack Notification
      #   if: steps.apply.outcome == 'success'
      #   uses: rtCamp/action-slack-notify@v2
      #   env:
      #     SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      #     SLACK_COLOR: ${{ job.status }}
      #     SLACK_MESSAGE: Deployed veworld-Indexer to *${{ env.ENVIRONMENT }}* environment
      #     SLACK_TITLE: veworld-Indexer Infrastructure Deployment