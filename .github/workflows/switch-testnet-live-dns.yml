name: Switch Route 53 Records

on:
  workflow_dispatch:
    inputs:
      current_record:
        description: 'Current active record (testnet.live.prod.veworld.vechain.org or testnet.dead.prod.veworld.vechain.org)'
        required: true
        default: 'testnet.live.prod.veworld.vechain.org'

jobs:
  switch-records:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: eu-west-1
        role-to-assume: ${{ secrets.PROD_AWS_ACC_ROLE }}

    - name: Switch Route 53 Records
      id: switch
      run: |
        HOSTED_ZONE_ID="YOUR_HOSTED_ZONE_ID"
        CURRENT_RECORD="${{ github.event.inputs.current_record }}"
        
        if [[ "$CURRENT_RECORD" == "testnet.live.prod.veworld.vechain.org" ]]; then
          NEW_RECORD="testnet.dead.prod.veworld.vechain.org"
        else
          NEW_RECORD="testnet.live.prod.veworld.vechain.org"
        fi
        
        CURRENT_IP=$(aws route53 list-resource-record-sets --hosted-zone-id $HOSTED_ZONE_ID --query "ResourceRecordSets[?Name == '$CURRENT_RECORD.'].ResourceRecords[0].Value" --output text)
        NEW_IP=$(aws route53 list-resource-record-sets --hosted-zone-id $HOSTED_ZONE_ID --query "ResourceRecordSets[?Name == '$NEW_RECORD.'].ResourceRecords[0].Value" --output text)
        
        echo "Switching $CURRENT_RECORD (IP: $CURRENT_IP) with $NEW_RECORD (IP: $NEW_IP)"

      env:
        AWS_DEFAULT_REGION: us-east-1

    - name: Confirm Switch
      run: |
        echo "Verifying switch..."
        aws route53 list-resource-record-sets --hosted-zone-id ${{ env.HOSTED_ZONE_ID }} --query "ResourceRecordSets[?Name == '$NEW_RECORD.']"
        aws route53 list-resource-record-sets --hosted-zone-id ${{ env.HOSTED_ZONE_ID }} --query "ResourceRecordSets[?Name == '$CURRENT_RECORD.']"
