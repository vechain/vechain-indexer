name: Test, Publish & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - "*"


jobs:
  setup-env:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      latest-tag: ${{ steps.latest-tag.outputs.latest-tag }}
    steps:
      - id: latest-tag
        run: echo "latest-tag=${{ github.ref == 'refs/heads/main' && 'dev-latest' || github.ref_name }}" >> "$GITHUB_OUTPUT"
  #  test-gradle:
  #    uses: ./.github/workflows/test-gradle.yml
  #  publish-test-results:
  #    uses: ./.github/workflows/publish-test-results.yml
  #    needs: test-gradle
  publish-images-to-ecr:
    uses: ./.github/workflows/publish-images.yml
    #    needs: [ setup-env, test-gradle ]
    needs: [ setup-env ]
    with:
      imageTag: ${{ github.sha }}
      latestTag: ${{needs.setup-env.outputs.latest-tag}}
    secrets: inherit
  deploy-to-ecs:
    uses: ./.github/workflows/deploy-to-ecs.yml
    needs: [ setup-env, publish-images-to-ecr ]
    secrets: inherit
    with:
      indexerImageTag: ${{ github.ref == 'refs/heads/main' && github.sha || needs.setup-env.outputs.latest-tag}}
      apiImageTag: ${{ github.ref == 'refs/heads/main' && github.sha || needs.setup-env.outputs.latest-tag }}
      environment: dev
