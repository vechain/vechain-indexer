name: API Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for schema conformance tests"
        default: dead
        required: false
        type: choice
        options:
          - dead
          - live
      base_url:
        description: "Override base URL (http/https). Leave blank to use the selected environment"
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        description: "Target environment for schema tests (dead/live)"
        required: true
        type: string
      base_url:
        description: "Override base URL (http/https). Leave blank to use the selected environment"
        required: false
        type: string

permissions:
  contents: read

jobs:
  schemathesis:
    name: Schema conformance - mainnet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAX_RESPONSE_MILLISECONDS: "5000"
      HYPOTHESIS_MAX_EXAMPLES: "250"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve base URL
        id: resolve
        shell: bash
        run: |
          base_url="${{ inputs.base_url }}"
          environment="${{ inputs.environment || 'dead' }}"

          if [[ -n "$base_url" ]]; then
            base_url="${base_url%/}"
            summary_env="custom"
          else
            case "$environment" in
              dead)
                base_url="https://mainnet.dead.prod.veworld.vechain.org"
                summary_env="dead-mainnet"
                ;;
              live)
                base_url="https://indexer.mainnet.vechain.org"
                summary_env="live-mainnet"
                ;;
              *)
                echo "Unsupported environment: $environment" >&2
                exit 1
                ;;
            esac
          fi

          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Schema Conformance Tests"
            echo "- Target: $summary_env"
            echo "- Base URL: $base_url"
            echo "- Schema: $base_url/api-docs"
            echo "- Max response (ms): $MAX_RESPONSE_MILLISECONDS"
            echo "- Hypothesis examples: $HYPOTHESIS_MAX_EXAMPLES"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Schemathesis
        run: pip install 'schemathesis>=3.19,<4'

      - name: Run schema-driven tests
        run: |
          mkdir -p .schemathesis
          scripts/run_api_schema_tests.sh dead \
            --base-url "${{ steps.resolve.outputs.base_url }}" \
            --store-network-log=./.schemathesis/network.log \
            --junit-xml=./.schemathesis/results.xml

      - name: Upload schema test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-logs
          path: ./.schemathesis
          if-no-files-found: ignore

  regression:
    name: Regression comparison - mainnet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run regression comparison (live vs dead)
        run: |
          mkdir -p .regression
          scripts/run_regression_tests.sh \
            --output .regression/report.json

      - name: Generate summary
        if: always()
        shell: bash
        run: |
          if [[ -f .regression/report.json ]]; then
            total=$(python3 -c "import json; r=json.load(open('.regression/report.json')); print(r['summary']['total'])")
            passed=$(python3 -c "import json; r=json.load(open('.regression/report.json')); print(r['summary']['passed'])")
            failed=$(python3 -c "import json; r=json.load(open('.regression/report.json')); print(r['summary']['failed'])")
            {
              echo "### Regression Comparison (live vs dead)"
              echo "- Total: $total"
              echo "- Passed: $passed"
              echo "- Failed: $failed"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: ./.regression
          if-no-files-found: ignore

  api-tests-result:
    name: API Tests Result
    runs-on: ubuntu-latest
    needs: [schemathesis, regression]
    if: always()
    steps:
      - name: Check API tests status
        run: |
          schema_result="${{ needs.schemathesis.result }}"
          regression_result="${{ needs.regression.result }}"

          echo "Schema conformance: $schema_result"
          echo "Regression comparison: $regression_result"

          failed=false
          for result in "$schema_result" "$regression_result"; do
            case "$result" in
              success|skipped) ;;
              *) failed=true ;;
            esac
          done

          if $failed; then
            echo "Some API tests failed"
            exit 1
          else
            echo "All API tests passed"
          fi
