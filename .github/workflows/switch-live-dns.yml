name: Switch Live Environment

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Switch network?"
        required: true
        type: choice
        options:
          - all
          - mainnet
          - testnet

permissions:
  id-token: write  # This is required for requesting the JWT
  contents: read   # This is required for actions/checkout

concurrency:
  group: switch-live-dns
  cancel-in-progress: false

jobs:

  identify-live-color:
    name: Identify live color
    uses: ./.github/workflows/identify-live-color.yml
    with:
      dns_record_mainnet_name: mainnet.live.prod.veworld.vechain.org.
      dns_record_testnet_name: testnet.live.prod.veworld.vechain.org.
      hosted_zone_id: Z08093993BM56HB3DD4U4
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}

  fetch-lb-dns-names:
    name: Fetch load balancer DNS names
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Get load balancer DNS names
        id: get-lb-dns-names
        run: |
          blue_main_dns=$(aws elbv2 describe-load-balancers --names prod-blue-main-api-veworld-alb --query 'LoadBalancers[0].DNSName' --output text) ||
          { echo "Error: Failed to fetch blue mainnet load balancer dns. Please ensure the dead environment is deployed and ready to receive traffic"; exit 1; }
          blue_test_dns=$(aws elbv2 describe-load-balancers --names prod-blue-test-api-veworld-alb --query 'LoadBalancers[0].DNSName' --output text) ||
          { echo "Error: Failed to fetch blue testnet load balancer dns. Please ensure the dead environment is deployed and ready to receive traffic"; exit 1; }
          green_main_dns=$(aws elbv2 describe-load-balancers --names prod-green-main-api-veworld-alb --query 'LoadBalancers[0].DNSName' --output text) ||
          { echo "Error: Failed to fetch green mainnet load balancer dns. Please ensure the dead environment is deployed and ready to receive traffic"; exit 1; }
          green_test_dns=$(aws elbv2 describe-load-balancers --names prod-green-test-api-veworld-alb --query 'LoadBalancers[0].DNSName' --output text) ||
          { echo "Error: Failed to fetch green testnet load balancer dns. Please ensure the dead environment is deployed and ready to receive traffic"; exit 1; }

          echo "blue_main_dns=$blue_main_dns" >> $GITHUB_OUTPUT
          echo "blue_test_dns=$blue_test_dns" >> $GITHUB_OUTPUT
          echo "green_main_dns=$green_main_dns" >> $GITHUB_OUTPUT
          echo "green_test_dns=$green_test_dns" >> $GITHUB_OUTPUT

    outputs:
      blue_main_dns: ${{ steps.get-lb-dns-names.outputs.blue_main_dns }}
      blue_test_dns: ${{ steps.get-lb-dns-names.outputs.blue_test_dns }}
      green_main_dns: ${{ steps.get-lb-dns-names.outputs.green_main_dns }}
      green_test_dns: ${{ steps.get-lb-dns-names.outputs.green_test_dns }}

  deploy-vpc-stack:
    name: Prepare VPC stack & switch DNS
    runs-on: ubuntu-latest
    needs: [fetch-lb-dns-names, identify-live-color]
    outputs:
      live_color_mainnet: ${{ steps.set-colours.outputs.live_color_mainnet }}
      live_color_testnet: ${{ steps.set-colours.outputs.live_color_testnet }}
      env_ready: ${{ steps.check-dead-env-is-ready.outputs.env_ready }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The live_color_mainnet and live_color_testnet variables define the desired colour of each network (ie after worklfow completion), not necessarily the current colour.
      - name: Determine and log colours to pass to Terraform
        id: set-colours
        env:
          NETWORK: ${{ github.event.inputs.network }}
          MAINNET_LIVE: ${{ needs.identify-live-color.outputs.mainnet_live_color }}
          MAINNET_DEAD: ${{ needs.identify-live-color.outputs.mainnet_dead_color }}
          TESTNET_LIVE: ${{ needs.identify-live-color.outputs.testnet_live_color }}
          TESTNET_DEAD: ${{ needs.identify-live-color.outputs.testnet_dead_color }}
        run: |
          echo "Switching DNS for network: $NETWORK"
          case "$NETWORK" in
            mainnet)
              echo "Current mainnet live colour: $MAINNET_LIVE"
              echo "New mainnet live colour: $MAINNET_DEAD"
              echo "live_color_mainnet=$MAINNET_DEAD" >> "$GITHUB_OUTPUT"
              echo "live_color_testnet=$TESTNET_LIVE" >> "$GITHUB_OUTPUT"
              ;;
            testnet)
              echo "Current testnet live colour: $TESTNET_LIVE"
              echo "New testnet live colour: $TESTNET_DEAD"
              echo "live_color_mainnet=$MAINNET_LIVE" >> "$GITHUB_OUTPUT"
              echo "live_color_testnet=$TESTNET_DEAD" >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo "Current mainnet live colour: $MAINNET_LIVE"
              echo "New mainnet live colour: $MAINNET_DEAD"
              echo "Current testnet live colour: $TESTNET_LIVE"
              echo "New testnet live colour: $TESTNET_DEAD"
              if [ "$MAINNET_DEAD" == "$TESTNET_DEAD" ]; then
                echo "live_color_mainnet=$MAINNET_DEAD" >> "$GITHUB_OUTPUT"
                echo "live_color_testnet=$TESTNET_DEAD" >> "$GITHUB_OUTPUT"
              else
                echo "::warning::Mainnet and Testnet are currently misaligned. Switching 'all' is only allowed if both networks are live on the same colour."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown network: $NETWORK"
              exit 1
              ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
            aws-region: eu-west-1
            role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Check Dead ENV is Ready
        id: check-dead-env-is-ready
        env:
          NETWORK: ${{ github.event.inputs.network }}
          MAINNET_DEAD: ${{ needs.identify-live-color.outputs.mainnet_dead_color }}
          TESTNET_DEAD: ${{ needs.identify-live-color.outputs.testnet_dead_color }}
        run: |
          mainnet_ready=false
          testnet_ready=false

          # Check mainnet readiness
          if [ "$NETWORK" == "mainnet" ] || [ "$NETWORK" == "all" ]; then
              cluster_services=$(aws ecs list-services --cluster "${MAINNET_DEAD}-veworld-cluster" --query 'length(serviceArns)' --output text)
              if (( cluster_services > 0 )); then
                mainnet_ready=true
                echo "The $MAINNET_DEAD mainnet ECS services are ready, proceeding with deployment"
              else
                echo "The $MAINNET_DEAD mainnet services don't seem to be running"
              fi
          fi

          # Check testnet readiness
          if [ "$NETWORK" == "testnet" ] || [ "$NETWORK" == "all" ]; then
              cluster_services=$(aws ecs list-services --cluster "${TESTNET_DEAD}-veworld-cluster" --query 'length(serviceArns)' --output text)
              if (( cluster_services > 0 )); then
                testnet_ready=true
                echo "The $TESTNET_DEAD testnet ECS services are ready, proceeding with deployment"
              else
                echo "The $TESTNET_DEAD testnet services don't seem to be running"
              fi
          fi

          # Determine final readiness
          if [ "$NETWORK" == "mainnet" ] && [ "$mainnet_ready" == "true" ]; then
              echo "env_ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$NETWORK" == "testnet" ] && [ "$testnet_ready" == "true" ]; then
              echo "env_ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$NETWORK" == "all" ] && [ "$mainnet_ready" == "true" ] && [ "$testnet_ready" == "true" ]; then
              echo "env_ready=true" >> "$GITHUB_OUTPUT"
          else
              echo "env_ready=false" >> "$GITHUB_OUTPUT"
              echo "Environment(s) not ready. Please ensure the required environment(s) are ready for traffic before switching"
              exit 1
          fi

  apply-vpc-stack:
    name: Deploy VPC stack & switch DNS
    needs: [deploy-vpc-stack]
    if: ${{ needs.deploy-vpc-stack.outputs.env_ready == 'true' }}
    uses: ./.github/workflows/deploy-colour-agnostic-infra.yml
    with:
      environment: prod
      live_color_mainnet: ${{ needs.deploy-vpc-stack.outputs.live_color_mainnet }}
      live_color_testnet: ${{ needs.deploy-vpc-stack.outputs.live_color_testnet }}
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}
      VECHAINCI_SSH_PRIVATE_KEYS: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

  publish-release:
    name: Publish draft release for switched version
    runs-on: ubuntu-latest
    needs: [deploy-vpc-stack, apply-vpc-stack]
    # Only try to publish when both networks were switched together. For
    # per-network switches, the draft may still be valid for the network
    # that didn't flip, so leave it alone. Version-mismatch and
    # missing-draft cases are handled inside the job as no-ops.
    if: >-
      ${{ needs.apply-vpc-stack.result == 'success'
      && github.event.inputs.network == 'all' }}
    permissions:
      id-token: write
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Read live version tags from ECS
        id: versions
        env:
          MAIN_LIVE: ${{ needs.deploy-vpc-stack.outputs.live_color_mainnet }}
          TEST_LIVE: ${{ needs.deploy-vpc-stack.outputs.live_color_testnet }}
        run: |
          set -euo pipefail
          read_tag() {
            aws ecs describe-task-definition --task-definition "$1" \
              --query "taskDefinition.containerDefinitions[0].image" \
              --output text 2>/dev/null \
              | awk -F: 'NF>1 {print $NF}'
          }
          mainnet_tag=$(read_tag "${MAIN_LIVE}-veworld-main-api" || true)
          testnet_tag=$(read_tag "${TEST_LIVE}-veworld-test-api" || true)
          echo "mainnet_tag=$mainnet_tag" >> "$GITHUB_OUTPUT"
          echo "testnet_tag=$testnet_tag" >> "$GITHUB_OUTPUT"
          echo "Live mainnet tag: ${mainnet_tag:-<none>}"
          echo "Live testnet tag: ${testnet_tag:-<none>}"

      - name: Publish matching draft release
        env:
          MAINNET_TAG: ${{ steps.versions.outputs.mainnet_tag }}
          TESTNET_TAG: ${{ steps.versions.outputs.testnet_tag }}
        run: |
          set -euo pipefail
          if [ -z "$MAINNET_TAG" ] || [ -z "$TESTNET_TAG" ]; then
            echo "::notice::Could not resolve live version tags (mainnet='$MAINNET_TAG' testnet='$TESTNET_TAG') — skipping release publish."
            exit 0
          fi
          if [ "$MAINNET_TAG" != "$TESTNET_TAG" ]; then
            echo "::notice::Live mainnet ($MAINNET_TAG) and testnet ($TESTNET_TAG) versions differ — no unambiguous release to publish."
            exit 0
          fi
          state=$(gh release view "$MAINNET_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
          case "$state" in
            true)
              echo "Publishing draft release $MAINNET_TAG as latest"
              gh release edit "$MAINNET_TAG" --draft=false --latest
              ;;
            false)
              echo "::notice::Release $MAINNET_TAG is already published — nothing to do."
              ;;
            *)
              echo "::notice::No draft release found for $MAINNET_TAG — nothing to publish."
              ;;
          esac
