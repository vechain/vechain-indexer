name: Switch Live Environment

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Switch network?"
        required: true
        type: choice
        options:
          - all
          - mainnet
          - testnet

permissions:
  id-token: write  # This is required for requesting the JWT
  contents: read   # This is required for actions/checkout

jobs:

  identify-live-color:
    name: Identify live color
    uses: ./.github/workflows/identify-live-color.yml
    with:
      dns_record_mainnet_name: mainnet.live.prod.veworld.vechain.org.
      dns_record_testnet_name: testnet.live.prod.veworld.vechain.org.
      hosted_zone_id: Z08093993BM56HB3DD4U4
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  deploy-vpc-stack:
    name: Deploy VPC stack & switch DNS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/vpc

    needs: [identify-live-color]
    env:
      environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write chosen network to github output
        run: |
          echo "Switching DNS for network: ${{ github.event.inputs.network }}"
          if [ "${{ github.event.inputs.network }}" == "mainnet" ]; then
            echo "Current mainnet live colour: ${{ needs.identify-live-color.outputs.mainnet_live_color }}"
            echo "New mainnet live colour: ${{ needs.identify-live-color.outputs.mainnet_dead_color }}"
          elif [ "${{ github.event.inputs.network }}" == "testnet" ]; then
            echo "Current testnet live colour: ${{ needs.identify-live-color.outputs.testnet_live_color }}"
            echo "New testnet live colour: ${{ needs.identify-live-color.outputs.testnet_dead_color }}"
          else
            echo "Current mainnet live colour: ${{ needs.identify-live-color.outputs.mainnet_live_color }}"
            echo "New mainnet live colour: ${{ needs.identify-live-color.outputs.mainnet_dead_color }}"
            echo "Current testnet live colour: ${{ needs.identify-live-color.outputs.testnet_live_color }}"
            echo "New testnet live colour: ${{ needs.identify-live-color.outputs.testnet_dead_color }}"
          fi

      - name: Determine colours to pass to Terraform
        id: set-colours
        run: |
          case "${{ github.event.inputs.network }}" in
            mainnet)
              echo "live_color_mainnet=${{ needs.identify-live-color.outputs.mainnet_dead_color }}" >> $GITHUB_OUTPUT
              echo "live_color_testnet=${{ needs.identify-live-color.outputs.testnet_live_color }}" >> $GITHUB_OUTPUT
              echo "backend_colour=${{ needs.identify-live-color.outputs.mainnet_dead_color }}" >> $GITHUB_OUTPUT
              ;;
            testnet)
              echo "live_color_mainnet=${{ needs.identify-live-color.outputs.mainnet_live_color }}" >> $GITHUB_OUTPUT
              echo "live_color_testnet=${{ needs.identify-live-color.outputs.testnet_dead_color }}" >> $GITHUB_OUTPUT
              echo "backend_colour=${{ needs.identify-live-color.outputs.testnet_dead_color }}" >> $GITHUB_OUTPUT
              ;;
            all)
              echo "live_color_mainnet=${{ needs.identify-live-color.outputs.mainnet_dead_color }}" >> $GITHUB_OUTPUT
              echo "live_color_testnet=${{ needs.identify-live-color.outputs.testnet_dead_color }}" >> $GITHUB_OUTPUT
              if [ "${{ needs.identify-live-color.outputs.mainnet_dead_color }}" == "${{ needs.identify-live-color.outputs.testnet_dead_color }}" ]; then
                echo "backend_colour=${{ needs.identify-live-color.outputs.mainnet_dead_color }}" >> $GITHUB_OUTPUT
              else
                echo "backend_colour=${{ needs.identify-live-color.outputs.mainnet_dead_color }}" >> $GITHUB_OUTPUT
                echo "::warning::Mainnet and Testnet are moving to different colours. Terraform state will be initialised to ${ { needs.identify-live-color.outputs.mainnet_dead_color }}. Ensure this is acceptable." >> $GITHUB_OUTPUT
              fi
              ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.PROD_AWS_ACC_ROLE }}

      - name: Check Dead ENV is Ready
        id: check-dead-env-is-ready
        run: |
          if [ "${{ github.event.inputs.network }}" == "testnet" ]; then
              cluster_services=$(aws ecs list-services --cluster ${{ needs.identify-live-color.outputs.testnet_dead_color }}-veworld-cluster --query 'length(serviceArns)' --output text)
              if (( $cluster_services > 3 )); then
                echo "env_ready=true" >> $GITHUB_OUTPUT
                echo "The ${{ needs.identify-live-color.outputs.testnet_dead_color }} cluster is ready, proceeding with deployment"
              else
                echo "env_ready=false" >> $GITHUB_OUTPUT
                echo "The ${{ needs.identify-live-color.outputs.testnet_dead_color }} cluster has no services running. Please ensure the environment is ready for traffic"
                exit 0
              fi
          elif [ "${{ github.event.inputs.network }}" == "mainnet" ]; then
              cluster_services=$(aws ecs list-services --cluster ${{ needs.identify-live-color.outputs.mainnet_dead_color }}-veworld-cluster --query 'length(serviceArns)' --output text)
              if (( $cluster_services > 3 )); then
                echo "env_ready=true" >> $GITHUB_OUTPUT
                echo "The ${{ needs.identify-live-color.outputs.mainnet_dead_color }} cluster is ready, proceeding with deployment"
              else
                echo "env_ready=false" >> $GITHUB_OUTPUT
                echo "The ${{ needs.identify-live-color.outputs.mainnet_dead_color }} cluster has no services running. Please ensure the environment is ready for traffic"
                exit 0
              fi
          else
              cluster_services=$(aws ecs list-services --cluster ${{ needs.identify-live-color.outputs.mainnet_dead_color }}-veworld-cluster --query 'length(serviceArns)' --output text)
              if (( $cluster_services > 3 )); then
                echo "env_ready=true" >> $GITHUB_OUTPUT
                echo "The ${{ needs.identify-live-color.outputs.mainnet_dead_color }} cluster is ready, proceeding with deployment"
              else
                echo "env_ready=false" >> $GITHUB_OUTPUT
                echo "The ${{ needs.identify-live-color.outputs.mainnet_dead_color }} cluster has no services running. Please ensure the environment is ready for traffic"
                exit 0
              fi
              cluster_services=$(aws ecs list-services --cluster ${{ needs.identify-live-color.outputs.testnet_dead_color }}-veworld-cluster --query 'length(serviceArns)' --output text)
              if (( $cluster_services > 3 )); then
                echo "env_ready=true" >> $GITHUB_OUTPUT
                echo "The ${{ needs.identify-live-color.outputs.testnet_dead_color }} cluster is ready, proceeding with deployment"
              else
                echo "env_ready=false" >> $GITHUB_OUTPUT
                echo "The ${{ needs.identify-live-color.outputs.testnet_dead_color }} cluster has no services running. Please ensure the environment is ready for traffic"
                exit 0
              fi
          fi

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.3
          terraform_wrapper: true

      - name: Terraform Initialize
        id: init
        run: terraform init -reconfigure -backend-config="../api/environments/${{ steps.set-colours.outputs.backend_colour }}.config"

      - name: Terraform Workspace
        id: workspace
        run: terraform workspace select $(echo ${{ env.environment }} | awk -F- '{print $1}')

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        if: steps.check-dead-env-is-ready.outputs.env_ready == 'true'
        run: terraform plan -out "apply.plan" --var=live_color_mainnet=${{ steps.set-colours.outputs.live_color_mainnet }} --var=live_color_testnet=${{ steps.set-colours.outputs.live_color_testnet }}

      - name: Terraform Apply
        if: steps.check-dead-env-is-ready.outputs.env_ready == 'true'
        id: apply
        run: terraform apply "apply.plan"
