name: Validate Token Registry

on:
  pull_request:

permissions:
  contents: read

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Refresh bundled token registry
        run: bash packages/api/scripts/refresh_token_registry.sh

      - name: Verify token registry parsing tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :packages:api:test --tests "org.vechain.indexer.transfer.OfficialTokenServiceTest"

      - name: Check for registry drift
        run: |
          if git diff --quiet -- packages/api/src/main/resources/token-registry/main.json packages/api/src/main/resources/token-registry/test.json; then
            exit 0
          fi

          echo "::error::Bundled token registry files are out of date."
          echo "Run the following command locally and commit the results:"
          echo "  bash packages/api/scripts/refresh_token_registry.sh"
          git diff -- packages/api/src/main/resources/token-registry/main.json packages/api/src/main/resources/token-registry/test.json
          exit 1
