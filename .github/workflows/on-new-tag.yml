name: On Release

on:
  release:
    types: [published]

jobs:
  test-gradle:
    uses: ./.github/workflows/test-gradle.yml

  publish-images-to-ecr:
    uses: ./.github/workflows/publish-images.yml
    needs: test-gradle
    with:
      imageTag: ${{ github.ref_name }}
      latestTag: prod-latest
      env: Prod
    secrets: inherit
