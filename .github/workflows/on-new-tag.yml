name: On Release

on:
  release:
    types: [ published ]

jobs:
  test-gradle:
    uses: ./.github/workflows/test-gradle.yml
  publish-images-to-ecr:
    uses: ./.github/workflows/publish-images.yml
    needs: test-gradle
    with:
      imageTag: ${{ github.ref_name }}
      latestTag: prod-latest
      env: Prod
    secrets: inherit
  deploy-to-ecs:
    uses: ./.github/workflows/deploy-to-ecs.yml
    needs: [ publish-images-to-ecr ]
    secrets: inherit
    with:
      indexerImageTag: ${{ github.ref_name }}
      apiImageTag: ${{ github.ref_name }}
      environment: prod
      dbSetupTag: ${{ github.ref_name }}
