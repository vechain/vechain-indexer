name: Build Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.head_ref || github.ref_name }}-docker-api
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [ api, indexer, k6 ]
    steps:
      - uses: actions/checkout@v3

      - name: Build the Docker image
        run: make build-${{ matrix.package }}