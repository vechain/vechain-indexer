name: Destroy Dead Environment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "How to tear down the dead environment. `pause` preserves Atlas clusters (and their backups) by pausing them; `destroy` removes everything."
        required: true
        type: choice
        options:
          - pause
          - destroy
        default: pause

# Prevent parallel deploy/destroy of the node cluster infrastructure in the same workspace
concurrency: 1

# Required for authentication through GitHub OIDC
permissions:
  id-token: write  # This is required for requesting the JWT
  contents: read   # This is required for actions/checkout

jobs:
  identify-live-color:
    name: "Identify live and dead colors"
    uses: ./.github/workflows/identify-live-color.yml
    with:
      dns_record_mainnet_name: mainnet.live.prod.veworld.vechain.org.
      dns_record_testnet_name: testnet.live.prod.veworld.vechain.org.
      hosted_zone_id: Z08093993BM56HB3DD4U4
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}

  pause-atlas:
    name: Pause Dead Prod Atlas Clusters
    if: inputs.mode == 'pause'
    needs: [identify-live-color]
    runs-on: ubuntu-latest
    environment: prod
    env:
      dead_color: ${{ needs.identify-live-color.outputs.mainnet_dead_color }}
    steps:
      - name: Check mainnet and testnet on same colour
        run: |
          if [ "${{ needs.identify-live-color.outputs.mainnet_dead_color }}" != "${{ needs.identify-live-color.outputs.testnet_dead_color }}" ]; then
            echo "Mainnet and Testnet colours are not the same, aborting."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Atlas CLI
        env:
          ATLAS_CLI_VERSION: "1.56.0"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch="x86_64" ;;
            aarch64) arch="arm64" ;;
            *) echo "Unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          tarball="mongodb-atlas-cli_${ATLAS_CLI_VERSION}_linux_${arch}.tar.gz"
          url="https://github.com/mongodb/mongodb-atlas-cli/releases/download/atlascli/v${ATLAS_CLI_VERSION}/${tarball}"
          curl --fail --silent --show-error --location "${url}" -o "/tmp/${tarball}"
          tar -xzf "/tmp/${tarball}" -C /tmp
          sudo install -m 0755 "/tmp/mongodb-atlas-cli_${ATLAS_CLI_VERSION}_linux_${arch}/bin/atlas" /usr/local/bin/atlas
          atlas --version

      - name: Pause dead-prod Atlas clusters
        env:
          ACTION: pause
          MONGODB_ATLAS_PUBLIC_API_KEY: ${{ secrets.MONGO_PUBLIC_KEY }}
          MONGODB_ATLAS_PRIVATE_API_KEY: ${{ secrets.MONGO_PRIVATE_KEY }}
          MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGO_ORG_ID }}
          MONGODB_ATLAS_PROJECT_ID: ${{ secrets.MONGO_PROJECT_ID }}
          MAIN_CLUSTER: ${{ env.dead_color }}-Mainnet
          TEST_CLUSTER: ${{ env.dead_color }}-Testnet
        run: bash .github/workflows/scripts/set_dead_prod_atlas_state.sh

  destroy-lingering-resources:
    name: Destroy Lingering Resources
    needs: [identify-live-color, pause-atlas]
    if: always() && (needs.pause-atlas.result == 'success' || needs.pause-atlas.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      dead_color: ${{ needs.identify-live-color.outputs.mainnet_dead_color }}
    steps:
      - name: Check mainnet and testnet on same colour
        id: check-net-color
        run: |
          if [ "${{ needs.identify-live-color.outputs.mainnet_dead_color }}" != "${{ needs.identify-live-color.outputs.testnet_dead_color }}" ]; then
            echo "Mainnet and Testnet colours are not the same, aborting destruction."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
            aws-region: eu-west-1
            role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Destroy Lingering Secrets
        run: |
          echo "Deleting lingering secrets..."
          aws secretsmanager delete-secret --secret-id /${{ env.dead_color }}/veworld/mongo_api_password --force-delete-without-recovery || true
          aws secretsmanager delete-secret --secret-id /${{ env.dead_color }}/veworld/mongo_indexer_password --force-delete-without-recovery || true

      - name: "Destroy LB Logs S3 Buckets"
        run: |
          echo "Deleting LB logs S3 buckets..."
          buckets=("${{ env.dead_color }}-veworld-main-api-ecs-lb-bucket" "${{ env.dead_color }}-veworld-test-api-ecs-lb-bucket")
          for bucket in "${buckets[@]}"; do
            if aws s3 ls "s3://${bucket}" 2>&1 | grep -q 'NoSuchBucket'; then
              echo "Bucket $bucket not found, skipping."
              aws s3api delete-bucket-lifecycle --bucket "$bucket" || true
            else
              echo "Bucket $bucket found, deleting..."
              aws s3api delete-bucket-lifecycle --bucket "$bucket" || true
              aws s3 rb "s3://$bucket" --force || true
            fi
          done

      - name: "Destroy Load Balancers"
        run: |
          echo "Fetching load balancer ARNs..."
          dead_main_api_lb_arn=$(aws elbv2 describe-load-balancers --query "LoadBalancers[?contains(LoadBalancerName, '${{ env.dead_color }}-main-api-veworld-alb')].LoadBalancerArn" --output text) || true
          dead_test_api_lb_arn=$(aws elbv2 describe-load-balancers --query "LoadBalancers[?contains(LoadBalancerName, '${{ env.dead_color }}-test-api-veworld-alb')].LoadBalancerArn" --output text) || true

          if [ ! -z "$dead_main_api_lb_arn" ]; then
            echo "Disabling deletion protection for main API load balancer..."
            aws elbv2 modify-load-balancer-attributes --load-balancer-arn $dead_main_api_lb_arn --attributes Key=deletion_protection.enabled,Value=false || true
            echo "Destroying main API load balancer..."
            aws elbv2 delete-load-balancer --load-balancer-arn $dead_main_api_lb_arn || true
          fi

          if [ ! -z "$dead_test_api_lb_arn" ]; then
            echo "Disabling deletion protection for test API load balancer..."
            aws elbv2 modify-load-balancer-attributes --load-balancer-arn $dead_test_api_lb_arn --attributes Key=deletion_protection.enabled,Value=false || true
            echo "Destroying test API load balancer..."
            aws elbv2 delete-load-balancer --load-balancer-arn $dead_test_api_lb_arn || true
          fi

  destroy-environment:
    name: "Destroy Terraform Infrastructure"
    runs-on: ubuntu-latest
    needs: [identify-live-color, destroy-lingering-resources]
    env:
      dead_color: ${{ needs.identify-live-color.outputs.mainnet_dead_color }}

    defaults:
      run:
        working-directory: terraform/api

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Show dead color and mode
        run: echo "destroying dead environment - ${{ env.dead_color }} (mode=${{ inputs.mode }})"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
            aws-region: eu-west-1
            role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      # Required for Terraform to source modules from other vechain repositories
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: true

      - name: Terraform initialize
        id: init
        run: terraform init -backend-config="environments/${{ env.dead_color }}.config" -reconfigure

      - name: Terraform workspace
        id: workspace
        run: terraform workspace select ${{ env.dead_color }}

      - name: Clear s3 lifecycle configs via cli
        run: |
          aws s3api delete-bucket-lifecycle --bucket "${{ env.dead_color }}-veworld-main-api-ecs-lb-bucket" || true
          aws s3api delete-bucket-lifecycle --bucket "${{ env.dead_color }}-veworld-test-api-ecs-lb-bucket" || true

      - name: Remove S3 lifecycle configs from Terraform state
        run: |
          echo "Removing S3 lifecycle configurations from Terraform state..."
          terraform state rm 'module.ecs-lb-service-api["main"].aws_s3_bucket_lifecycle_configuration.lb_logs' || true
          terraform state rm 'module.ecs-lb-service-api["test"].aws_s3_bucket_lifecycle_configuration.lb_logs' || true

      - name: Remove Atlas resources from Terraform state (pause mode)
        if: inputs.mode == 'pause'
        run: |
          for resource in \
            'mongodbatlas_advanced_cluster.main_net[0]' \
            'mongodbatlas_advanced_cluster.test_net[0]' \
            'mongodbatlas_database_user.api_db_user[0]' \
            'mongodbatlas_database_user.indexer_db_user[0]' \
            'mongodbatlas_cloud_backup_schedule.main_net[0]' \
            'mongodbatlas_cloud_backup_schedule.test_net[0]'; do
            terraform state rm "$resource" || true
          done

      - name: Show resources to be destroyed
        run: terraform state list

      - name: Plan terraform destroy
        id: plan
        run: terraform plan -out "destroy.plan" -destroy

      - name: Terraform destroy
        id: destroy
        run: terraform apply "destroy.plan"
