name: Cluster Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "The environment to destroy"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod-blue
          - prod-green

# Prevent parallel deploy/destroy of the node cluster infrastructure in the same workspace
concurrency: 1

# Required for authentication through GitHub OIDC
permissions:
  id-token: write  # This is required for requesting the JWT
  contents: read   # This is required for actions/checkout

jobs:
  identify-live-color:
    name: "Identify live and dead colors"
    uses: ./.github/workflows/identify-live-color.yml
    with:
      dns_record_mainnet_name: mainnet.live.prod.veworld.vechain.org.
      dns_record_testnet_name: testnet.live.prod.veworld.vechain.org.
      hosted_zone_id: Z08093993BM56HB3DD4U4
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  check-selected-color:
    name: "Check color selected for destruction is not live"
    runs-on: ubuntu-latest
    needs: [identify-live-color]
    steps:
      - name: Check selected color is not live
        run: |
          if [ "${{ inputs.environment }}" == "${{ needs.identify-live-color.outputs.mainnet_live_color }}" ]; then
            echo "Selected color is live, aborting destruction."
            exit 1
          fi

  destroy-lingering-resources:
    name: Destroy Lingering Resources
    needs: [identify-live-color, check-selected-color]
    runs-on: ubuntu-latest
    env:
      dead_color: ${{ needs.identify-live-color.outputs.mainnet_dead_color }}
      account: ${{ startsWith(inputs.environment, 'prod-') && 'prod' || 'dev' }}
    steps:
      - name: Determine AWS account ID and role
        id: account
        run: |
            if [ "${{ env.account }}" == "prod" ]; then
              echo "role_arn=${{ secrets.PROD_AWS_ACC_ROLE }}" >> $GITHUB_OUTPUT
            else
              echo "role_arn=${{ secrets.DEV_AWS_ACC_ROLE }}" >> $GITHUB_OUTPUT
            fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ steps.account.outputs.role_arn }}

      - name: Destroy Lingering Secrets
        run: |
          echo "Deleting lingering secrets..."
          aws secretsmanager delete-secret --secret-id /${{ env.dead_color }}/veworld/mongo_api_password --force-delete-without-recovery || true
          aws secretsmanager delete-secret --secret-id /${{ env.dead_color }}/veworld/mongo_indexer_password --force-delete-without-recovery || true

      - name: "Destroy LB Logs S3 Buckets"
        run: |
          echo "Deleting LB logs S3 buckets..."
          aws s3 rb s3://${{ env.dead_color }}-veworld-main-api-ecs-lb-bucket --force || true
          aws s3 rb s3://${{ env.dead_color }}-veworld-test-api-ecs-lb-bucket --force || true

      - name: "Destroy Load Balancers"
        run: |
          echo "Fetching load balancer ARNs..."
          dead_main_lb_arn=$(aws elbv2 describe-load-balancers --query "LoadBalancers[?contains(LoadBalancerName, '${{ env.dead_color }}-main-api-veworld-alb')].LoadBalancerArn" --output text) || true
          dead_test_lb_arn=$(aws elbv2 describe-load-balancers --query "LoadBalancers[?contains(LoadBalancerName, '${{ env.dead_color }}-test-api-veworld-alb')].LoadBalancerArn" --output text) || true

          if [ ! -z "$dead_main_lb_arn" ]; then
            echo "Disabling deletion protection for main load balancer..."
            aws elbv2 modify-load-balancer-attributes --load-balancer-arn $dead_main_lb_arn --attributes Key=deletion_protection.enabled,Value=false || true
            echo "Destroying main load balancer..."
            aws elbv2 delete-load-balancer --load-balancer-arn $dead_main_lb_arn || true
          fi

          if [ ! -z "$dead_test_lb_arn" ]; then
            echo "Disabling deletion protection for test load balancer..."
            aws elbv2 modify-load-balancer-attributes --load-balancer-arn $dead_test_lb_arn --attributes Key=deletion_protection.enabled,Value=false || true
            echo "Destroying test load balancer..."
            aws elbv2 delete-load-balancer --load-balancer-arn $dead_test_lb_arn || true
          fi

  destroy-environment:
    name: "Destroy ${{ inputs.environment }} Infrastructure"
    runs-on: ubuntu-latest
    needs: [identify-live-color, check-selected-color, destroy-lingering-resources]
    if: ${{ inputs.environment }} == ${{ needs.identify-live-color.outputs.mainnet_dead_color }}
    defaults:
      run:
        working-directory: terraform/api

    env:
      account: ${{ startsWith(inputs.environment, 'prod-') && 'prod' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Determine AWS account ID and role
        id: account
        run: |
            if [ "${{ env.account }}" == "prod" ]; then
              echo "role_arn=${{ secrets.PROD_AWS_ACC_ROLE }}" >> $GITHUB_OUTPUT
            else
              echo "role_arn=${{ secrets.DEV_AWS_ACC_ROLE }}" >> $GITHUB_OUTPUT
            fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ steps.account.outputs.role_arn }}

      # Required for Terraform to source modules from other vechain repositories
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

      - name: Point backend to correct environment
        id: specify-backend
        run: |
          sed -i "s/{{{ENV}}}/${{ env.account }}/g" provider.tf
        continue-on-error: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.3
          terraform_wrapper: true

      - name: Terraform initialize
        id: init
        run: terraform init -backend-config="environments/${{ inputs.environment }}.config" -reconfigure

      - name: Terraform workspace
        id: workspace
        run: terraform workspace select ${{ inputs.environment }}

      - name: Show s3 lifecycle config from state
        run: terraform state list | grep aws_s3_bucket_lifecycle_configuration

      - name: Delete s3 lifecycle config from state file if found
        run: |
          if terraform state list | grep -q aws_s3_bucket_lifecycle_configuration; then
            echo "Deleting s3 lifecycle configuration from state file..."
            terraform state rm 'module.ecs-lb-service-api["main"].aws_s3_bucket_lifecycle_configuration.lb_logs'
            terraform state rm 'module.ecs-lb-service-api["test"].aws_s3_bucket_lifecycle_configuration.lb_logs'
          else
            echo "No s3 lifecycle configuration found in state file."
          fi
      - name: Show resources to be destroyed
        run: terraform state list

      - name: Plan terraform destroy
        id: plan
        run: terraform plan -out "destroy.plan" -destroy

      - name: Terraform destroy
        id: destroy
        run: terraform apply "destroy.plan"
