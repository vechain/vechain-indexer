name: Build & Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      workingDirectory:
        description: Working directory for the build context
        required: true
        type: string
        default: ./
      environment:
        description: Environment
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      version:
        description: Version tag (only relevant for dev. For prod, semver git ref tag is used)
        required: false
        type: string
        default: v.0.0.0-dev

# Required for authentication through GitHub OIDC
permissions:
  id-token: write  # This is required for requesting the JWT
  contents: read   # This is required for actions/checkout
  packages: read   # This is required for pulling GitHub Packages dependencies

env:
  latestTag: 'latest'
  versionTag: ${{ (github.event_name == 'push' || inputs.environment == 'prod') && github.ref_name || inputs.version }}
  commitHash: ${{ github.sha }}
  workingDirectory: './'
  projectName: 'veworld'
  imagePlatform: 'linux/arm64'
  environment: ${{ inputs.environment || 'prod' }}

jobs:
  build-and-publish:
    runs-on: docker-build-arm64
    strategy:
      matrix:
        packageName: ["api", "indexer"]
    defaults:
      run:
        working-directory: ${{ env.workingDirectory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ env.environment == 'dev' && secrets.DEV_AWS_ACC_ROLE || secrets.AWS_ACC_ROLE }}

      - name: Login To Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2.1.4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build images and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          file: Dockerfile
          platforms: ${{ env.imagePlatform }}
          build-args: |
            PACKAGE_NAME=${{ matrix.packageName }}
            APP_VERSION=${{ env.versionTag }}
          push: true
          context: ${{ env.workingDirectory }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.packageName }}-ecr
          cache-to: type=gha,mode=max,scope=${{ matrix.packageName }}-ecr
          secrets: |
            "gradle_props=gpr.user=${{ github.actor }}
            gpr.key=${{ secrets.GITHUB_TOKEN }}"
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.projectName }}/${{ matrix.packageName }}:${{ env.versionTag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.projectName }}/${{ matrix.packageName }}:${{ env.latestTag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.projectName }}/${{ matrix.packageName }}:${{ env.commitHash }}

      - name: Scan Docker image
        id: docker-scan
        uses: alexjurkiewicz/ecr-scan-image@a17ece3facc44123372a2521011a557c18624d5a # v3.0.0
        with:
          repository: ${{env.projectName}}/${{ matrix.packageName }}
          tag: ${{ env.versionTag }}
          fail_threshold: medium

      - name: On Scan Failure
        if: failure() && steps.docker-scan.outcome == 'failure'
        run: |
          aws ecr batch-delete-image \
            --repository-name ${{env.projectName}}/${{ matrix.packageName }} \
            --image-ids versionTag=${{ env.versionTag }} versionTag=${{ env.latestTag }}
