name: Build & Publish Docker Image

on:
  push:
    tags:
      - v.*
  workflow_dispatch:
    inputs:
      latestTag:
        description: Tag to identify most recently built image
        required: true
        type: string
        default: latest
      workingDirectory:
        description: Working directory for the build context
        required: true
        type: string
        default: ./
      projectName:
        description: Name of the project
        required: true
        type: string
        default: veworld
      imagePlatform:
        description: Platform for the Docker image
        required: false
        type: string
        default: linux/arm64

# Required for authentication through GitHub OIDC
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

env:
  latestTag: ${{ inputs.latestTag || 'latest' }}
  versionTag: ${{ github.ref_name }}
  commitHash: ${{ github.sha }}
  workingDirectory: ${{ inputs.workingDirectory || './' }}
  projectName: ${{ inputs.projectName || 'veworld' }}
  imagePlatform: ${{ inputs.imagePlatform || 'linux/arm64' }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        packageName: ["api", "indexer"]
    defaults:
      run:
        working-directory: ${{ env.workingDirectory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.PROD_AWS_ACC_ROLE }}

      - name: Login To Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build images and push
        uses: docker/build-push-action@v4
        with:
          file: Dockerfile
          platforms: ${{ env.imagePlatform }}
          build-args: "PACKAGE_NAME=${{ matrix.packageName }}"
          push: true
          context: ${{ env.workingDirectory }}
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.projectName }}/${{ matrix.packageName }}:${{ env.versionTag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.projectName }}/${{ matrix.packageName }}:${{ env.latestTag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.projectName }}/${{ matrix.packageName }}:${{ env.commitHash }}

      - name: Scan Docker image
        id: docker-scan
        uses: alexjurkiewicz/ecr-scan-image@v1.7.1
        with:
          repository: ${{env.projectName}}/${{ matrix.packageName }}
          tag: ${{ env.versionTag }}
          fail_threshold: medium

      - name: On Scan Failure
        if: failure() && steps.docker-scan.outcome == 'failure'
        run: |
          aws ecr batch-delete-image \
            --repository-name ${{env.projectName}}/${{ matrix.packageName }} \
            --image-ids versionTag=${{ env.versionTag }} versionTag=${{ env.latestTag }}
