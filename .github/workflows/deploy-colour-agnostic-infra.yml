name: Deploy Colour Agnostic Infra

on:
  workflow_call:
    inputs:
      environment:
        description: Terraform workspace/environment to target
        required: true
        type: string
      live_color_mainnet:
        description: Desired live colour for mainnet
        required: true
        type: string
      live_color_testnet:
        description: Desired live colour for testnet
        required: true
        type: string
      scope:
        description: "How much of the stack to apply: full, records, or dead-records"
        required: false
        type: string
        default: full
    secrets:
      AWS_ACC_ROLE:
        description: "AWS IAM role ARN for OIDC authentication"
        required: true
      VECHAINCI_SSH_PRIVATE_KEYS:
        description: "SSH key for accessing vechain Terraform modules"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy-vpc-route53:
    name: Deploy Terraform VPC Route53
    runs-on: ubuntu-latest

    # All callers funnel through this job, and queuing here re-resolves the
    # colours: identify-live-color runs inside the queued run, not before it.
    concurrency:
      group: terraform-vpc-apply
      cancel-in-progress: false

    env:
      TERRAFORM_ENV: ${{ inputs.environment }}
      LIVE_COLOR_MAINNET: ${{ inputs.live_color_mainnet }}
      LIVE_COLOR_TESTNET: ${{ inputs.live_color_testnet }}
      SCOPE: ${{ inputs.scope }}

    defaults:
      run:
        working-directory: terraform/vpc

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      # Required for Terraform to source modules from other vechain repositories
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: true

      - name: Terraform Initialize
        run: terraform init -reconfigure -backend-config="environments/${{ env.TERRAFORM_ENV }}.config"

      - name: Terraform Workspace
        run: terraform workspace select ${{ env.TERRAFORM_ENV }}

      - name: Terraform Plan
        run: |
          case "$SCOPE" in
            full)
              targets=()
              ;;
            records)
              targets=(-target=aws_route53_record.mainnet_live \
                       -target=aws_route53_record.testnet_live \
                       -target=aws_route53_record.mainnet_dead \
                       -target=aws_route53_record.testnet_dead)
              ;;
            dead-records)
              targets=(-target=aws_route53_record.mainnet_dead \
                       -target=aws_route53_record.testnet_dead)
              ;;
            *)
              echo "::error::Unknown scope '$SCOPE' (expected full, records, or dead-records)"
              exit 1
              ;;
          esac
          echo "Applying scope: $SCOPE"
          terraform plan -out "apply.plan" \
            --var=live_color_mainnet="$LIVE_COLOR_MAINNET" \
            --var=live_color_testnet="$LIVE_COLOR_TESTNET" \
            "${targets[@]}"

      - name: Terraform Apply
        run: terraform apply "apply.plan"
