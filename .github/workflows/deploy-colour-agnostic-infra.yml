name: Deploy Colour Agnostic Infra

on:
  workflow_call:
    inputs:
      environment:
        description: Terraform workspace/environment to target
        required: true
        type: string
      live_color_mainnet:
        description: Desired live colour for mainnet
        required: true
        type: string
      live_color_testnet:
        description: Desired live colour for testnet
        required: true
        type: string
      dead_records_only:
        description: Only target dead Route53 records in teraform apply
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-vpc-route53:
    name: Deploy Terraform VPC Route53
    runs-on: ubuntu-latest
    env:
      TERRAFORM_ENV: ${{ inputs.environment }}
      LIVE_COLOR_MAINNET: ${{ inputs.live_color_mainnet }}
      LIVE_COLOR_TESTNET: ${{ inputs.live_color_testnet }}
      DEAD_RECORDS_ONLY: ${{ inputs.dead_records_only }}

    defaults:
      run:
        working-directory: terraform/vpc

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      # Required for Terraform to source modules from other vechain repositories
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@d4b9b8ff72958532804b70bbe600ad43b36d5f2e # v0.8.0
        with:
          ssh-private-key: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2.0.3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: true

      - name: Terraform Initialize
        run: terraform init -reconfigure -backend-config="environments/${{ env.TERRAFORM_ENV }}.config"

      - name: Terraform Workspace
        run: terraform workspace select ${{ env.TERRAFORM_ENV }}

      - name: Terraform Plan
        run: |
          if [ "${{ env.DEAD_RECORDS_ONLY }}" == "false" ]; then
            terraform plan -out "apply.plan" --var=live_color_mainnet=${{ env.LIVE_COLOR_MAINNET }} --var=live_color_testnet=${{ env.LIVE_COLOR_TESTNET }}
          else
            echo "Only targeting dead Route53 records in teraform apply"
            terraform plan -out "apply.plan" --var=live_color_mainnet=${{ env.LIVE_COLOR_MAINNET }} --var=live_color_testnet=${{ env.LIVE_COLOR_TESTNET }} -target=aws_route53_record.mainnet_dead -target=aws_route53_record.testnet_dead
          fi

      - name: Terraform Apply
        run: terraform apply "apply.plan"
