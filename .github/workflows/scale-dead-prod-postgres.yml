name: Scale Dead Prod Postgres

on:
  workflow_dispatch:
    inputs:
      action:
        description: "up: resize and keep through deploys; down: back to the env file class"
        required: true
        type: choice
        options:
          - up
          - down
      networks:
        description: "Which dead-colour instances to resize"
        required: true
        type: choice
        default: both
        options:
          - both
          - main
          - test
      main_instance_class:
        description: "Mainnet class for up"
        required: false
        type: string
        default: db.r6g.2xlarge
      test_instance_class:
        description: "Testnet class for up"
        required: false
        type: string
        default: db.r6g.large

# Shares deploy's group: its terraform/api apply reads the override this writes.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  identify-live-color:
    name: Identify live and dead colors
    uses: ./.github/workflows/identify-live-color.yml
    with:
      dns_record_mainnet_name: mainnet.live.prod.veworld.vechain.org.
      dns_record_testnet_name: testnet.live.prod.veworld.vechain.org.
      hosted_zone_id: Z08093993BM56HB3DD4U4
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}

  resolve-context:
    name: Resolve Dead Prod Context
    runs-on: ubuntu-latest
    needs: [identify-live-color]
    environment: prod
    outputs:
      dead_color: ${{ steps.context.outputs.target_color }}
      ecs_cluster: ${{ steps.context.outputs.ecs_cluster }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve dead-prod color
        id: context
        env:
          REQUIRE_CONFIRMATION: "false"
          MAINNET_LIVE_COLOR: ${{ needs.identify-live-color.outputs.mainnet_live_color }}
          MAINNET_DEAD_COLOR: ${{ needs.identify-live-color.outputs.mainnet_dead_color }}
          TESTNET_LIVE_COLOR: ${{ needs.identify-live-color.outputs.testnet_live_color }}
          TESTNET_DEAD_COLOR: ${{ needs.identify-live-color.outputs.testnet_dead_color }}
        run: bash .github/workflows/scripts/resolve_dead_prod_context.sh

  scale:
    name: Resize Dead Prod Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [resolve-context]
    # Holds switch-live-dns's lock, so the colour cannot be promoted between the recheck and the resize.
    concurrency:
      group: switch-live-dns
      cancel-in-progress: false
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Confirm the colour is still dead
        env:
          DEAD_COLOR: ${{ needs.resolve-context.outputs.dead_color }}
        run: |
          for name in mainnet.live.prod.veworld.vechain.org. testnet.live.prod.veworld.vechain.org.; do
            value="$(aws route53 list-resource-record-sets --hosted-zone-id Z08093993BM56HB3DD4U4 \
              --query "ResourceRecordSets[?Name == '${name}'].ResourceRecords[].Value" --output text)"
            if [[ -z "${value}" || "${value}" == "${DEAD_COLOR}"* ]]; then
              echo "::error::${name} points at '${value}'; ${DEAD_COLOR} is no longer dead."
              exit 1
            fi
          done

      - name: Check which instances restart
        id: plan
        env:
          PLAN_ONLY: "true"
          ACTION: ${{ inputs.action }}
          NETWORKS: ${{ inputs.networks }}
          MAIN_INSTANCE_CLASS: ${{ inputs.main_instance_class }}
          TEST_INSTANCE_CLASS: ${{ inputs.test_instance_class }}
          DEAD_COLOR: ${{ needs.resolve-context.outputs.dead_color }}
        run: bash .github/workflows/scripts/scale_dead_prod_pg.sh

      # A single-AZ class change takes Postgres offline until the instance restarts.
      - name: Stop the services of those networks
        id: pause
        if: steps.plan.outputs.restart_networks != ''
        env:
          ACTION: pause
          NETWORKS: ${{ steps.plan.outputs.restart_networks }}
          DEAD_COLOR: ${{ needs.resolve-context.outputs.dead_color }}
          ECS_CLUSTER: ${{ needs.resolve-context.outputs.ecs_cluster }}
        run: bash .github/workflows/scripts/set_dead_prod_service_state.sh

      - name: Resize instances
        env:
          ACTION: ${{ inputs.action }}
          NETWORKS: ${{ inputs.networks }}
          MAIN_INSTANCE_CLASS: ${{ inputs.main_instance_class }}
          TEST_INSTANCE_CLASS: ${{ inputs.test_instance_class }}
          DEAD_COLOR: ${{ needs.resolve-context.outputs.dead_color }}
        run: bash .github/workflows/scripts/scale_dead_prod_pg.sh

      # Also after a failed resize, so a rejected class does not leave the colour stopped.
      - name: Start the stopped services again
        if: always() && steps.pause.outputs.was_running == 'true'
        env:
          ACTION: start
          NETWORKS: ${{ steps.plan.outputs.restart_networks }}
          DEAD_COLOR: ${{ needs.resolve-context.outputs.dead_color }}
          ECS_CLUSTER: ${{ needs.resolve-context.outputs.ecs_cluster }}
        run: bash .github/workflows/scripts/set_dead_prod_service_state.sh
