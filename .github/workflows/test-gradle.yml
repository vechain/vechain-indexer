name: Test (Gradle)

on:
  workflow_call:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  test-gradle:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [ api, common, e2e, indexer, indexer-core, thor-model ]
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Gradle Test
        run: ./gradlew :package:${{ matrix.package }}:cleanTest :package:${{ matrix.package }}:test

      - name: Copy HTML Test Report
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p static/${{ matrix.package }}
          if [ -d "packages/${{ matrix.package }}/build/reports/jacoco/test/html" ]; then
            cp -r packages/${{ matrix.package }}/build/reports/jacoco/test/html static/${{ matrix.package }}/coverage
            cp -r packages/${{ matrix.package }}/build/reports/tests/test static/${{ matrix.package }}/tests
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@v2
        if: github.ref == 'refs/heads/main'
        with:
          name: test-results-${{ github.head_ref || github.ref_name }}
          retention-days: 1
          path: static

      - name: Upload Test Results
        uses: dorny/test-reporter@v1
        with:
          artifact: test-results            # artifact name
          name: JEST Tests                  # Name of the check run which will be created
          path: 'src/${{ matrix.package }}/build/test-results/*.xml'                     # Path to test results (inside artifact .zip)
          reporter: jest-junit