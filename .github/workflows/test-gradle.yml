name: Test (Gradle)

on:
  pull_request:
  push:
    branches:
      - 'main'

permissions:
  contents: read
  id-token: write
  packages: write
  checks: write

concurrency:
  group: ${{ github.head_ref || github.ref_name }}-build-test
  cancel-in-progress: true

jobs:
  check-formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: "oracle"
          java-version: "21"

      - name: Grant execute permissions to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Gradle Spotless
        run: ./gradlew spotlessCheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [api, common, indexer]
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: 'oracle'
          java-version: '21'

      - name: Unit Test
        run: ./gradlew :package:${{ matrix.package }}:cleanTest :package:${{ matrix.package }}:test

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v3
        if: success() || failure()
        with:
          report_paths: packages/${{ matrix.package }}/build/test-results/test/TEST-*.xml

      - name: Copy HTML Test Report
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p static/${{ matrix.package }}
          if [ -d "packages/${{ matrix.package }}/build/reports/jacoco/test/html" ]; then
            cp -r packages/${{ matrix.package }}/build/reports/jacoco/test/html static/${{ matrix.package }}/coverage
            cp -r packages/${{ matrix.package }}/build/reports/tests/test static/${{ matrix.package }}/tests
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: test-results-${{ matrix.package }}-${{ github.head_ref || github.ref_name }}
          retention-days: 1
          path: static/${{ matrix.package }}

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: 'oracle'
          java-version: '21'

      - name: E2E Test
        run: make test-e2e

      - name: Debug E2E
        if: failure()
        run: |
          export INDEXER_ENV_FILE_NAME=packages/indexer/.env.example
          export API_ENV_FILE_NAME=packages/api/.env.example
          docker network ls
          docker ps
          docker ps -a
          docker network inspect vechain-database || true
          docker network inspect vechain-thor || true
          docker network inspect vechain || true
          docker compose logs

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v3
        if: success() || failure()
        with:
          report_paths: packages/e2e/build/test-results/test/TEST-*.xml

      - name: Copy HTML Test Report
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p static/e2e
          if [ -d "packages/e2e/build/reports/jacoco/test/html" ]; then
            cp -r packages/e2e/build/reports/jacoco/test/html static/e2e/coverage
            cp -r packages/e2e/build/reports/tests/test static/e2e/tests
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: test-results-e2e-${{ github.head_ref || github.ref_name }}
          retention-days: 1
          path: static/e2e