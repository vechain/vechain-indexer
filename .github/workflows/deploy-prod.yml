name: Prod Deployment Workflow

on:
  workflow_dispatch:
    inputs:
      deployment-strategy:
        description: 'Deployment strategy'
        required: true
        type: choice
        options:
          - regular (live environment)
          - blue/green (dead environment)
      version:
        description: 'The version of this release'
        required: true

jobs:
  identify-live-color:
    name: Identify Live and Dead Colors
    uses: ./.github/workflows/identify-live-color.yml
    with:
      dns_record_name: mainnet.live.prod.veworld.vechain.org.
      hosted_zone_id: Z074702037Q8JBHKIAYSD
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  set-deployment-env:
    needs: [identify-live-color]
    name: Determine Deployment Color
    runs-on: ubuntu-latest
    outputs:
      DEPLOYMENT_COLOR: ${{ steps.set-deployment-color.outputs.DEPLOYMENT_COLOR }}
    steps:
      - id: set-deployment-color
        run: |
          if [ "${{ inputs.deployment-strategy }}" == "regular (live environment)" ]; then
            echo "DEPLOYMENT_COLOR=${{ needs.identify-live-color.outputs.live_color }}" >> $GITHUB_ENV
          elif [ "${{ inputs.deployment-strategy }}" == "blue/green (dead environment)" ]; then
            echo "DEPLOYMENT_COLOR=${{ needs.identify-live-color.outputs.dead_color }}" >> $GITHUB_ENV
          fi
  
  deploy-prod-env:
    needs: [identify-live-color, set-deployment-env]
    name: Run Deployment - ${{ inputs.deployment-strategy}}
    uses: ./.github/workflows/plan-or-deploy-environment.yml
    with:
      environment: prod
      workspace: ${{ needs.set-deployment-env.outputs.DEPLOYMENT_COLOR }}
      # Force ensures environment is spun up if it does not already exist
      force: true
    permissions:
      packages: read
      contents: read
      id-token: write
    secrets: inherit

  log-live-environment:
    name: Log Live Environment
    needs: [identify-live-color]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Live environment is ${{ needs.identify-live-color.outputs.live_color }}"

  create-release:
    runs-on: ubuntu-latest
    needs: [set-deployment-env, deploy-prod-env]
    if: ${{ success() }}
    steps:
      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ inputs.version }}
          release_name: Release ${{ inputs.version }} - ${{ needs.set-deployment-env.outputs.DEPLOYMENT_COLOR }}
          draft: true
          prerelease: false
