name: Prod Deployment Workflow

on:
  workflow_dispatch:
    inputs:
      deployment-strategy:
        description: 'Deployment strategy'
        required: true
        type: choice
        options:
          - live environment
          - dead environment
      version:
        description: 'The version of this release'
        required: true

jobs:
  identify-live-color:
    name: Identify Live and Dead Colors
    uses: ./.github/workflows/identify-live-color.yml
    with:
      dns_record_mainnet_name: mainnet.live.prod.veworld.vechain.org.
      dns_record_testnet_name: testnet.live.prod.veworld.vechain.org.
      hosted_zone_id: Z08093993BM56HB3DD4U4
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  check-existing-release:
    name: Check Existing Releases
    runs-on: ubuntu-latest
    outputs:
      NEW_RELEASE: ${{ steps.check-release.outputs.NEW_RELEASE }}
    steps:
      - name: Check if deployment version already exists
        id: check-release
        run: |
          VERSION=${{ inputs.version }}
          RELEASES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases)
          if echo "$RELEASES" | jq -e ".[] | select(.tag_name==\"$VERSION\")"; then
            echo "NEW_RELEASE=false" >> $GITHUB_OUTPUT
          else
            echo "NEW_RELEASE=true" >> $GITHUB_OUTPUT
          fi

  retag-ecr-images:
    name: Retag ECR Images
    needs: [check-existing-release]
    secrets: inherit
    permissions:
      id-token: write
      contents: read
    if: needs.check-existing-release.outputs.NEW_RELEASE == 'true'
    strategy:
      matrix:
        ecr_repo: [veworld/indexer, veworld/api]
    uses: ./.github/workflows/retag-ecr-image.yml
    with:
      environment: prod
      repo_name: ${{ matrix.ecr_repo }}
      existing_tag: prod-latest
      new_tag: ${{ inputs.version }}

  set-deployment-env:
    needs: [identify-live-color]
    name: Determine Deployment Color
    runs-on: ubuntu-latest
    outputs:
      DEPLOYMENT_COLOR: ${{ steps.set-deployment-color.outputs.DEPLOYMENT_COLOR }}
    steps:
      - id: set-deployment-color
        run: |
          if [ "${{ inputs.deployment-strategy }}" == "live environment" ]; then
            echo "DEPLOYMENT_COLOR=${{ needs.identify-live-color.outputs.mainnet_live_color }}" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.deployment-strategy }}" == "dead environment" ]; then
            echo "DEPLOYMENT_COLOR=${{ needs.identify-live-color.outputs.mainnet_dead_color }}" >> $GITHUB_OUTPUT
          fi

  deploy-prod-env:
    needs: [retag-ecr-images, set-deployment-env]
    name: Run Deployment - ${{ inputs.deployment-strategy}}
    uses: ./.github/workflows/plan-or-deploy-environment.yml
    if: always() && (needs.retag-ecr-images.result == 'success' || needs.retag-ecr-images.result == 'skipped')
    with:
      environment: prod
      version: ${{ inputs.version }}
      workspace: ${{ needs.set-deployment-env.outputs.DEPLOYMENT_COLOR }}
      # Force ensures environment is spun up if it does not already exist
      force: true
    permissions:
      packages: read
      contents: read
      id-token: write
    secrets: inherit

  log-live-environment:
    name: Log Live Environment
    needs: [identify-live-color]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Live environment is ${{ needs.identify-live-color.outputs.mainnet_live_color }}"

  create-release:
    runs-on: ubuntu-latest
    needs: [set-deployment-env, deploy-prod-env]
    if: ${{ success() }}
    steps:
      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ inputs.version }}
          release_name: Release ${{ inputs.version }} - ${{ needs.set-deployment-env.outputs.DEPLOYMENT_COLOR }}
          draft: true
          prerelease: false
