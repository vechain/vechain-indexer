name: Prod Deployment Workflow

on:
  workflow_dispatch:
    inputs:
      network:
        description: Which network to deploy
        required: true
        type: choice
        options:
          - testnet
          - mainnet
          - both
        default: both
      environment:
        description: Which color environment to deploy
        required: true
        type: choice
        options:
          - live
          - dead
        default: dead

# Required for authentication through GitHub OIDC
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout
  packages: read # This is required for pulling images from GHCR

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identify-live-color:
    name: Identify Live and Dead Colors
    uses: ./.github/workflows/identify-live-color.yml
    with:
      dns_record_mainnet_name: mainnet.live.prod.veworld.vechain.org.
      dns_record_testnet_name: testnet.live.prod.veworld.vechain.org.
      hosted_zone_id: Z08093993BM56HB3DD4U4
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}

  define-env-vars:
    name: Set Up Environment Variables
    needs: [identify-live-color]
    runs-on: ubuntu-latest
    outputs:
      MAINNET_VERSION: ${{ steps.distinguish-versions.outputs.MAINNET_VERSION }}
      TESTNET_VERSION: ${{ steps.distinguish-versions.outputs.TESTNET_VERSION }}
      DEPLOYMENT_COLOR: ${{ steps.set-environment.outputs.DEPLOYMENT_COLOR }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}
      - name: Set environment
        id: set-environment
        env:
          INPUT_NETWORK: ${{ inputs.network }}
          INPUT_ENV: ${{ inputs.environment }}
          MAINNET_LIVE: ${{ needs.identify-live-color.outputs.mainnet_live_color }}
          MAINNET_DEAD: ${{ needs.identify-live-color.outputs.mainnet_dead_color }}
          TESTNET_LIVE: ${{ needs.identify-live-color.outputs.testnet_live_color }}
          TESTNET_DEAD: ${{ needs.identify-live-color.outputs.testnet_dead_color }}
        run: |
          if [[ "$INPUT_NETWORK" == 'mainnet' || "$INPUT_NETWORK" == 'both' ]]; then
            if [[ "$INPUT_ENV" == 'live' ]]; then
              echo "DEPLOYMENT_COLOR=$MAINNET_LIVE" >> $GITHUB_OUTPUT
            elif [[ "$INPUT_ENV" == 'dead' ]]; then
              echo "DEPLOYMENT_COLOR=$MAINNET_DEAD" >> $GITHUB_OUTPUT
            fi
          elif [[ "$INPUT_NETWORK" == 'testnet' ]]; then
            if [[ "$INPUT_ENV" == 'live' ]]; then
              echo "DEPLOYMENT_COLOR=$TESTNET_LIVE" >> $GITHUB_OUTPUT
            elif [[ "$INPUT_ENV" == 'dead' ]]; then
              echo "DEPLOYMENT_COLOR=$TESTNET_DEAD" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Get current version
        id: get-current-version
        # Read the currently-deployed image version from the *target* color, not the live
        # color. plan-or-apply-terraform.yml rewrites both main:image_version and
        # test:image_version on every apply, so when only one network is being deployed,
        # the un-deployed network's CURRENT_* must reflect what is actually running on
        # the target color. Reading from the live color caused inadvertent downgrades on
        # the dead environment when colors diverged across networks (e.g. live mainnet on
        # blue, live testnet on green).
        # Falls back to the live color when the target color has no task definition yet
        # (fresh dead environment); INPUT_NETWORK=both will overwrite both versions
        # explicitly anyway.
        env:
          TARGET_COLOR: ${{ steps.set-environment.outputs.DEPLOYMENT_COLOR }}
          MAINNET_LIVE: ${{ needs.identify-live-color.outputs.mainnet_live_color }}
          TESTNET_LIVE: ${{ needs.identify-live-color.outputs.testnet_live_color }}
        run: |
          read_image_tag() {
            local task_def="$1"
            aws ecs describe-task-definition \
              --task-definition "$task_def" \
              --query "taskDefinition.containerDefinitions[0].image" \
              --output text 2>/dev/null \
            | awk -F: 'NF>1 {print $NF}'
          }

          MAINNET_IMAGE_VERSION=$(read_image_tag "${TARGET_COLOR}-veworld-main-api")
          if [ -z "$MAINNET_IMAGE_VERSION" ]; then
            echo "No task definition for ${TARGET_COLOR}-veworld-main-api; falling back to ${MAINNET_LIVE}"
            MAINNET_IMAGE_VERSION=$(read_image_tag "${MAINNET_LIVE}-veworld-main-api")
          fi

          TESTNET_IMAGE_VERSION=$(read_image_tag "${TARGET_COLOR}-veworld-test-api")
          if [ -z "$TESTNET_IMAGE_VERSION" ]; then
            echo "No task definition for ${TARGET_COLOR}-veworld-test-api; falling back to ${TESTNET_LIVE}"
            TESTNET_IMAGE_VERSION=$(read_image_tag "${TESTNET_LIVE}-veworld-test-api")
          fi

          echo "CURRENT_MAINNET_VERSION=${MAINNET_IMAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "CURRENT_TESTNET_VERSION=${TESTNET_IMAGE_VERSION}" >> $GITHUB_OUTPUT
      - name: Set version
        id: set-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REF_NAME" == "main" ]]; then
            LATEST_TAG=$(git tag | sort -V | tail -n1)
            echo "VERSION=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REF_NAME" == v.* ]]; then
            echo "VERSION=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "Unrecognised version. Please select an existing version tag to deploy."
            exit 1
          fi
      - name: Distinguish versions
        id: distinguish-versions
        env:
          INPUT_NETWORK: ${{ inputs.network }}
          SET_VERSION: ${{ steps.set-version.outputs.VERSION }}
          CURRENT_MAINNET: ${{ steps.get-current-version.outputs.CURRENT_MAINNET_VERSION }}
          CURRENT_TESTNET: ${{ steps.get-current-version.outputs.CURRENT_TESTNET_VERSION }}
        run: |
          if [[ "$INPUT_NETWORK" == "mainnet" || "$INPUT_NETWORK" == "both" ]]; then
            echo "MAINNET_VERSION=$SET_VERSION" >> $GITHUB_OUTPUT
          else
            echo "MAINNET_VERSION=$CURRENT_MAINNET" >> $GITHUB_OUTPUT
          fi
          if [[ "$INPUT_NETWORK" == "testnet" || "$INPUT_NETWORK" == "both" ]]; then
            echo "TESTNET_VERSION=$SET_VERSION" >> $GITHUB_OUTPUT
          else
            echo "TESTNET_VERSION=$CURRENT_TESTNET" >> $GITHUB_OUTPUT
          fi

  promote-to-ecr:
    name: Promote GHCR Image to ECR - ${{ matrix.packageName }}
    needs: [define-env-vars]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        packageName: ["api", "indexer"]
    env:
      GHCR_REGISTRY: ghcr.io
      GHCR_REPO: ${{ github.repository }}
      ECR_PROJECT: veworld
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        env:
          MAINNET_VERSION: ${{ needs.define-env-vars.outputs.MAINNET_VERSION }}
          TESTNET_VERSION: ${{ needs.define-env-vars.outputs.TESTNET_VERSION }}
          INPUT_NETWORK: ${{ inputs.network }}
        run: |
          # GHCR tags have the v. prefix stripped (v.1.0.0 -> 1.0.0)
          echo "MAINNET_GHCR_TAG=$(echo "$MAINNET_VERSION" | sed 's/^v\.//')" >> "$GITHUB_OUTPUT"
          echo "TESTNET_GHCR_TAG=$(echo "$TESTNET_VERSION" | sed 's/^v\.//')" >> "$GITHUB_OUTPUT"
          # ECR tags keep the original format (v.1.0.0)
          echo "MAINNET_ECR_TAG=$MAINNET_VERSION" >> "$GITHUB_OUTPUT"
          echo "TESTNET_ECR_TAG=$TESTNET_VERSION" >> "$GITHUB_OUTPUT"
          # When deploying both, check if versions differ to avoid redundant copy
          if [ "$INPUT_NETWORK" = "both" ] && [ "$MAINNET_VERSION" = "$TESTNET_VERSION" ]; then
            echo "SKIP_TESTNET=true" >> "$GITHUB_OUTPUT"
          else
            echo "SKIP_TESTNET=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy mainnet image from GHCR to ECR
        if: inputs.network == 'mainnet' || inputs.network == 'both'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          GHCR_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}/${{ matrix.packageName }}:${{ steps.tags.outputs.MAINNET_GHCR_TAG }}
          ECR_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_PROJECT }}/${{ matrix.packageName }}
        run: |
          docker pull --platform linux/arm64 "$GHCR_IMAGE"
          docker tag "$GHCR_IMAGE" "$ECR_IMAGE:${{ steps.tags.outputs.MAINNET_ECR_TAG }}"
          docker tag "$GHCR_IMAGE" "$ECR_IMAGE:latest"
          docker push "$ECR_IMAGE:${{ steps.tags.outputs.MAINNET_ECR_TAG }}"
          docker push "$ECR_IMAGE:latest"

      - name: Copy testnet image from GHCR to ECR
        if: (inputs.network == 'testnet' || inputs.network == 'both') && steps.tags.outputs.SKIP_TESTNET != 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          GHCR_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}/${{ matrix.packageName }}:${{ steps.tags.outputs.TESTNET_GHCR_TAG }}
          ECR_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_PROJECT }}/${{ matrix.packageName }}
        run: |
          docker pull --platform linux/arm64 "$GHCR_IMAGE"
          docker tag "$GHCR_IMAGE" "$ECR_IMAGE:${{ steps.tags.outputs.TESTNET_ECR_TAG }}"
          docker push "$ECR_IMAGE:${{ steps.tags.outputs.TESTNET_ECR_TAG }}"

      - name: Scan mainnet image in ECR
        if: inputs.network == 'mainnet' || inputs.network == 'both'
        env:
          REPO: ${{ env.ECR_PROJECT }}/${{ matrix.packageName }}
          TAG: ${{ steps.tags.outputs.MAINNET_ECR_TAG }}
        run: |
          set -euo pipefail
          aws ecr start-image-scan --repository-name "$REPO" --image-id imageTag="$TAG" || true
          aws ecr wait image-scan-complete --repository-name "$REPO" --image-id imageTag="$TAG"
          read CRIT HIGH MED <<< "$(aws ecr describe-image-scan-findings \
            --repository-name "$REPO" --image-id imageTag="$TAG" \
            --query 'imageScanFindings.findingSeverityCounts.[CRITICAL, HIGH, MEDIUM]' \
            --output text)"
          CRIT=${CRIT/None/0}; HIGH=${HIGH/None/0}; MED=${MED/None/0}
          echo "Findings for $REPO:$TAG — CRITICAL=$CRIT HIGH=$HIGH MEDIUM=$MED"
          if [ $((CRIT + HIGH + MED)) -gt 0 ]; then
            echo "::error::Vulnerabilities at MEDIUM or higher: CRITICAL=$CRIT HIGH=$HIGH MEDIUM=$MED"
            exit 1
          fi

      - name: Scan testnet image in ECR
        if: (inputs.network == 'testnet' || inputs.network == 'both') && steps.tags.outputs.SKIP_TESTNET != 'true'
        env:
          REPO: ${{ env.ECR_PROJECT }}/${{ matrix.packageName }}
          TAG: ${{ steps.tags.outputs.TESTNET_ECR_TAG }}
        run: |
          set -euo pipefail
          aws ecr start-image-scan --repository-name "$REPO" --image-id imageTag="$TAG" || true
          aws ecr wait image-scan-complete --repository-name "$REPO" --image-id imageTag="$TAG"
          read CRIT HIGH MED <<< "$(aws ecr describe-image-scan-findings \
            --repository-name "$REPO" --image-id imageTag="$TAG" \
            --query 'imageScanFindings.findingSeverityCounts.[CRITICAL, HIGH, MEDIUM]' \
            --output text)"
          CRIT=${CRIT/None/0}; HIGH=${HIGH/None/0}; MED=${MED/None/0}
          echo "Findings for $REPO:$TAG — CRITICAL=$CRIT HIGH=$HIGH MEDIUM=$MED"
          if [ $((CRIT + HIGH + MED)) -gt 0 ]; then
            echo "::error::Vulnerabilities at MEDIUM or higher: CRITICAL=$CRIT HIGH=$HIGH MEDIUM=$MED"
            exit 1
          fi

  prepare-dead-atlas:
    name: Prepare Dead Prod Atlas
    if: inputs.environment == 'dead'
    needs: [define-env-vars, promote-to-ecr]
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: terraform/api
    env:
      TARGET_WORKSPACE: ${{ needs.define-env-vars.outputs.DEPLOYMENT_COLOR }}
      TARGET_MAIN_CLUSTER: ${{ needs.define-env-vars.outputs.DEPLOYMENT_COLOR }}-Mainnet
      TARGET_TEST_CLUSTER: ${{ needs.define-env-vars.outputs.DEPLOYMENT_COLOR }}-Testnet
      MONGODB_ATLAS_PUBLIC_API_KEY: ${{ secrets.MONGO_PUBLIC_KEY }}
      MONGODB_ATLAS_PRIVATE_API_KEY: ${{ secrets.MONGO_PRIVATE_KEY }}
      MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGO_ORG_ID }}
      MONGODB_ATLAS_PROJECT_ID: ${{ secrets.MONGO_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: true

      - name: Install Atlas CLI
        env:
          ATLAS_CLI_VERSION: "1.56.0"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch="x86_64" ;;
            aarch64) arch="arm64" ;;
            *) echo "Unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          tarball="mongodb-atlas-cli_${ATLAS_CLI_VERSION}_linux_${arch}.tar.gz"
          url="https://github.com/mongodb/mongodb-atlas-cli/releases/download/atlascli/v${ATLAS_CLI_VERSION}/${tarball}"
          curl --fail --silent --show-error --location "${url}" -o "/tmp/${tarball}"
          tar -xzf "/tmp/${tarball}" -C /tmp
          sudo install -m 0755 "/tmp/mongodb-atlas-cli_${ATLAS_CLI_VERSION}_linux_${arch}/bin/atlas" /usr/local/bin/atlas
          atlas --version

      - name: Terraform Initialize
        run: terraform init -backend-config="environments/${TARGET_WORKSPACE}.config"

      - name: Terraform Workspace
        run: terraform workspace select "${TARGET_WORKSPACE}"

      - name: Detect target Atlas cluster state
        id: state
        env:
          ACTION: describe
          MAIN_CLUSTER: ${{ env.TARGET_MAIN_CLUSTER }}
          TEST_CLUSTER: ${{ env.TARGET_TEST_CLUSTER }}
        working-directory: ${{ github.workspace }}
        run: bash .github/workflows/scripts/set_dead_prod_atlas_state.sh

      - name: Import surviving Atlas resources into Terraform state
        env:
          MAIN_STATE: ${{ steps.state.outputs.main_cluster_state }}
          TEST_STATE: ${{ steps.state.outputs.test_cluster_state }}
        run: |
          set -euo pipefail

          import_if_missing() {
            local address="$1"
            local import_id="$2"

            if terraform state list | grep -Fxq "$address"; then
              echo "State already contains $address"
            else
              echo "Importing $address"
              terraform import "$address" "$import_id"
            fi
          }

          if [ "$MAIN_STATE" != "MISSING" ]; then
            import_if_missing "mongodbatlas_advanced_cluster.main_net[0]"       "${MONGODB_ATLAS_PROJECT_ID}-${TARGET_MAIN_CLUSTER}"
            import_if_missing "mongodbatlas_database_user.api_db_user[0]"       "${MONGODB_ATLAS_PROJECT_ID}-api-${TARGET_WORKSPACE}-admin"
            import_if_missing "mongodbatlas_database_user.indexer_db_user[0]"   "${MONGODB_ATLAS_PROJECT_ID}-indexer-${TARGET_WORKSPACE}-admin"
            import_if_missing "mongodbatlas_cloud_backup_schedule.main_net[0]"  "${MONGODB_ATLAS_PROJECT_ID}-${TARGET_MAIN_CLUSTER}"
          fi

          if [ "$TEST_STATE" != "MISSING" ]; then
            import_if_missing "mongodbatlas_advanced_cluster.test_net[0]"       "${MONGODB_ATLAS_PROJECT_ID}-${TARGET_TEST_CLUSTER}"
            import_if_missing "mongodbatlas_cloud_backup_schedule.test_net[0]"  "${MONGODB_ATLAS_PROJECT_ID}-${TARGET_TEST_CLUSTER}"
          fi

      - name: Unpause target Atlas clusters
        if: steps.state.outputs.main_cluster_state == 'PAUSED' || steps.state.outputs.test_cluster_state == 'PAUSED'
        env:
          ACTION: unpause
          MAIN_CLUSTER: ${{ env.TARGET_MAIN_CLUSTER }}
          TEST_CLUSTER: ${{ env.TARGET_TEST_CLUSTER }}
        working-directory: ${{ github.workspace }}
        run: bash .github/workflows/scripts/set_dead_prod_atlas_state.sh

  deploy-env:
    needs: [define-env-vars, promote-to-ecr, prepare-dead-atlas]
    if: always() && needs.promote-to-ecr.result == 'success' && (needs.prepare-dead-atlas.result == 'success' || needs.prepare-dead-atlas.result == 'skipped')
    name: Run Deployment - ${{ inputs.network}}
    uses: ./.github/workflows/plan-or-apply-terraform.yml
    with:
      environment: ${{ needs.define-env-vars.outputs.DEPLOYMENT_COLOR }}
      mainnet_version: ${{ needs.define-env-vars.outputs.MAINNET_VERSION }}
      testnet_version: ${{ needs.define-env-vars.outputs.TESTNET_VERSION }}
      # Force ensures environment is spun up if it does not already exist
      force: true
    permissions:
      packages: read
      contents: read
      id-token: write
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}
      VECHAINCI_SSH_PRIVATE_KEYS: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

  refresh-dead-dns:
    name: Refresh dead Route53 records
    needs: [identify-live-color, deploy-env]
    if: ${{ needs.deploy-env.result == 'success' && inputs.environment == 'dead' }}
    uses: ./.github/workflows/deploy-colour-agnostic-infra.yml
    with:
      environment: prod
      dead_records_only: true # Only target dead Route53 records in teraform apply
      live_color_mainnet: ${{ needs.identify-live-color.outputs.mainnet_live_color }}
      live_color_testnet: ${{ needs.identify-live-color.outputs.testnet_live_color }}
    secrets:
      AWS_ACC_ROLE: ${{ secrets.AWS_ACC_ROLE }}
      VECHAINCI_SSH_PRIVATE_KEYS: ${{ secrets.VECHAINCI_SSH_PRIVATE_KEYS }}

  log-live-environment:
    name: Log Live Environment
    needs: [identify-live-color]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Live mainnet environment is ${{ needs.identify-live-color.outputs.mainnet_live_color }}"

  manage-release:
    name: Refresh draft or publish release
    runs-on: ubuntu-latest
    needs: [define-env-vars, deploy-env]
    if: >-
      ${{ needs.deploy-env.result == 'success'
      && (inputs.network == 'mainnet' || inputs.network == 'both') }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.define-env-vars.outputs.MAINNET_VERSION }}
      INPUT_ENV: ${{ inputs.environment }}
    steps:
      - name: Check existing release state for tag
        id: check
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Existing release state for $TAG: $state"

      - name: Resolve previous published release tag
        if: steps.check.outputs.state != 'false'
        id: prev
        run: |
          set -euo pipefail
          prev=$(gh release list --exclude-drafts --exclude-pre-releases \
                   --limit 1 --json tagName --jq '.[0].tagName // empty')
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          echo "Previous published tag: ${prev:-<none>}"

      - name: Delete stale draft releases (dead deploy)
        if: steps.check.outputs.state != 'false' && env.INPUT_ENV == 'dead'
        run: |
          set -euo pipefail
          # Keep exactly one draft — the one representing the tag just staged
          # on the dead colour. switch-live-dns.yml publishes it when both
          # networks flip to that version.
          mapfile -t drafts < <(gh release list --limit 50 \
                                  --json tagName,isDraft \
                                  --jq '.[] | select(.isDraft) | .tagName')
          if [ "${#drafts[@]}" -eq 0 ]; then
            echo "No existing drafts."
          else
            for d in "${drafts[@]}"; do
              echo "Deleting draft: $d"
              gh release delete "$d" --yes
            done
          fi

      - name: Create draft release (dead deploy)
        if: steps.check.outputs.state != 'false' && env.INPUT_ENV == 'dead'
        env:
          PREVIOUS: ${{ steps.prev.outputs.previous }}
        run: |
          set -euo pipefail
          args=(--draft --title "Release $TAG" --generate-notes)
          [ -n "$PREVIOUS" ] && args+=(--notes-start-tag "$PREVIOUS")
          gh release create "$TAG" "${args[@]}"
          echo "Draft release $TAG created (baseline: ${PREVIOUS:-<none>})."

      - name: Publish release (live deploy)
        if: steps.check.outputs.state != 'false' && env.INPUT_ENV == 'live'
        env:
          PREVIOUS: ${{ steps.prev.outputs.previous }}
          STATE: ${{ steps.check.outputs.state }}
        run: |
          set -euo pipefail
          if [ "$STATE" = "true" ]; then
            echo "Publishing existing draft $TAG as latest"
            gh release edit "$TAG" --draft=false --latest
          else
            args=(--title "Release $TAG" --generate-notes --latest)
            [ -n "$PREVIOUS" ] && args+=(--notes-start-tag "$PREVIOUS")
            gh release create "$TAG" "${args[@]}"
            echo "Published release $TAG (baseline: ${PREVIOUS:-<none>})."
          fi
