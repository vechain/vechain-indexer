name: Prod Deployment Workflow

on:
  workflow_dispatch:
    inputs:
      deployment-strategy:
        description: 'Deployment strategy'
        required: true
        type: choice
        options:
          - regular
          - blue/green
      version:
        description: 'The version of this release'
        required: true

jobs:
  identify-live-color:
    uses: ./.github/workflows/identify-live-color.yml
    with:
      dns_record_name: mainnet.live.prod.veworld.vechain.org.
      hosted_zone_id: Z074702037Q8JBHKIAYSD
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  deploy-prod-environment:
    needs: [identify-live-color]
    name: Deploy Prod via Chosen Strategy
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Deploy to Live Color
        if: ${{ inputs.deployment-strategy == 'regular' }}
        uses: ./.github/workflows/plan-or-deploy-environment.yml
        with:
          environment: prod
          workspace: ${{ needs.identify-live-color.outputs.live_color }}

      - name: Deploy to Dead Color
        if: ${{ inputs.deployment-strategy == 'blue/green' }}
        uses: ./.github/workflows/plan-or-deploy-environment.yml
        with:
          environment: prod
          workspace: ${{ needs.identify-live-color.outputs.dead_color }}
          force: true

  log-live-environment:
    name: Log Live Environment
    needs: [identify-live-color]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Live environment is ${{ needs.identify-live-color.outputs.live_color }}"

  create-release:
    name: Draft New Release
    runs-on: ubuntu-latest
    needs: [deploy-prod-environment]
    if: ${{ needs.deploy-prod-environment.result == 'success' }}
    steps:
      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ inputs.version }}
          release_name: Release ${{ inputs.version }}
          draft: true
          prerelease: false
