version: "3.5"

services:

  vechain-indexer:
    image: vechain-indexer
    container_name: vechain-indexer
    restart: "no"
    env_file: .env
    networks:
      - vechain
      - vechain-database

networks:
  vechain:
    driver: bridge
    name: vechain
  vechain-database:
    external: true
    name: vechain-database
