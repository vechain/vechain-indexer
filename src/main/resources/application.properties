spring.profiles.active=mongo-auth-password,prod

# MongoDB
spring.data.mongodb.uri=mongodb://mongo-node1:27017,mongo-node2:27018,mongo-node3:27019/vechain
spring.data.mongodb.database=vechain
server.ssl.trusted-certificates=/etc/ssl/cert.pem

# Cache
spring.cache.cache-names=blocks
spring.cache.caffeine.spec=maximumSize=50000,expireAfterAccess=6000s