version: '3.5'

services:
  mongo-node1:
    hostname: mongo-node1
    image: mongo:6
    expose:
      - 27017
    ports:
      - 27017:27017
    restart: always
    volumes:
      - vechain-data-1:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: admin
    deploy:
      resources:
        limits:
          memory: 4096m
        reservations:
          memory: 1024m
    networks:
      - vechain-database

networks:
  vechain-database:
    driver: bridge
    name: vechain-database

volumes:
  vechain-data-1:
