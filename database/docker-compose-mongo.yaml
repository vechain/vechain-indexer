version: '3.5'

services:
  mongo-node1:
    hostname: mongo-node1
    image: mongo:6
    command: [ "--replSet", "rs0", "--keyFile", "/data/keys/keyfile" ]
    expose:
      - 27017
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - vechain-data-1:/data/db
      - ./keys:/data/keys
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: vechain
    networks:
      - vechain-database

networks:
  vechain-database:
    driver: bridge
    name: vechain-database

volumes:
  vechain-data-1:
