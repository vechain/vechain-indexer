version: "3.5"

services:
  mongo-setup:
    image: mongo:6
    volumes:
      - ./scripts:/scripts
    restart: "no"
    entrypoint:
      [ "bash", "/scripts/setup.sh", "mongo-node1", "mongo-node2", "mongo-node3" ]
    networks:
      - vechain-database

networks:
  vechain-database:
    name: vechain-database
