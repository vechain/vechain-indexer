version: "3.5"

services:
  mongo-setup:
    image: mongo:6
    volumes:
      - ./scripts:/scripts
    environment:
      - MONGO_HOST=mongo-node1
      - MONGO_ADMIN_USER=root
      - MONGO_ADMIN_PASSWORD=password
      - MONGO_INDEXER_USER=indexer
      - MONGO_INDEXER_PASSWORD=password
      - MONGO_API_USER=api
      - MONGO_API_PASSWORD=password
    restart: "no"
    entrypoint:
      [ "bash", "/scripts/setup.sh" ]

    networks:
      - vechain-database

networks:
  vechain-database:
    name: vechain-database
