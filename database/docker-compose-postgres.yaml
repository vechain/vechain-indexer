services:
  postgres:
    image: postgres:16
    container_name: vechain-postgres
    command:
      - postgres
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=64MB
      - -c
      - wal_buffers=64MB
      - -c
      - synchronous_commit=off
    environment:
      POSTGRES_DB: vechain
      POSTGRES_USER: vechain
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - vechain-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vechain -d vechain" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vechain-database

networks:
  vechain-database:
    driver: bridge
    name: vechain-database

volumes:
  vechain-postgres-data:
